*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;background:#f2f1ed;color:#1a1a18;min-height:100vh}
:root{
  --bg:#f2f1ed;--card:#fff;--border:#e4e2db;--border2:#ccc;
  --text:#1a1a18;--text2:#666;--text3:#aaa;
  --blue:#378ADD;--green:#1D9E75;--amber:#EF9F27;--red:#E24B4A;
  --r:10px;--r2:14px
}

.app{max-width:1040px;margin:0 auto;padding:18px 14px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:17px;font-weight:700;letter-spacing:-.03em}
.logo em{color:var(--blue);font-style:normal}
.logo-jido{font-family:'JidoFont',sans-serif;font-weight:normal;letter-spacing:.3em}
.sync-bar{display:flex;align-items:center;gap:7px}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text3);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px}
.dot{width:6px;height:6px;border-radius:50%;background:#ccc;flex-shrink:0}
.dot.ok{background:var(--green)}.dot.syncing{background:var(--amber);animation:blink 1s infinite}.dot.err{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.bsm{font-size:12px;padding:5px 11px;border-radius:7px;border:1px solid var(--border2);background:var(--card);cursor:pointer;font-family:inherit;color:var(--text2);transition:all .15s}
.bsm:hover{background:var(--bg)}
.bsm.pri{background:var(--blue);color:#fff;border-color:var(--blue)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:all .15s;position:relative}

.trow.selected{border-color:var(--blue);background:#f0f7ff}
.card:last-child{margin-bottom:0}
.card:hover{border-color:#a8c8e8;box-shadow:0 2px 8px rgba(55,138,221,.1)}
.card-proj{font-size:10px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:4px}

/* jido. tags: SALES/CONTENT/STUDIO/WEB/STRATEGY */

/* ── Tree List ── */

.task-list-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px}

.tl-filter-btn{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit;color:var(--text2);transition:all .15s;white-space:nowrap}

.tree-node{}
.tree-row{display:flex;align-items:center;gap:0;padding:7px 10px;background:var(--card);border-radius:var(--r);border:1px solid var(--border);cursor:pointer;transition:all .15s;position:relative}
.tree-row:hover{border-color:#a8c8e8}
.tree-indent{flex-shrink:0}
.tree-toggle{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:10px;color:var(--text3);flex-shrink:0;cursor:pointer;transition:transform .15s}

.chk{width:16px;height:16px;border:1.5px solid #ccc;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s;cursor:pointer;margin-right:8px}

.tree-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tree-prog{font-size:11px;color:var(--text3)}
.tree-date{font-size:11px;color:var(--text3)}

.tree-children{margin-left:0;margin-top:1px;display:flex;flex-direction:column;gap:1px}

.cal-task-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px;position:sticky;top:10px;max-height:calc(100vh - 140px);overflow-y:auto}

.cal-task-date{font-size:10px;color:var(--text3);flex-shrink:0;min-width:32px}
.cal-task-name{flex:1;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-task-name.done{text-decoration:line-through;color:var(--text3)}
.cal-section-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px 4px 4px;margin-top:4px}
.cal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.cal-m{font-size:15px;font-weight:600}
.cal-nav{display:flex;gap:5px}
.nbtn{width:28px;height:28px;border:1px solid var(--border2);background:var(--card);border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2)}

.gl{display:none}
.dl{font-size:11px;font-weight:600;text-align:center;color:var(--text3);padding:6px 0;height:28px;display:flex;align-items:center;justify-content:center}

.cg-full{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}

.ev{font-size:10px;padding:2px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;flex-shrink:0;line-height:1.4}

/* Daily */
.daily-date{font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:500}

.sec-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.daily-sub-tabs{display:flex;gap:2px;background:#e4e2db;padding:3px;border-radius:8px;margin-bottom:12px;width:fit-content}
.dstab{padding:5px 13px;font-size:12px;font-family:inherit;border:none;background:none;cursor:pointer;border-radius:6px;color:var(--text2);font-weight:500;transition:all .15s}
.dstab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.09)}
/* task list */
.daily-tasks{display:flex;flex-direction:column;gap:5px}

.time-input{width:52px;font-size:13px;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;text-align:center}

.time-lbl{font-size:11px;color:var(--text3)}
/* timeline */
.timeline-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow-y:auto;overflow-x:hidden;position:relative;height:calc(100vh - 200px);min-height:400px;cursor:default}
/* tl-inner defined below */
.tl-row{display:flex;min-height:54px;border-bottom:1px solid var(--border);position:relative}
.tl-row:last-child{border-bottom:none}
.tl-row.is-now{background:#fef9f0}
.tl-hour{width:50px;flex-shrink:0;font-size:11px;color:var(--text3);font-weight:500;padding:8px 8px 0;text-align:right;border-right:1px solid var(--border)}

.tl-add{width:100%;text-align:left;font-size:12px;color:var(--text3);background:none;border:1.5px dashed transparent;cursor:pointer;padding:3px 4px;border-radius:5px;font-family:inherit;opacity:0;transition:all .15s}

.daily-date-label{font-size:15px;font-weight:600;color:var(--text);min-width:160px;text-align:center}
.dnav-btn{width:28px;height:28px;border:1px solid var(--border2);background:var(--card);border-radius:7px;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center}

.daily-tl-panel{}

.todo-input-wrap{margin-bottom:10px}
.todo-input{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}

.todo-list{display:flex;flex-direction:column;gap:3px;max-height:calc(100vh - 280px);overflow-y:auto}

.remaining-header{font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:0 4px}

.todo-name{flex:1;font-size:13px;line-height:1.3}

.tl-inner{position:relative;overflow:visible;height:1440px;min-height:1440px}
.tl-row{display:flex;height:30px;border-bottom:1px solid var(--border)}
.tl-row.half{border-bottom:1px dashed #f0ede8}
.tl-row:last-child{border-bottom:none}
.tl-row.is-now{background:#fffbf0}
.tl-hour{width:52px;flex-shrink:0;font-size:11px;color:var(--text3);font-weight:500;padding:4px 8px 0;text-align:right;border-right:1px solid var(--border);align-self:flex-start}

.todo-more{width:24px;height:24px;border:none;background:none;cursor:pointer;color:var(--text3);font-size:16px;display:flex;align-items:center;justify-content:center;border-radius:5px;flex-shrink:0;padding:0}
.todo-more:hover{background:var(--bg);color:var(--text)}
.tl-block:hover{box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tl-block.dragging-block{opacity:.7;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.tl-block-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600}
.tl-block-time{font-size:10px;opacity:.75}
.tl-block-resize{position:absolute;bottom:0;left:0;right:0;height:14px;cursor:ns-resize;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.12));border-radius:0 0 6px 6px}
.tl-now-wrap{position:absolute;left:0;right:0;pointer-events:none;z-index:5}
.tl-now-line{position:absolute;left:52px;right:0;height:2px;background:var(--red)}
.tl-now-circle{position:absolute;left:46px;width:8px;height:8px;border-radius:50%;background:var(--red);top:-3px}
.tl-add{position:absolute;inset:0;cursor:pointer;z-index:1}

/* Weekly */
.weekly-split{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
@media(max-width:700px){.weekly-split{grid-template-columns:1fr}}
.weekly-todo-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px;position:sticky;top:10px;max-height:calc(100vh - 160px);overflow-y:auto}
.weekly-tl-panel{}
.weekly-tl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:auto;max-height:calc(100vh - 180px)}
.weekly-grid{min-width:560px}
.weekly-header{display:grid;border-bottom:2px solid var(--border);position:sticky;top:0;background:var(--card);z-index:20}
.weekly-day-hd{font-size:12px;font-weight:600;text-align:center;padding:8px 4px;border-right:1px solid var(--border);color:var(--text2);cursor:pointer}
.weekly-allday-row{display:grid;border-bottom:1px solid var(--border);background:var(--bg)}
.weekly-allday-cell{border-right:1px solid var(--border);padding:2px 3px;min-height:20px;font-size:10px}
.weekly-allday-ev{background:#4285f422;color:#4285f4;border-radius:3px;padding:1px 4px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.weekly-day-hd:last-child{border-right:none}
.weekly-day-hd:hover{color:var(--blue)}
.weekly-day-hd.today-col{color:var(--blue);font-weight:700}
.weekly-body{display:grid;position:relative}
.weekly-time-axis{position:absolute;left:0;top:0;width:44px;bottom:0;pointer-events:none;z-index:10}
.weekly-time-label{position:absolute;right:6px;font-size:10px;color:var(--text3);transform:translateY(-50%);white-space:nowrap}
.weekly-day-col{position:absolute;top:0;bottom:0;border-right:1px solid var(--border)}
.weekly-day-col:last-child{border-right:none}
.weekly-hour-line{position:absolute;left:0;right:0;border-top:1px solid var(--border);pointer-events:none}
.weekly-half-line{position:absolute;left:0;right:0;border-top:1px dashed #f0ede8;pointer-events:none}
.weekly-drop-zone{position:absolute;left:2px;right:2px;z-index:1;border-radius:4px}
.weekly-drop-zone.drag-over{background:#E6F1FB;outline:2px dashed var(--blue)}
.weekly-now-line{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:15;pointer-events:none}
.weekly-now-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--red);z-index:15;transform:translate(-50%,-50%)}
.weekly-day-col{position:relative;overflow:visible}
.weekly-block{position:absolute;border-radius:5px;padding:2px 5px;font-size:11px;font-weight:600;overflow:visible;z-index:5;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.1);user-select:none}
.weekly-block-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.weekly-block-time{font-size:9px;opacity:.75}
.weekly-block-resize{position:absolute;bottom:-3px;left:0;right:0;height:16px;cursor:ns-resize;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.25));border-radius:0 0 5px 5px;z-index:10}

.rt-proj{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:8px;overflow:hidden}
.rt-proj-head{display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer;transition:background .15s;user-select:none}
.rt-proj-head:hover{background:var(--bg)}
.rt-arrow{font-size:10px;color:var(--text3);width:12px;flex-shrink:0;transition:transform .2s}
.rt-proj-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.rt-proj-name{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.rt-proj-time{font-size:14px;font-weight:700;flex-shrink:0}
.rt-proj-body{border-top:1px solid var(--border);padding:4px 0}
.rt-task-wrap{}
.rt-task{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;transition:background .15s}
.rt-task:hover{background:var(--bg)}
.rt-sub-arrow{font-size:9px;color:var(--text3);width:12px;flex-shrink:0}
.rt-task-chk{width:16px;height:16px;border-radius:4px;border:1.5px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.rt-task-chk.done{background:var(--green);border-color:var(--green);color:#fff}
.rt-task-name{flex:1;font-size:13px;color:var(--text)}
.rt-pending{color:var(--text3)}
.rt-task-time{font-size:12px;font-weight:600;color:var(--text2);flex-shrink:0}

/* Monthly */
.monthly-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.monthly-day-lbl{font-size:11px;font-weight:700;text-align:center;color:var(--text3);padding:6px 0;letter-spacing:.04em}
.monthly-cell{min-height:110px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.monthly-cell:hover{border-color:#a8c8e8}
.monthly-cell.today{border-color:var(--blue)}
.monthly-cell.other-month{background:var(--bg);opacity:.5}
.monthly-day-num{font-size:12px;font-weight:600;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:3px;flex-shrink:0}
.monthly-cell.today .monthly-day-num{background:var(--blue);color:#fff;border-radius:50%}
.monthly-ev{font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;cursor:pointer}
.monthly-more{font-size:10px;color:var(--text3);padding-left:3px}

/* Report */
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
@media(max-width:680px){.report-grid{grid-template-columns:1fr 1fr}}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:15px}
.rcard-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rcard-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.rcard-name{font-size:13px;font-weight:600}
.rcard-h{font-size:24px;font-weight:700;margin-bottom:2px}
.rcard-sub{font-size:11px;color:var(--text3)}
.rcard-bar{height:4px;background:var(--bg);border-radius:2px;margin-top:10px;overflow:hidden}
.rcard-fill{height:100%;border-radius:2px}
.report-log{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.log-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.log-row:last-child{border-bottom:none}
.log-date{font-size:12px;color:var(--text3);min-width:68px}
.log-proj{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;flex:1}
.log-task{font-size:12px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-h{font-size:13px;font-weight:600}

/* Projects tab */
.proj-list{display:flex;flex-direction:column;gap:8px}
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.proj-card.proj-drop-target{border-color:var(--blue);background:#f0f7ff;box-shadow:0 0 0 2px var(--blue)33}
.proj-card:hover{border-color:#a8c8e8}
.proj-icon-big{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:14px;font-weight:600}
.proj-meta{font-size:12px;color:var(--text3);margin-top:2px}
.proj-stats{display:flex;gap:14px;flex-shrink:0}
.proj-stat{text-align:center}
.proj-stat-n{font-size:15px;font-weight:700}
.proj-stat-l{font-size:11px;color:var(--text3)}

/* ── Side Panel ── */
.side-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:150}
.side-overlay.open{display:block}
.side-panel{position:fixed;top:0;right:0;width:420px;max-width:96vw;height:100vh;background:var(--card);border-left:1px solid var(--border);z-index:160;overflow-y:auto;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.side-panel.open{transform:translateX(0)}
.sp-header{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 0}
.sp-close{width:28px;height:28px;border:1px solid var(--border);border-radius:7px;background:none;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto}
.sp-close:hover{background:var(--bg)}
.sp-body{padding:14px 18px 24px}
.sp-title-input{width:100%;font-size:16px;font-weight:600;border:none;background:none;color:var(--text);font-family:inherit;outline:none;padding:0;margin-bottom:10px}
.sp-title-input:focus{border-bottom:1.5px solid var(--blue)}
.sp-field{margin-bottom:12px}
.sp-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.sp-select,.sp-date{font-size:13px;padding:6px 9px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.sp-select:focus,.sp-date:focus{border-color:var(--blue)}
.sp-memo{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;resize:vertical;min-height:60px}
.sp-memo:focus{border-color:var(--blue)}
.sp-row{display:flex;gap:10px}
.sp-row .sp-field{flex:1}
.sp-divider{height:1px;background:var(--border);margin:16px 0}
.sp-subtasks-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sp-prog{font-size:12px;color:var(--text3)}
.sp-prog-bar{height:4px;background:#eee;border-radius:2px;margin-bottom:12px;overflow:hidden}
.sp-prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.sp-subtask-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.sp-sub-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:all .15s}
.sp-sub-row:hover{border-color:#a8c8e8;background:#fff}
.sp-sub-name{flex:1;font-size:13px}
.sp-sub-name.done{text-decoration:line-through;color:var(--text3)}
.sp-sub-date{font-size:11px;color:var(--text3);flex-shrink:0}
.sp-sub-chevron{font-size:11px;color:var(--text3)}
.btn-add-sub{width:100%;font-size:13px;padding:8px;border:1.5px dashed var(--border2);border-radius:7px;background:none;cursor:pointer;color:var(--text3);font-family:inherit;transition:all .15s}
.btn-add-sub:hover{border-color:var(--blue);color:var(--blue);background:#f0f7ff}
.sp-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.btn-del-task{font-size:12px;padding:7px 12px;border:1px solid #ffd0d0;border-radius:7px;background:none;cursor:pointer;color:var(--red);font-family:inherit}
.btn-del-task:hover{background:#fff0f0}
.btn-save-task{font-size:13px;padding:8px 16px;border:none;border-radius:7px;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.btn-save-task:hover{background:#2a6fb0}
.sp-breadcrumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text3);margin-bottom:12px;flex-wrap:wrap}
.sp-bc-item{cursor:pointer;color:var(--blue)}
.sp-bc-item:hover{text-decoration:underline}
.sp-bc-sep{color:var(--text3)}

/* Modals */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r2);padding:22px;width:340px;max-width:94vw;box-shadow:0 10px 50px rgba(0,0,0,.18)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px}
.field{margin-bottom:11px}
.field label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border2);border-radius:7px;background:#fafaf8;color:var(--text);font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field textarea{resize:vertical;min-height:55px}
.emoji-picker-wrap{position:relative;display:inline-block}
.emoji-preview-btn{font-size:28px;width:52px;height:52px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.emoji-preview-btn:hover{border-color:var(--blue);background:#E6F1FB}
.emoji-picker-popup{position:fixed;background:var(--card);border:1px solid var(--border2);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:2000;width:300px;padding:12px;display:none}
.emoji-picker-popup.open{display:block}
.emoji-search{width:100%;font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;margin-bottom:8px}
.emoji-search:focus{border-color:var(--blue)}
.emoji-cats{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.emoji-cat-btn{font-size:14px;padding:4px 7px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;transition:all .15s}
.emoji-cat-btn.active{background:var(--blue);border-color:var(--blue)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:200px;overflow-y:auto}
.emoji-opt{font-size:20px;width:32px;height:32px;border:none;background:none;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:background .1s}
.emoji-opt:hover{background:var(--bg)}
.emoji-opt.sel{background:var(--blue)22;outline:2px solid var(--blue);border-radius:6px}
.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:4px}
.color-opt{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-opt.sel{border-color:var(--text);transform:scale(1.15)}
.modal-btns{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.btn-del{font-size:12px;padding:7px 12px;border:1px solid #ffd0d0;border-radius:7px;background:none;cursor:pointer;color:var(--red);font-family:inherit}
.btn-del:hover{background:#fff0f0}
.btn-r{display:flex;gap:7px}
.btn-cancel{font-size:13px;padding:7px 13px;border:1px solid var(--border2);border-radius:7px;background:none;cursor:pointer;color:var(--text2);font-family:inherit}
.btn-cancel:hover{background:var(--bg)}
.btn-save{font-size:13px;padding:7px 15px;border:none;border-radius:7px;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.btn-save:hover{background:#2a6fb0}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;font-size:13px;padding:9px 17px;border-radius:9px;z-index:400;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.confirm-box{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 18px;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,.18);display:flex;align-items:center;gap:12px;white-space:nowrap}
.confirm-box.hide{display:none}
.confirm-msg{font-size:13px;color:var(--text)}
.confirm-yes{font-size:12px;padding:6px 13px;border:none;border-radius:7px;background:var(--red);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.confirm-no{font-size:12px;padding:6px 13px;border:1px solid var(--border2);border-radius:7px;background:none;cursor:pointer;font-family:inherit;color:var(--text2)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo"><span class="logo-jido">jido.<em style="color:var(--blue);font-style:normal">pm</em></span></div>
    <div class="sync-bar">
      <div class="sync-pill"><span class="dot" id="sync-dot"></span><span id="sync-text">로그인 필요</span></div>
      <button class="bsm" id="btn-notion-sync" onclick="syncFromNotion()" title="Notion Projects와 Tasks 가져오기">Notion 동기화</button>
      <button class="bsm pri" id="btn-signin" onclick="signIn()">Google 로그인</button>
      <button class="bsm" id="btn-migrate" onclick="migrateToTasksCalendar()" style="display:none" title="기존 일정을 Tasks 캘린더로 이전">📦 Tasks로 이전</button>
      <button class="bsm" id="btn-signout" onclick="signOut()" style="display:none">로그아웃</button>
    </div>
  </div>
  <div class="nav">
    <div class="nav-tabs">
      <button class="ntab active" onclick="switchTab('board')">보드</button>
      <button class="ntab" onclick="switchTab('list')">목록</button>
      <button class="ntab" onclick="switchTab('cal')">먼슬리</button>
      <button class="ntab" onclick="switchTab('daily')">데일리</button>
      <button class="ntab" onclick="switchTab('weekly')">위클리</button>
      <button class="ntab" onclick="switchTab('report')">리포트</button>
    </div>
    <div class="proj-filter" id="proj-filter"></div>
    <button class="btn-new" onclick="openNewTask()">+ 새 작업</button>
  </div>

  <div id="view-board" class="view active">
    <div class="stats" id="stats"></div>
    <div class="board" id="board"></div>
  </div>
  <div id="view-list" class="view">
    <div class="list-split">
      <!-- Left: Task list -->
      <div class="task-list-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div class="sec-title" style="margin:0">작업 목록</div>
          <span style="font-size:12px;color:var(--text3)" id="task-list-count"></span>
        </div>
        <div class="task-list-filter" id="task-list-filter"></div>
        <div class="task-list-items" id="task-list-items"></div>
      </div>
      <!-- Right: Project tree -->
      <div class="proj-tree-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div class="sec-title" style="margin:0">프로젝트</div>
          <button class="bsm pri" onclick="openProjModal(null)">+ 새 프로젝트</button>
        </div>
        <div id="proj-tree-wrap"></div>
      </div>
    </div>
  </div>
  <div id="view-cal" class="view">
    <div class="cal-split">
      <div class="cal-task-panel">
        <div class="cal-hd" style="margin-bottom:14px">
          <span class="cal-m" id="cal-month"></span>
          <div class="cal-nav">
            <button class="nbtn" onclick="changeMonth(-1)">&#8249;</button>
            <button class="nbtn" onclick="changeMonth(1)">&#8250;</button>
          </div>
        </div>
        <div class="sec-title" style="margin-bottom:8px">이달의 작업</div>
        <div id="cal-task-list" class="cal-task-list"></div>
      </div>
      <div class="cal-grid-panel">
        <div class="cg-full" id="cal-grid"></div>
      </div>
    </div>
  </div>
  <div id="view-daily" class="view">
    <div class="daily-nav">
      <button class="dnav-btn" onclick="changeDailyDate(-1)">&#8249;</button>
      <span class="daily-date-label" id="daily-date-label"></span>
      <button class="dnav-btn" onclick="changeDailyDate(1)">&#8250;</button>
      <button class="dnav-today" onclick="goToday()">오늘</button>
    </div>
    <div class="daily-split">
      <!-- Left: Todo list -->
      <div class="daily-todo-panel">
        <div class="sec-title">작업 목록</div>
        <div class="todo-input-wrap">
          <input class="todo-input" id="todo-input" placeholder="새 작업 입력 후 엔터..." onkeyup="onTodoEnter(event)" oncompositionend="window._composing=false" oncompositionstart="window._composing=true">
        </div>
        <div class="todo-list" id="daily-todo-list"></div>
      </div>
      <!-- Right: Timeline -->
      <div class="daily-tl-panel">
        <div class="sec-title">시간표</div>
        <div class="timeline-wrap" id="daily-tl-wrap">
          <div class="tl-inner" id="tl-inner"></div>
        </div>
      </div>

function getNotionSyncConfig(){
  return {
    url:(localStorage.getItem('jido_notion_sync_url')||NOTION_SYNC_URL).replace(/\/$/,''),
    token:sessionStorage.getItem('jido_notion_sync_token')||''

function normalizeNotionId(value){ return String(value||'').replace(/-/g,'').toLowerCase(); }
function esc(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function mergeNotionData(payload){
  const incomingProjects=Array.isArray(payload.projects)?payload.projects:[];
  const incomingTasks=Array.isArray(payload.tasks)?payload.tasks:[];
  const projectIds=new Map();

  incomingProjects.forEach((remote,index)=>{
    const notionId=normalizeNotionId(remote.notionId);
    let local=projects.find(p=>normalizeNotionId(p.notionId)===notionId);
    if(!local) local=projects.find(p=>!p.notionId&&p.name.trim()===remote.name.trim());
    if(local){
      local.name=remote.name;
      local.notionId=remote.notionId;
      local.notionUrl=remote.notionUrl;
      local.notionStage=remote.stage||'';
    }else{
      local={id:nextProjId++,name:remote.name,icon:ICONS[index%ICONS.length],color:COLORS[index%COLORS.length],desc:'',parentId:null,notionId:remote.notionId,notionUrl:remote.notionUrl,notionStage:remote.stage||''};
      projects.push(local);
    }
    projectIds.set(notionId,local.id);
  });

  incomingTasks.forEach(remote=>{
    const notionId=normalizeNotionId(remote.notionId);
    const remoteProjId=projectIds.get(normalizeNotionId(remote.notionProjectId))||null;
    let local=tasks.find(t=>normalizeNotionId(t.notionId)===notionId);
    if(!local){
      local=tasks.find(t=>!t.notionId&&t.name.trim()===remote.name.trim()&&(t.due||'')===(remote.due||'')&&(!remoteProjId||t.projId===remoteProjId));
    }
    if(local){
      local.name=remote.name;
      local.status=remote.status;
      local.due=remote.due||'';
      local.projId=remoteProjId;
      local.notionId=remote.notionId;
      local.notionUrl=remote.notionUrl;
    }else{
      tasks.push({id:nextTaskId++,name:remote.name,parentId:null,projId:remoteProjId,memo:'',status:remote.status,tag:'STUDIO',priority:'mid',due:remote.due||'',plannedTime:0,notionId:remote.notionId,notionUrl:remote.notionUrl});
    }
  });
}

async function syncFromNotion({silent=false}={}){
  let {url,token}=getNotionSyncConfig();
  if(!url){
    if(silent) return;
    url=prompt('Notion Worker 주소를 입력해주세요. (예: https://jido-pm-notion.workers.dev)')?.trim().replace(/\/$/,'')||'';
    if(!url) return;
    localStorage.setItem('jido_notion_sync_url',url);
  }
  if(!token){
    if(silent) return;
    token=prompt('Cloudflare에 설정한 SYNC_TOKEN을 입력해주세요.')?.trim()||'';
    if(!token) return;
    sessionStorage.setItem('jido_notion_sync_token',token);
  }
  const btn=document.getElementById('btn-notion-sync');
  if(btn) btn.disabled=true;
  setSyncStatus('syncing','Notion 동기화 중...');
  try{
    const headers=token?{'Authorization':'Bearer '+token}:{};
    const response=await fetch(url+'/api/notion/sync',{headers});
    const payload=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(payload.error||'Notion 동기화 실패');
    const before=JSON.stringify({projects,tasks});
    pushUndo();
    mergeNotionData(payload);
    const changed=before!==JSON.stringify({projects,tasks});
    if(!changed) undoStack.pop();
    if(changed){ saveLocal(); scheduleSave(); renderAll(); }
    const syncedTime=new Date(payload.syncedAt||Date.now()).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('ok',`Notion 동기화 ${syncedTime}`);
    if(!silent) showToast(`Notion: 프로젝트 ${payload.projects.length}개, 작업 ${payload.tasks.length}개`);
  }catch(error){
    setSyncStatus('err','Notion 오류');
    if(!silent) showToast(error.message||'Notion 동기화 실패');
  }finally{
    if(btn) btn.disabled=false;
  }
}

function startNotionAutoSync(){
  clearInterval(notionSyncTimer);
  if(!getNotionSyncConfig().url) return;
  syncFromNotion({silent:true});
  notionSyncTimer=setInterval(()=>syncFromNotion({silent:true}),NOTION_SYNC_INTERVAL);
}

(function(){
  var s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';
  s.onload=function(){
    // Auto sign-in: silently request token using stored hint
    const hint=localStorage.getItem('jido_login_hint');
    if(!hint) return;
    // Use One Tap credential to get access token silently
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      auto_select: true,
      callback: async(credRes)=>{
        if(!credRes.credential) return;
        // Exchange id_token for access token via token client
        _tokenClient=google.accounts.oauth2.initTokenClient({
          client_id:CLIENT_ID, scope:SCOPES,
          login_hint:hint,
          prompt:'',
          callback:async(res)=>{
            if(res.error||!res.access_token) return;
            await _onSignedIn(res.access_token);
          }
        });
        _tokenClient.requestAccessToken();
      }
    });
    // Also try silent token request directly
    _tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID, scope:SCOPES,
      login_hint:hint,
      prompt:'',
      callback:async(res)=>{
        if(res.error||!res.access_token) return;
        await _onSignedIn(res.access_token);
      }
    });
    _tokenClient.requestAccessToken();
  };
  document.head.appendChild(s);
})();
let _tokenClient=null;
async function _onSignedIn(token){
  accessToken=token;
  tokenExpiry=Date.now() + 55*60*1000; // 55분 (토큰 유효기간 60분)
  sessionStorage.setItem('jido_token',token);
  sessionStorage.setItem('jido_token_expiry',String(tokenExpiry));
  document.getElementById('btn-signin').style.display='none';
  document.getElementById('btn-signout').style.display='';
  document.getElementById('btn-migrate').style.display='';
  setSyncStatus('syncing','동기화 중...');
  await loadFromDrive();
  await fetchGcalEvents();
  // Auto-refresh token every 45 min (token lasts 60 min)
  setTimeout(()=>_refreshToken(),45*60*1000);
}
function _refreshToken(){
  const hint=localStorage.getItem('jido_login_hint');
  if(!hint||!accessToken) return;
  const client=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:SCOPES,
    login_hint:hint, prompt:'',
    callback:(res)=>{
      if(res.access_token){ accessToken=res.access_token; setSyncStatus('ok','동기화 완료'); setTimeout(()=>_refreshToken(),45*60*1000); }
    }
  });
  client.requestAccessToken();
}
function signIn(){
  if(typeof google==='undefined'){showToast('잠시 후 다시 시도해주세요');return;}
  google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async(res)=>{
    if(res.error){showToast('로그인 실패');return;}
    // Save email hint for auto-restore
    try{
      const info=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+res.access_token}})).json();
      if(info.email) localStorage.setItem('jido_login_hint',info.email);
    }catch(e){}
    await _onSignedIn(res.access_token);
  }}).requestAccessToken();
}

async function fetchGcalEvents(){
  if(!accessToken) return;
  try{
    // 이번달 시작~끝
    const now=new Date();
    const y=now.getFullYear(), m=now.getMonth();
    const tMin=encodeURIComponent(new Date(y,m,1).toISOString());
    const tMax=encodeURIComponent(new Date(y,m+1,0,23,59,59).toISOString());

    // 1. 모든 캘린더 목록 가져오기
    const calListRes=await fetch(
      'https://www.googleapis.com/calendar/v3/users/me/calendarList?showHidden=true',
      {headers:{Authorization:'Bearer '+accessToken}}
    );
    if(calListRes.status===401){
      accessToken=null;
      sessionStorage.removeItem('jido_token');
      sessionStorage.removeItem('jido_token_expiry');
      setSyncStatus('err','재로그인 필요');
      showToast('로그인이 만료됐어요. 다시 로그인해주세요.');
      document.getElementById('btn-signin').style.display='';
      document.getElementById('btn-signout').style.display='none';
      return;
    }
    const calList=await calListRes.json();
    const calendars=(calList.items||[]);

    // 2. 각 캘린더에서 이번달 이벤트 병렬 fetch
    const results=await Promise.allSettled(
      calendars.map(cal=>
        fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?timeMin=${tMin}&timeMax=${tMax}&singleEvents=true&orderBy=startTime&maxResults=250`,
          {headers:{Authorization:'Bearer '+accessToken}}
        ).then(r=>r.json()).then(d=>(d.items||[]).map(e=>({
          ...e,
          _calId:cal.id,
          _calName:cal.summary,
          _calColor:cal.backgroundColor||'#4285f4'
        })))
      )
    );

    // 3. 합치기
    gcalEvents=results
      .filter(r=>r.status==='fulfilled')
      .flatMap(r=>r.value)
      .filter(e=>e.start&&(e.start.dateTime||e.start.date));

    showToast('Google 캘린더 불러옴 ('+gcalEvents.length+'개 / '+calendars.length+'개 캘린더)');
    renderAll();
  }catch(e){
    console.warn('GCal fetch failed',e);
    if(e?.status===401||String(e).includes('401')){
      accessToken=null;
      sessionStorage.removeItem('jido_token');
      setSyncStatus('err','재로그인 필요');
      showToast('로그인이 만료됐어요. 다시 로그인해주세요.');
    }
  }
}
function setSyncStatus(t,txt){document.getElementById('sync-dot').className='dot'+(t?' '+t:'');document.getElementById('sync-text').textContent=txt;}
async function loadFromDrive(){
  try{
    const driveCheck=await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${FILE_NAME}'&fields=files(id)`,{headers:{Authorization:'Bearer '+accessToken}});
    if(driveCheck.status===401){ setSyncStatus('err','재로그인 필요'); showToast('로그인이 만료됐어요.'); return; }
    const r=driveCheck;
    const d=await r.json();
    if(d.files&&d.files.length>0){
      driveFileId=d.files[0].id;
      const driveData=await(await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,{headers:{Authorization:'Bearer '+accessToken}})).json();
      // localStorage와 타임스탬프 비교 — 더 최신인 것 사용
      let localData=null;
      try{ const raw=localStorage.getItem('jido_v3'); if(raw) localData=JSON.parse(raw); }catch(e){}
      const driveTs=driveData._ts||0;
      const localTs=localData?._ts||0;
      if(localTs > driveTs){
        // localStorage가 더 최신 → Drive에 업로드
        setSyncStatus('syncing','로컬 데이터 업로드 중...');
        await saveToDrive();
        setSyncStatus('ok','동기화 완료');
        showToast('최신 데이터로 동기화 완료');
      } else {
        // Drive가 더 최신 또는 동일 → Drive 데이터 사용
        projects=driveData.projects||projects;
        tasks=driveData.tasks||tasks;
        timeLogs=driveData.timeLogs||[];
        nextTaskId=driveData.nextTaskId||nextTaskId;
        nextProjId=driveData.nextProjId||nextProjId;
        nextLogId=driveData.nextLogId||1;
        saveLocal(); // localStorage도 최신화
        setSyncStatus('ok','동기화 완료');
        showToast('불러오기 완료');
      }
    } else {await saveToDrive();setSyncStatus('ok','준비 완료');}
  }catch(e){setSyncStatus('err','오류');showToast('불러오기 실패');}
  renderAll();
}
async function saveToDrive(){
  if(!accessToken)return;
  setSyncStatus('syncing','저장 중...');
  try{
    const content=JSON.stringify({projects,tasks,timeLogs,nextTaskId,nextProjId,nextLogId,_ts:Date.now()});
    if(driveFileId){
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:content});
    } else {
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify({name:FILE_NAME,parents:['appDataFolder']})],{type:'application/json'}));
      form.append('file',new Blob([content],{type:'application/json'}));
      driveFileId=(await(await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{Authorization:'Bearer '+accessToken},body:form})).json()).id;
    }
    setSyncStatus('ok','저장 완료');
  }catch(e){setSyncStatus('err','저장 실패');}
}
function scheduleSave(){clearTimeout(syncTimeout);syncTimeout=setTimeout(saveToDrive,500);}
function pushUndo(){
  undoStack.push({
    tasks:JSON.parse(JSON.stringify(tasks)),
    timeLogs:JSON.parse(JSON.stringify(timeLogs)),
    projects:JSON.parse(JSON.stringify(projects)),
    nextTaskId,nextLogId,nextProjId
  });
  if(undoStack.length>MAX_UNDO) undoStack.shift();
}

function undo(){
  if(!undoStack.length){ showToast('더 이상 되돌릴 수 없어요'); return; }
  const prev=undoStack.pop();
  tasks=prev.tasks;
  timeLogs=prev.timeLogs;
  projects=prev.projects;
  nextTaskId=prev.nextTaskId;
  nextLogId=prev.nextLogId;
  nextProjId=prev.nextProjId;
  saveLocal();scheduleSave();
  renderAll();
  showToast('실행 취소됐어요 ↩');
}

// ── Google Calendar Sync (auto-create/update events) ─────────────────
let _pmCalendarId=null; // "Tasks" 캘린더 ID 캐시

async function getPmCalendarId(){
  if(_pmCalendarId) return _pmCalendarId;
  if(!accessToken) return 'primary';
  try{
    const cached=sessionStorage.getItem('jido_pm_cal_id');
    if(cached){ _pmCalendarId=cached; return cached; }
    const r=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?showHidden=true',{headers:{Authorization:'Bearer '+accessToken}});
    const d=await r.json();
    const found=(d.items||[]).find(c=>c.summary==='Tasks'||c.summary==='tasks');
    _pmCalendarId=found?found.id:'primary';
    sessionStorage.setItem('jido_pm_cal_id',_pmCalendarId);
    if(found) console.log('jido. pm → Tasks 캘린더 연결됨:', found.id);
    else console.warn('jido. pm: "Tasks" 캘린더를 찾지 못해 기본 캘린더 사용');
    return _pmCalendarId;
  }catch(e){ return 'primary'; }
}

async function syncTaskToGcal(task){
  if(!accessToken) return;
  if(!task || !task.due) return;
  try{
    const calId=await getPmCalendarId();
    let event;
    if(task.startHour!==undefined && task.startHour!==null && task.startHour!==''){
      const startDate=new Date(task.due + 'T' + String(task.startHour).padStart(2,'0') + ':00:00+09:00');
      const endDate=new Date(startDate.getTime() + ((task.plannedTime || 60)*60000));
      event={summary:task.name,description:task.memo||'',start:{dateTime:startDate.toISOString(),timeZone:'Asia/Seoul'},end:{dateTime:endDate.toISOString(),timeZone:'Asia/Seoul'}};
    } else {
      // all-day event
      event={summary:task.name,description:task.memo||'',start:{date:task.due},end:{date:task.due}};
    }
    if(task.gcalEventId){
      await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events/${task.gcalEventId}`,{method:'PATCH',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify(event)});
    } else {
      const resp=await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events`,{method:'POST',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify(event)});
      const data=await resp.json();
      if(data && data.id) task.gcalEventId=data.id;
    }
  } catch(e){ console.warn('GCal sync failed',e); }
}

// ── Migrate existing events from primary to Tasks calendar ───────────
async function migrateToTasksCalendar(){
  if(!accessToken){ showToast('로그인이 필요해요'); return; }
  const calId=await getPmCalendarId();
  if(calId==='primary'){
    showToast('"Tasks" 캘린더를 찾을 수 없어요. 이름을 확인해주세요.');
    return;
  }
  // gcalEventId가 있는 작업만 대상
  const tasksWithEvents=tasks.filter(t=>t.gcalEventId);
  if(tasksWithEvents.length===0){
    showToast('이전할 일정이 없어요');
    return;
  }
  const confirmed=await showConfirm(`${tasksWithEvents.length}개 일정을 Tasks 캘린더로 이전할까요?`);
  if(!confirmed) return;

  setSyncStatus('syncing','이전 중...');
  let success=0, fail=0;
  for(const t of tasksWithEvents){
    try{
      const resp=await fetch(
        `https://www.googleapis.com/calendar/v3/calendars/primary/events/${t.gcalEventId}/move?destination=${encodeURIComponent(calId)}`,
        { method:'POST', headers:{ Authorization:'Bearer '+accessToken } }
      );
      if(resp.ok){
        const moved=await resp.json();
        if(moved && moved.id) t.gcalEventId=moved.id; // move는 보통 ID 유지되지만 안전하게 갱신
        success++;
      } else {
        fail++;
      }
    } catch(e){
      fail++;
    }
  }
  saveLocal(); scheduleSave();
  setSyncStatus('ok','동기화 완료');
  showToast(`이전 완료: 성공 ${success}건${fail?`, 실패 ${fail}건`:''}`);
  await fetchGcalEvents();
  renderAll();
}


function getProj(id){ return getProjDisplay(id); }

function rootTasks(){return tasks.filter(t=>!t.parentId&&(!selProjId||t.projId===selProjId));}
function childTasks(pid){return tasks.filter(t=>t.parentId===pid);}
function allDescendants(id){let res=[];const ch=childTasks(id);ch.forEach(c=>{res.push(c);res=res.concat(allDescendants(c.id));});return res;}
function calcProgress(id){const ch=childTasks(id);if(!ch.length)return null;const done=ch.filter(c=>c.status==='done').length;return{done,total:ch.length,pct:Math.round(done/ch.length*100)};}
function fmtDate(s){if(!s)return'';const[,m,d]=s.split('-');return m+'/'+d;}
function fmtMins(m){if(!m&&m!==0)return'-';if(!m)return'0m';const h=Math.floor(m/60),mm=m%60;return h>0?(mm>0?h+'h '+mm+'m':h+'h'):mm+'m';}
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function getAncestors(id){const res=[];let t=tasks.find(t=>t.id===id);while(t&&t.parentId){t=tasks.find(x=>x.id===t.parentId);if(t)res.unshift(t);}return res;}

function renderProjTreeNode(p, depth, container){
  const childProjs=projChildProjects(p.id);
  const allProjIds=[p.id,...projAllDescendantProjects(p.id).map(c=>c.id)];
  const taskCount=tasks.filter(t=>allProjIds.includes(t.projId)).length;
  const isCollapsed=collapsedProjIds.has(p.id);
  const hasChildren=childProjs.length>0;
  const disp=getProjDisplay(p.id);

  const wrap=document.createElement('div');
  wrap.className='proj-tree-item';

  const head=document.createElement('div');
  head.className='proj-tree-head';
  head.innerHTML=`
    <span class="proj-tree-toggle">${hasChildren?(isCollapsed?'▶':'▼'):''}</span>
    <span class="proj-tree-icon">${disp.icon}</span>
    <span class="proj-tree-name" style="color:${disp.color}">${esc(p.name)}</span>
    <span class="proj-tree-count">${taskCount}개</span>
    <button class="proj-tree-add" onclick="event.stopPropagation();openProjModal(null,${p.id})">+ 페이즈</button>
  `;

  // Drag drop handlers with Finder-style hover expand
  head.addEventListener('dragover', e=>{
    e.preventDefault(); e.stopPropagation();
    head.classList.add('drop-hover');
    // Finder-style: hover 1s → auto expand
    if(!_hoverExpandTimer){
      _hoverExpandTimer=setTimeout(()=>{
        if(collapsedProjIds.has(p.id)){
          collapsedProjIds.delete(p.id);
          renderProjTreePanel();
        }
        _hoverExpandTimer=null;
      },1000);
    }
  });
  head.addEventListener('dragleave', e=>{
    head.classList.remove('drop-hover');
    clearTimeout(_hoverExpandTimer); _hoverExpandTimer=null;
  });
  head.addEventListener('drop', e=>{
    e.preventDefault(); e.stopPropagation();
    head.classList.remove('drop-hover');
    clearTimeout(_hoverExpandTimer); _hoverExpandTimer=null;
    const taskId=window._dragId||parseInt(e.dataTransfer.getData('text/plain'));
    window._dragId=null;
    if(!taskId||isNaN(taskId)) return;
    const t=tasks.find(t=>t.id===taskId); if(!t) return;
    pushUndo();
    t.projId=p.id;
    saveLocal();scheduleSave();renderAll();
    showToast(`"${p.name}"(으)로 이동했어요`);
  });

  // Click to collapse/expand or edit
  head.querySelector('.proj-tree-toggle').addEventListener('click', e=>{
    e.stopPropagation();
    if(!hasChildren) return;
    collapsedProjIds.has(p.id)?collapsedProjIds.delete(p.id):collapsedProjIds.add(p.id);
    renderProjTreePanel();
  });
  head.addEventListener('click', e=>{
    if(e.target.tagName==='BUTTON'||e.target.classList.contains('proj-tree-toggle')) return;
    openProjModal(p.id);
  });

  wrap.appendChild(head);

  if(hasChildren && !isCollapsed){
    const childWrap=document.createElement('div');
    childWrap.className='proj-tree-children';
    childProjs.forEach(c=>renderProjTreeNode(c,depth+1,childWrap));
    wrap.appendChild(childWrap);
  }
  container.appendChild(wrap);
}

// ── Calendar ──────────────────────────────────────────────
function renderCal(){
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const cmEl=document.getElementById('cal-month'); if(!cmEl) return; cmEl.textContent=calYear+'년 '+months[calMonth];
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=new Date(); const ft=tasks.filter(t=>!selProjId||t.projId===selProjId);
  const dayLabels=['일','월','화','수','목','금','토'].map(d=>`<div class="dl">${d}</div>`).join('');
  let html=dayLabels;
  for(let i=0;i<first;i++) html+=`<div class="day om"><div class="dn">${prevDays-first+1+i}</div></div>`;
  for(let d=1;d<=days;d++){
    const isToday=calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate();
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt=ft.filter(t=>t.due===ds);
    const ge=gcalEvents.filter(e=>{
      const eDate=e.start.dateTime?e.start.dateTime.split('T')[0]:e.start.date;
      if(eDate!==ds) return false;
      return !tasks.some(t=>(t.gcalEventId&&t.gcalEventId===e.id)||(t.due===ds&&t.name===e.summary&&t.startHour!==undefined));
    });
    const MAX_EV=2;
    const allEvs=[
      ...dt.map(t=>{const p=getProj(t.projId);const done=t.status==='done';return{html:`<div class="ev" style="background:${p.color}${done?'11':'22'};color:${p.color};border-left:2px solid ${p.color};${done?'opacity:.4;text-decoration:line-through':''}" onclick="event.stopPropagation();toggleSelect(${t.id},'cal')" ondblclick="event.stopPropagation();openPanel(${t.id})">${esc(t.name)}</div>`};}),
      ...ge.map(e=>({html:`<div class="ev" style="background:${e._calColor||'#4285f4'}22;color:${e._calColor||'#4285f4'};border-left:2px solid ${e._calColor||'#4285f4'}">${esc(e.summary||'(일정)')}</div>`}))
    ];
    const visEvs=allEvs.slice(0,MAX_EV).map(e=>e.html).join('');
    const more=allEvs.length>MAX_EV?`<div style="font-size:10px;color:var(--text3)">+${allEvs.length-MAX_EV}개</div>`:'';
    html+=`<div class="day ${isToday?'today':''}" ondblclick="goToDailyDate('${ds}')" title="더블클릭 → 데일리">
      <div class="dn" style="flex-shrink:0">${d}</div>${visEvs}${more}
    </div>`;
  }
  const remain=(first+days)%7===0?0:7-(first+days)%7;
  for(let d=1;d<=remain;d++) html+=`<div class="day om"><div class="dn">${d}</div></div>`;
  document.getElementById('cal-grid').innerHTML=html;

  // ── Render task list panel ──
  const monthStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const monthTasks=tasks.filter(t=>t.due&&t.due.startsWith(monthStr)&&(!selProjId||t.projId===selProjId));
  monthTasks.sort((a,b)=>(a.due>b.due?1:-1));

  const doneTasks=monthTasks.filter(t=>t.status==='done');
  const todoTasks=monthTasks.filter(t=>t.status!=='done');

  function makeCalTaskItem(t){
    const p=getProj(t.projId);
    const done=t.status==='done';
    return`<div class="cal-task-item${done?' done-task':''}" onclick="openPanel(${t.id})">
      <div class="chk ${done?'done':''}" onclick="quickToggle(${t.id},event)" style="width:14px;height:14px;font-size:9px;flex-shrink:0">✓</div>
      <span style="width:6px;height:6px;border-radius:50%;background:${p.color};flex-shrink:0;display:inline-block"></span>
      <span class="cal-task-name ${done?'done':''}">${esc(t.name)}</span>
      <span class="cal-task-date">${t.due?t.due.slice(5).replace('-','/'):''}</span>
    </div>`;
  }

  const listEl=document.getElementById('cal-task-list');
  if(!listEl) return;
  let listHtml='';
  if(todoTasks.length){
    listHtml+=`<div class="cal-section-label">미완료 (${todoTasks.length})</div>`;
    listHtml+=todoTasks.map(makeCalTaskItem).join('');
  }
  if(doneTasks.length){
    listHtml+=`<div class="cal-section-label">완료 (${doneTasks.length})</div>`;
    listHtml+=doneTasks.map(makeCalTaskItem).join('');
  }
  if(!monthTasks.length) listHtml='<div style="font-size:12px;color:var(--text3);padding:10px 0">이달의 작업 없음</div>';
  listEl.innerHTML=listHtml;
}


function changeMonth(d){
  calMonth+=d;
  if(calMonth>11){calMonth=0;calYear++;}

}

// ── Daily & Weekly ──────────────────────────────────────────
let dailyDate = new Date(); dailyDate.setHours(0,0,0,0); // currently viewed date
let weekOffset = 0; // week offset from current week
const SLOT_H = 30; // px per 30-min slot
const SLOTS_PER_HOUR = 2;

function dailyDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function changeDailyDate(d){ dailyDate=new Date(dailyDate); dailyDate.setDate(dailyDate.getDate()+d); dailyDate.setHours(0,0,0,0); renderDaily(); }
function goToday(){ dailyDate=new Date(); dailyDate.setHours(0,0,0,0); renderDaily(); }
function changeWeek(d){ weekOffset+=d; renderWeekly(); }
function goWeekToday(){ weekOffset=0; renderWeekly(); }

function fmtHM(h,m){ return String(h).padStart(2,'0')+':'+String(m||0).padStart(2,'0'); }
function slotToMins(slot){ return slot*30; } // slot index → minutes from midnight
function minsToSlot(mins){ return Math.floor(mins/30); }
function minsToTop(mins){ return (mins/30)*SLOT_H; }
function topToMins(top){ return Math.round(top/SLOT_H)*30; }

// ── Render Daily ──────────────────────────────────────────
function renderDaily(){
  const ds=dailyDateStr(dailyDate);
  const d=dailyDate;
  const days=['일','월','화','수','목','금','토'];
  const isToday=ds===todayStr();
  const ddEl=document.getElementById('daily-date-label'); if(ddEl) ddEl.textContent=
    d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+days[d.getDay()]+')'+(isToday?' — 오늘':'');

  // 오늘(해당일) 작업
  const dayTasks=tasks.filter(t=>t.due===ds);

  // 미완료 이월 작업: 해당일 이전 날짜이고, 완료 안 됐고, due가 있는 것
  // + 위클리에서 해당 주에 속하지만 특정 날 미배정(due가 이번 주 범위인데 startHour 없는 것)
  const weekDates=getWeekDates();
  const weekStrs=weekDates.map(d=>dailyDateStr(d));
  const weekStart=weekStrs[0], weekEnd=weekStrs[6];

  const remaining=tasks.filter(t=>{
    if(t.status==='done') return false;
    if(dayTasks.includes(t)) return false;
    // 이전 날짜 미완료
    if(t.due && t.due < ds) return true;
    // 이번 주 작업인데 특정 날 미배정 (due가 이번 주 범위이고 오늘 이전)
    if(t.due && t.due>=weekStart && t.due<=ds && t.due!==ds) return true;
    return false;
  });

  renderDailyTodo(dayTasks, remaining);
  renderDailyTimeline(ds, dayTasks);
}

function quickToggle(id, e){
  if(e && e.stopPropagation) e.stopPropagation();
  const t=tasks.find(t=>t.id===id);

  t.status=t.status==='done'?'todo':'done';
  pushUndo();
  saveLocal();scheduleSave();
  renderDaily();renderWeekly();renderBoard();renderTree();renderStats();renderProjFilter();
}

function attachSwipe(el){
  let startX=0,startY=0,curX=0,swiping=false,dir=null;
  const id=parseInt(el.dataset.id);
  const inner=el.querySelector('.todo-inner');
  const bgLeft=el.querySelector('.todo-swipe-left');
  const bgRight=el.querySelector('.todo-swipe-right');
  const MAX=Math.min(projects.length*44+16, 200);
  const DEL_W=72;

  function reset(){
    if(inner) inner.style.transform='';
    if(bgLeft) bgLeft.style.width='0';
    if(bgRight) bgRight.style.width='0';
    dir=null;
  }

  el.addEventListener('touchstart',e=>{
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    curX=startX;swiping=true;dir=null;
  },{passive:true});

  el.addEventListener('touchmove',e=>{
    if(!swiping)return;
    curX=e.touches[0].clientX;
    const dx=curX-startX;
    const dy=e.touches[0].clientY-startY;
    if(dir===null){if(Math.abs(dy)>Math.abs(dx)+5){swiping=false;return;}if(Math.abs(dx)>6)dir=dx>0?'right':'left';}
    if(!dir)return;
    if(dir==='left'){
      const w=Math.min(DEL_W,Math.max(0,-dx));
      if(inner)inner.style.transform=`translateX(${-w}px)`;
      if(bgLeft)bgLeft.style.width=w+'px';
      if(bgRight)bgRight.style.width='0';
    } else {
      const w=Math.min(MAX,Math.max(0,dx));
      if(inner)inner.style.transform=`translateX(${w}px)`;
      if(bgRight)bgRight.style.width=w+'px';
      if(bgLeft)bgLeft.style.width='0';
    }
  },{passive:true});

  el.addEventListener('touchend',()=>{
    if(!swiping){reset();return;}
    const dx=curX-startX;
    if(dir==='left'&&dx<-50){
      el.style.transition='opacity .15s,transform .15s';
      el.style.opacity='0';el.style.transform='translateX(-40px)';
      setTimeout(()=>quickDeleteTask(id),180);
    } else if(dir==='right'&&dx>30){
      if(inner)inner.style.transform=`translateX(${MAX}px)`;
      if(bgRight)bgRight.style.width=MAX+'px';
      setTimeout(reset,3000);
    } else {reset();}
    swiping=false;
  });

  el.closest('.todo-list')?.addEventListener('scroll',reset,{passive:true});
}
