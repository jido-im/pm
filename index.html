function renderDailyTimeline(ds, dayTasks){
  const wrap=document.getElementById('tl-inner');
  const now=new Date();
  const isToday=ds===todayStr();
  const nowH=now.getHours(), nowMin=now.getMinutes();

  // Build 24h × 2 slots
  let html='';
  for(let h=0;h<24;h++){
    for(let half=0;half<2;half++){
      const slotTop=(h*2+half)*30;
      const isNowSlot=isToday&&h===nowH&&(half===0?nowMin<30:nowMin>=30);
      const hLabel=half===0?(h===0?'오전 12':h<12?`오전 ${h}`:h===12?'오후 12':`오후 ${h-12}`):'';
      html+=`<div class="tl-row${half===1?' half':''}${isNowSlot?' is-now':''}" 
        style="position:absolute;top:${slotTop}px;left:0;right:0;height:30px"
        data-h="${h}" data-half="${half}"
        ondragover="event.preventDefault();this.querySelector('.tl-slot').classList.add('drop-target')"
        ondragleave="this.querySelector('.tl-slot').classList.remove('drop-target')"
        ondrop="onSlotDrop(event,${h},${half})">
        <div class="tl-hour${half===1?' half-lbl':''}">${hLabel}${half===1?'30':''}</div>
        <div class="tl-slot" onclick="onSlotClick(${h},${half})"></div>
      </div>`;
    }
  }

  // Now line
  wrap.innerHTML=html;
  // Render now line after DOM is set (so position:absolute works correctly)
  if(isToday){
    const nowPx=minsToTop(nowH*60+nowMin);
    const nowEl=document.createElement('div');
    nowEl.className='tl-now-wrap';
    nowEl.style.top=nowPx+'px';
    nowEl.innerHTML='<div class="tl-now-circle"></div><div class="tl-now-line"></div>';
    wrap.appendChild(nowEl);
  }

  // timeLogs 기준으로만 블록 렌더링 (Cmd+드래그로 여러 날짜에 log 추가해도 정확히 표시)
  const logsForDay=timeLogs.filter(l=>l.date===ds);

  // timeLogs에 없지만 t.due===ds && t.startHour 있는 것도 포함 (직접 드롭한 경우)
  const loggedTaskIds=new Set(logsForDay.map(l=>l.taskId));
  const unloggedScheduled=tasks.filter(t=>
    t.due===ds &&
    t.startHour!==undefined && t.startHour!==null && t.startHour!=='' &&
    !loggedTaskIds.has(t.id)
  );

  const pmBlocks=[
    // timeLogs 기반 블록 (날짜별 독립 기록)
    ...logsForDay.map(l=>{
      const task=tasks.find(t=>t.id===l.taskId);
      if(!task) return null;
      return{...task, startHour:l.startHour, startMin:l.startMin, plannedTime:l.duration, _logId:l.id, _fromLog:true};
    }).filter(Boolean),
    // log 없는 scheduled task
    ...unloggedScheduled
  ];

  // gcal blocks for this day (deduplicated)
  const gcalForDay=gcalEvents.filter(e=>{
    const ed=e.start.dateTime?e.start.dateTime.split('T')[0]:e.start.date;
    if(ed!==ds||!e.start.dateTime) return false;
    return !tasks.some(t=>(t.gcalEventId&&t.gcalEventId===e.id)||(t.due===ds&&t.name===e.summary&&t.startHour!==undefined));
  });

  // Convert gcal to block-like for column computation
  const gcalAsBlocks=gcalForDay.map(e=>{
    const s=new Date(e.start.dateTime);
    const en=e.end?.dateTime?new Date(e.end.dateTime):new Date(s.getTime()+3600000);
    const startMins=s.getHours()*60+s.getMinutes();
    const maxMins=24*60-startMins;
    const dur=Math.min(Math.round((en-s)/60000), maxMins);
    return{_gcal:e, id:'g'+e.id, startHour:s.getHours(), startMin:s.getMinutes(), plannedTime:dur};
  });

  // Compute columns for ALL blocks together (PM + gcal)
  const allBlocks=[...pmBlocks,...gcalAsBlocks];
  const colMap=computeColumns(allBlocks);

  // Render PM blocks
  pmBlocks.forEach(t=>renderTaskBlock(t, wrap, colMap[t.id]||{col:0,total:1}));
  // Render gcal blocks with column info
  gcalAsBlocks.forEach(b=>renderGcalBlock(b._gcal, wrap, colMap[b.id]||{col:0,total:1}));

  // Scroll to 8am or now
  const scrollTo=isToday?Math.max(0,minsToTop(nowH*60+nowMin)-100):minsToTop(8*60);
  setTimeout(()=>{ const w=document.getElementById('daily-tl-wrap'); if(w) w.scrollTop=scrollTo; },50);
}

function computeColumns(tasks){
  // Assign column index to each task to avoid overlap
  const sorted=[...tasks].sort((a,b)=>{
    const aS=(a.startHour||0)*60+(a.startMin||0);
    const bS=(b.startHour||0)*60+(b.startMin||0);
    return aS-bS;
  });
  const cols={}; // taskId -> {col, total}
  const colEnds=[]; // end time per column
  sorted.forEach(t=>{
    const s=(t.startHour||0)*60+(t.startMin||0);
    const e=s+(t.plannedTime||60);
    let col=0;
    while(colEnds[col]!==undefined && colEnds[col]>s) col++;
    colEnds[col]=e;
    cols[t.id]={col, colEnds};
  });
  // Calculate total columns per task (how many cols overlap)
  sorted.forEach(t=>{
    const s=(t.startHour||0)*60+(t.startMin||0);
    const e=s+(t.plannedTime||60);
    let maxCol=cols[t.id].col;
    sorted.forEach(u=>{
      if(u.id===t.id) return;
      const us=(u.startHour||0)*60+(u.startMin||0);
      const ue=us+(u.plannedTime||60);
      if(us<e && ue>s) maxCol=Math.max(maxCol, cols[u.id].col);
    });
    cols[t.id].total=maxCol+1;
  });
  return cols;
}

function renderTaskBlock(t, container, colInfo={col:0,total:1}){
  const startMins=(t.startHour||0)*60+(t.startMin||0);
  const dur=t.plannedTime||60;
  const top=minsToTop(startMins);
  const height=Math.max(30, (dur/30)*SLOT_H);
  const p=getProj(t.projId);

  const el=document.createElement('div');
  el.className='tl-block';
  el.id='tl-block-'+t.id;
  const col=colInfo.col||0;
  const total=colInfo.total||1;
  const tlLeft=58; // time label width px
  const availW=`calc(100% - ${tlLeft}px)`;
  const colW=`calc((100% - ${tlLeft}px) / ${total})`;
  const colLeft=`calc(${tlLeft}px + (100% - ${tlLeft}px) / ${total} * ${col})`;
  el.style.cssText=`top:${top}px;height:${height}px;background:${p.color}22;border:1.5px solid ${p.color}66;color:${p.color};position:absolute;cursor:grab;left:${colLeft};width:${colW};box-sizing:border-box;padding:0`;

  el.innerHTML=`
    <div class="tl-block-top-handle" data-id="${t.id}" style="position:absolute;top:-3px;left:0;right:0;height:14px;cursor:ns-resize;z-index:11;background:linear-gradient(to top,transparent,${p.color}33);border-radius:6px 6px 0 0"></div>
    <div class="tl-block-body" style="padding:3px 7px;pointer-events:none;user-select:none">
      <div class="tl-block-name">${esc(t.name)}</div>
      <div class="tl-block-time">${fmtHM(t.startHour,t.startMin||0)} · ${fmtMins(dur)}</div>
    </div>
    <div class="tl-block-resize" data-id="${t.id}" style="position:absolute;bottom:-3px;left:0;right:0;height:14px;cursor:ns-resize;background:linear-gradient(to bottom,transparent,${p.color}33);border-radius:0 0 6px 6px;z-index:11"></div>
  `;

  // ── Mouse drag: normal=move, Cmd=add log, Option/Alt=copy ──
  el.addEventListener('mousedown', e=>{
    if(e.target.classList.contains('tl-block-resize')||e.target.classList.contains('tl-block-top-handle')) return;
    e.preventDefault();
    selectBlock(t.id);
    const isCmdDrag=e.metaKey||e.ctrlKey; // Cmd/Ctrl = add log
    const isOptDrag=e.altKey;              // Option/Alt = copy task
    const startY=e.clientY;
    const origTop=parseInt(el.style.top);
    const ds=dailyDateStr(dailyDate);
    let moved=false;

    // Visual clone for cmd/opt drag
    let ghost=null;
    if(isCmdDrag||isOptDrag){
      ghost=el.cloneNode(true);
      ghost.style.opacity='0.5';
      ghost.style.pointerEvents='none';
      ghost.style.zIndex='999';
      el.parentNode.appendChild(ghost);
    }

    function onMove(mv){
      moved=true;
      const dy=mv.clientY-startY;
      const newTop=Math.max(0, origTop+dy);
      if(isCmdDrag||isOptDrag){
        // 원본은 그대로, ghost만 이동
        if(ghost) ghost.style.top=newTop+'px';
        el.style.opacity='0.85';
      } else {
        el.style.top=newTop+'px';
        el.style.opacity='0.7';
      }
      el.style.cursor='grabbing';
    }

    function onUp(mv){
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      el.style.opacity='1';
      el.style.cursor='grab';
      if(ghost) ghost.remove();

      if(!moved) return;
      pushUndo();

      const targetTop=parseInt((isCmdDrag||isOptDrag)?ghost?.style.top||origTop:el.style.top);
      const newMins=Math.round(targetTop/SLOT_H)*30;
      const newH=Math.floor(newMins/60);
      const newM=newMins%60;

      if(isCmdDrag){
        // Cmd+drag: 항상 새 timeLog 추가 (기존 log 절대 덮어쓰지 않음)
        timeLogs.push({id:nextLogId++,taskId:t.id,date:ds,startHour:newH,startMin:newM,duration:t.plannedTime||60,projId:t.projId});
        showToast('같은 작업에 시간 추가됐어요 +'+fmtMins(t.plannedTime||60));
      } else if(isOptDrag){
        // Option+drag: 이름 같은 완전히 독립된 새 task 생성
        const newTask={
          id:nextTaskId++,
          name:t.name,
          parentId:null,
          projId:t.projId,
          memo:'',
          status:'todo',
          tag:t.tag||'STUDIO',
          priority:t.priority||'mid',
          due:ds,
          plannedTime:t.plannedTime||60,
          startHour:newH,
          startMin:newM,
        };
        tasks.unshift(newTask);
        timeLogs.push({id:nextLogId++,taskId:newTask.id,date:ds,startHour:newH,startMin:newM,duration:newTask.plannedTime,projId:newTask.projId});
        showToast('독립 작업으로 복사됐어요');
      } else {
        // Normal drag: 이동 (기존 날짜 log → 새 날짜로 변경)
        const oldLog=timeLogs.find(l=>l.taskId===t.id&&l.date===(t.due||ds));
        if(oldLog){ oldLog.date=ds; oldLog.startHour=newH; oldLog.startMin=newM; }
        else{ timeLogs.push({id:nextLogId++,taskId:t.id,date:ds,startHour:newH,startMin:newM,duration:t.plannedTime||60,projId:t.projId}); }
        t.startHour=newH; t.startMin=newM; t.due=ds;
      }
      saveLocal();scheduleSave();renderDaily();
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });

  // ── Click to select / dblclick to open ──
  el.addEventListener('click', e=>{
    e.stopPropagation();
    selectBlock(t.id);
  });
  el.addEventListener('dblclick', e=>{ e.stopPropagation(); openPanel(t.id); });

  // ── Right-click ──
  el.addEventListener('contextmenu', e=>{ e.preventDefault(); e.stopPropagation(); showCtxMenu(e,t.id,'block'); });

  // ── Bottom resize handle ──
  const resizeBottom=el.querySelector('.tl-block-resize');
  resizeBottom.addEventListener('mousedown', e=>{ e.stopPropagation(); e.preventDefault(); startResize(e, t.id, el, 'bottom'); });

  // ── Top resize handle (시작 시간 조절) ──
  const resizeTop=el.querySelector('.tl-block-top-handle');
  resizeTop.addEventListener('mousedown', e=>{ e.stopPropagation(); e.preventDefault(); startResize(e, t.id, el, 'top'); });

  container.appendChild(el);
}

function renderGcalBlock(e, container, colInfo={col:0,total:1}){
  if(!e.start.dateTime) return;
  const start=new Date(e.start.dateTime);
  const end=e.end?.dateTime?new Date(e.end.dateTime):new Date(start.getTime()+3600000);
  const startMins=start.getHours()*60+start.getMinutes();
  const maxMins=24*60-startMins;
  const dur=Math.min(Math.round((end-start)/60000), maxMins);
  const top=minsToTop(startMins);
  const height=Math.max(26,(dur/30)*SLOT_H);
  const color=e._calColor||'#4285f4';
  const c=colInfo.col||0;
  const total=colInfo.total||1;
  const colLeft=`calc(58px + (100% - 58px) / ${total} * ${c})`;
  const colWidth=`calc((100% - 58px) / ${total})`;

  const el=document.createElement('div');
  el.className='tl-block';
  el.style.cssText=`top:${top}px;height:${height}px;background:${color}22;border:1.5px solid ${color}55;color:${color};position:absolute;left:${colLeft};width:${colWidth};cursor:default;box-sizing:border-box;pointer-events:none`;
  el.innerHTML=`<div class="tl-block-body" style="padding:3px 7px;pointer-events:none"><div class="tl-block-name">📅 ${esc(e.summary||'(일정)')}</div><div class="tl-block-time">${fmtHM(start.getHours(),start.getMinutes())} · ${fmtMins(dur)}</div></div>`;
  container.appendChild(el);
}

// ── Multi-select ─────────────────────────────────────────
let selItems=new Set(); // selected task ids
let selectedBlockId=null;

function toggleSelect(id, type){
  if(selItems.has(id)) selItems.delete(id);
  else selItems.add(id);
  updateSelectionBar();
  // Re-render affected views
  if(type==='card') renderBoard();
  else if(type==='row') renderTree();
  else if(type==='cal') renderCal();
  else {renderBoard();renderTree();renderCal();}
}

function clearSelection(){
  selItems.clear();
  updateSelectionBar();
  renderBoard();renderTree();renderCal();
}

function updateSelectionBar(){
  let bar=document.getElementById('sel-bar');
  if(selItems.size===0){
    if(bar) bar.remove();
    return;
  }
  if(!bar){
    bar=document.createElement('div');
    bar.className='selection-bar';
    bar.id='sel-bar';
    document.body.appendChild(bar);
  }
  bar.innerHTML=`<span class="sel-count">${selItems.size}개 선택됨</span>
    <button class="sel-btn danger" onclick="deleteSelected()">🗑 삭제</button>
    <button class="sel-btn cancel" onclick="clearSelection()">취소</button>`;
}

function deleteSelected(){
  if(!selItems.size) return;
  const toDelete=[];
  selItems.forEach(id=>{ toDelete.push(id); allDescendants(id).forEach(t=>toDelete.push(t.id)); });
  pushUndo();
  tasks=tasks.filter(t=>!toDelete.includes(t.id));
  selItems.clear();
  saveLocal();scheduleSave();
  updateSelectionBar();
  renderAll();
  showToast(toDelete.length+'개 삭제됐어요');
}

// Override keyboard delete to support multi-select too
document.addEventListener('keydown',e=>{
  if((e.key==='Delete'||e.key==='Backspace')){
    if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    e.preventDefault();
    if(selItems.size>0){ deleteSelected(); return; }
    if(selectedBlockId!==null){ quickDeleteTask(selectedBlockId); selectedBlockId=null; }
  }
});
document.addEventListener('click',e=>{
  // Deselect block if clicking outside
  if(!e.target.closest('.tl-block')){ document.querySelectorAll('.tl-block.selected').forEach(el=>el.classList.remove('selected')); selectedBlockId=null; }
  hideCtxMenu();
});
function selectBlock(id){
  // Deselect previous
  document.querySelectorAll('.tl-block.selected').forEach(el=>el.classList.remove('selected'));
  selectedBlockId=id;
  const el=document.getElementById('tl-block-'+id);
  if(el) el.classList.add('selected');
}
// keyboard+click handled in multi-select block above

// ── Context Menu ──────────────────────────────────────────
let ctxMenu=null;
function showCtxMenu(e,id,type){
  e.stopPropagation();
  hideCtxMenu();
  const t=tasks.find(t=>t.id===id);
  const menu=document.createElement('div');
  menu.className='ctx-menu';
  menu.id='ctx-menu';
  const items=[
    {label:'✏️ 편집',action:()=>{openPanel(id);hideCtxMenu();}},
    {label:'⏰ 시간 설정',action:()=>{openPanel(id);hideCtxMenu();},show:type==='task'},
    {label:t?.status==='done'?'↩️ 미완료로':'✅ 완료',action:()=>{quickToggle(id,{stopPropagation:()=>{}});hideCtxMenu();}},
    {label:'🗑️ 삭제',danger:true,action:()=>{quickDeleteTask(id);hideCtxMenu();}},
  ].filter(i=>i.show!==false);
  menu.innerHTML=items.map((item,i)=>`<div class="ctx-item${item.danger?' danger':''}" data-idx="${i}">${item.label}</div>`).join('');
  document.body.appendChild(menu);
  ctxMenu=menu;
  // Position
  const x=Math.min(e.clientX, window.innerWidth-160);
  const y=Math.min(e.clientY, window.innerHeight-160);
  menu.style.left=x+'px';menu.style.top=y+'px';
  // Wire actions
  menu.querySelectorAll('.ctx-item').forEach((el,i)=>{
    el.addEventListener('click',e=>{e.stopPropagation();items[i].action();});
  });
}
function hideCtxMenu(){if(ctxMenu){ctxMenu.remove();ctxMenu=null;}}

function quickDeleteTask(id){
  const toDelete=[id,...allDescendants(id).map(t=>t.id)];
  pushUndo();
  tasks=tasks.filter(t=>!toDelete.includes(t.id));
  timeLogs=timeLogs.filter(l=>!toDelete.includes(l.taskId));
  saveLocal();scheduleSave();renderDaily();renderWeekly();renderBoard();renderTree();renderStats();
  showToast('삭제됐어요');
}

// ── Drag & Drop ───────────────────────────────────────────
let dragTaskId=null;
function onTodoDragStart(e, id){
  window._dragId=id;
  e.dataTransfer.setData('taskId',String(id));
  e.dataTransfer.setData('text/plain',String(id));
  e.dataTransfer.setData('type','todo'); // 'todo' = new schedule entry
  dragTaskId=id;
}
function onSlotDrop(e, h, half){
  e.preventDefault();
  e.currentTarget.querySelector('.tl-slot').classList.remove('drop-target');
  const type=e.dataTransfer.getData('type');
  const id=parseInt(e.dataTransfer.getData(type==='move'?'blockId':'taskId'));
  const t=tasks.find(t=>t.id===id); if(!t) return;
  const ds=dailyDateStr(dailyDate);
  // Use the slot's actual position for accurate drop time
  const slotEl=e.currentTarget;
  const rect=slotEl.getBoundingClientRect();
  const relY=e.clientY-rect.top;
  const snappedMins=Math.round(relY/SLOT_H)*30+(h*60)+(half?30:0);
  const dropH=Math.max(0,Math.min(23,Math.floor(snappedMins/60)));
  const dropM=snappedMins%60>=30?30:0;
  pushUndo();

  if(type==='move'){
    const existingLog=timeLogs.find(l=>l.taskId===id&&l.date===ds);
    if(existingLog){
      existingLog.startHour=dropH; existingLog.startMin=dropM;
    } else {
      timeLogs.push({id:nextLogId++,taskId:id,date:ds,startHour:dropH,startMin:dropM,duration:t.plannedTime||60,projId:t.projId});
    }
    t.startHour=dropH; t.startMin=dropM; t.due=ds;
  } else {
    const existingLog=timeLogs.find(l=>l.taskId===id&&l.date===ds);
    if(existingLog){
      existingLog.startHour=dropH; existingLog.startMin=dropM;
    } else {
      timeLogs.push({id:nextLogId++,taskId:id,date:ds,startHour:dropH,startMin:dropM,duration:t.plannedTime||60,projId:t.projId});
    }
    t.startHour=dropH; t.startMin=dropM; t.due=ds;
    if(!t.plannedTime) t.plannedTime=60;
  }
  saveLocal(); scheduleSave();
  renderDaily();
}
function onSlotClick(h, half){
  // Quick add task at this time
  const ds=dailyDateStr(dailyDate);
  const newTask={id:nextTaskId++,name:'새 작업',parentId:null,projId:selProjId||projects[0]?.id||1,memo:'',status:'todo',tag:'STUDIO',priority:'mid',due:ds,plannedTime:60,startHour:h,startMin:half?30:0};
  tasks.unshift(newTask);
  saveLocal(); scheduleSave(); renderDaily();
  setTimeout(()=>openPanel(newTask.id),50);
}

// ── Resize ────────────────────────────────────────────────
function startResize(e, taskId, el, direction='bottom'){
  const startY=e.clientY;
  const t=tasks.find(t=>t.id===taskId); if(!t) return;

  // 원본값 저장 (onMove 중에는 절대 건드리지 않음)
  const origDur=t.plannedTime||60;
  const origH=t.startHour||0;
  const origM=t.startMin||0;
  const origMins=origH*60+origM;

  // 현재 확정값 추적 (onMove에서만 업데이트)
  let curDur=origDur;
  let curMins=origMins;

  function onMove(ev){
    const dy=ev.clientY-startY;
    if(direction==='bottom'){
      const rawDur=origDur+dy/SLOT_H*30;
      curDur=Math.max(30, Math.round(rawDur/30)*30);
      el.style.height=Math.max(30,(curDur/30)*SLOT_H)+'px';
    } else {
      const rawMins=origMins+dy/SLOT_H*30;
      const snapped=Math.round(rawMins/30)*30;
      curMins=Math.max(0, Math.min(snapped, origMins+origDur-30));
      curDur=Math.max(30, origDur-(curMins-origMins));
      el.style.top=minsToTop(curMins)+'px';
      el.style.height=Math.max(30,(curDur/30)*SLOT_H)+'px';
    }
    // 시간 텍스트만 업데이트 (task 데이터는 절대 건드리지 않음)
    const displayH=direction==='bottom'?origH:Math.floor(curMins/60);
    const displayM=direction==='bottom'?origM:curMins%60;
    const timeEl=el.querySelector('.tl-block-time');
    if(timeEl) timeEl.textContent=fmtHM(displayH, displayM)+' · '+fmtMins(curDur);
  }

  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    pushUndo();
    // onUp에서만 task 데이터 최종 확정
    t.plannedTime=curDur;
    if(direction==='top'){
      t.startHour=Math.floor(curMins/60);
      t.startMin=curMins%60;
    }
    // timeLogs 업데이트
    const ds=dailyDateStr(dailyDate);
    const existLog=timeLogs.find(l=>l.taskId===t.id&&l.date===ds);
    if(existLog){
      existLog.startHour=t.startHour;
      existLog.startMin=t.startMin||0;
      existLog.duration=t.plannedTime;
    }
    saveLocal(); scheduleSave(); renderDaily(); renderWeekly();
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

// ── Todo Enter ────────────────────────────────────────────
function onTodoEnter(e){
  if(e.key!=='Enter') return;
  if(e.isComposing||window._composing) return;
  if(document.getElementById('proj-overlay')?.classList.contains('open')) return;
  if(document.getElementById('task-overlay')?.classList.contains('open')) return;
  const input=document.getElementById('todo-input');
  if(!input) return;
  const name=input.value.trim(); if(!name) return;
  if(!dailyDate) dailyDate=new Date();
  const ds=dailyDateStr(dailyDate);
  const newTask={id:nextTaskId++,name,parentId:null,projId:selProjId||projects[0]?.id||1,memo:'',status:'todo',tag:'STUDIO',priority:'mid',due:ds,plannedTime:0};
  pushUndo();
  tasks.unshift(newTask);
  input.value='';
  saveLocal(); scheduleSave(); renderDaily();
}

// ── Weekly ────────────────────────────────────────────────
function getWeekDates(){
  const now=new Date();
  const dow=now.getDay();
  const monday=new Date(now); monday.setDate(now.getDate()-dow+1+(weekOffset*7));
  return Array.from({length:7},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d; });
}

function renderWeekly(){
  const dates=getWeekDates();
  const startStr=`${dates[0].getMonth()+1}/${dates[0].getDate()}`;
  const endStr=`${dates[6].getMonth()+1}/${dates[6].getDate()}`;
  const wlEl=document.getElementById('weekly-label'); if(wlEl) wlEl.textContent=`${dates[0].getFullYear()}년 ${startStr} - ${endStr}`;

  const dayNames=['일','월','화','수','목','금','토'];
  const todayS=todayStr();

  // Weekly todo: all tasks this week
  const weekStrs=dates.map(d=>dailyDateStr(d));
  const weekStart=weekStrs[0];
  const weekTasks=tasks.filter(t=>weekStrs.includes(t.due)||t.status==='doing');

  // 이월된 미완료: 이번 주 시작일 이전이고 미완료인 작업
  const remainingTasks=tasks.filter(t=>{
    if(t.status==='done') return false;
    if(weekTasks.includes(t)) return false;
    if(t.due && t.due < weekStart) return true;
    return false;
  });

  const wList=document.getElementById('weekly-todo-list');

  function makeWeeklyTodoItem(t, extra=''){
    const projBtns=projects.map(p=>`<div class="todo-swipe-proj" style="background:${p.color}" onclick="assignProj(event,${t.id},${p.id})">${p.icon}</div>`).join('');
    const isRemaining=extra==='remaining';
    return`<div class="todo-item${isRemaining?' remaining':''}" data-id="${t.id}" draggable="true" ondragstart="onTodoDragStart(event,${t.id})">
      <div class="todo-swipe-right" id="swipe-right-${t.id}">${projBtns}</div>
      <div class="todo-swipe-left" id="swipe-left-${t.id}">🗑 삭제</div>
      <div class="todo-inner" id="todo-inner-${t.id}">
        <div class="todo-chk ${t.status==='done'?'done':''}" onclick="quickToggle(${t.id},event)">✓</div>
        <span class="todo-chk-dot" style="width:7px;height:7px;border-radius:50%;background:${getProj(t.projId).color};flex-shrink:0;display:inline-block"></span>
        <span class="todo-name ${t.status==='done'?'done':''}" style="font-size:12px" onclick="openPanel(${t.id})">${esc(t.name)}</span>
        ${isRemaining&&t.due?`<span class="remaining-date">${fmtDate(t.due)}</span>`:''}
        <button class="todo-more" onclick="showCtxMenu(event,${t.id},'task')">···</button>
      </div>
    </div>`;
  }

  const weekHtml=weekTasks.length===0
    ?'<div style="font-size:12px;color:var(--text3)">이번 주 작업 없음</div>'
    :weekTasks.map(t=>makeWeeklyTodoItem(t)).join('');

  const remainHtml=remainingTasks.length>0?`
    <div class="remaining-section">
      <div class="remaining-header">이월된 미완료 (${remainingTasks.length})</div>
      ${remainingTasks.map(t=>makeWeeklyTodoItem(t,'remaining')).join('')}
    </div>`:'';

  wList.innerHTML=(weekTasks.length===0?'<div style="font-size:12px;color:var(--text3);padding:4px 0">이번 주 작업 없음</div>':weekHtml)+remainHtml;
  wList.querySelectorAll('.todo-item').forEach(el=>attachSwipe(el));

  // ── Weekly timeline: absolute positioning (same as daily) ──
  const TOTAL_H = 24 * 60; // minutes
  const TOTAL_PX = TOTAL_H / 30 * SLOT_H; // total height in px
  const TIME_COL = 44;
  const COLS = dates.length;

  const wrap = document.getElementById('weekly-tl-wrap');

  // All-day events per day (종일 일정 - dateTime 없는 것)
  const allDayByDay={};
  dates.forEach(d=>{
    const ds=dailyDateStr(d);
    allDayByDay[ds]=gcalEvents.filter(e=>{
      if(e.start.dateTime) return false;
      const ed=e.start.date||'';
      const endD=e.end?.date||ed;
      return ed<=ds&&endD>ds;
    });
  });
  const hasAllDay=Object.values(allDayByDay).some(evs=>evs.length>0);

  // Header
  let html = `<div class="weekly-header" style="display:grid;grid-template-columns:${TIME_COL}px repeat(${COLS},1fr)">
    <div style="border-right:1px solid var(--border)"></div>
    ${dates.map(d=>{
      const isT=dailyDateStr(d)===todayS;
      return`<div class="weekly-day-hd${isT?' today-col':''}" ondblclick="goToDailyDate('${dailyDateStr(d)}')" title="더블클릭 → 데일리">${dayNames[d.getDay()]} ${d.getDate()}</div>`;
    }).join('')}
  </div>`;

  // All-day row (종일 일정 헤더 아래에 별도 표시)
  if(hasAllDay){
    html+=`<div class="weekly-allday-row" style="display:grid;grid-template-columns:${TIME_COL}px repeat(${COLS},1fr)">
      <div class="weekly-allday-cell" style="font-size:10px;color:var(--text3);display:flex;align-items:center;justify-content:flex-end;padding-right:6px">종일</div>
      ${dates.map(d=>{
        const ds=dailyDateStr(d);
        const evs=allDayByDay[ds]||[];
        return`<div class="weekly-allday-cell">${evs.map(e=>`<div class="weekly-allday-ev" style="background:${e._calColor||'#4285f4'}22;color:${e._calColor||'#4285f4'}">${esc(e.summary||'(종일)')}</div>`).join('')}</div>`;
      }).join('')}
    </div>`;
  }

  // Body: position:relative container
  html += `<div class="weekly-body" style="height:${TOTAL_PX}px;display:grid;grid-template-columns:${TIME_COL}px repeat(${COLS},1fr)">`;

  // Time axis labels
  html += `<div style="position:relative;border-right:1px solid var(--border)">`;
  for(let h=0;h<24;h++){
    const top = minsToTop(h*60);
    const lbl = h===0?'12am':h<12?`${h}am`:h===12?'12pm':`${h-12}pm`;
    html += `<div class="weekly-time-label" style="top:${top}px">${lbl}</div>`;
  }
  html += `</div>`;

  // Day columns
  dates.forEach((d,di)=>{
    const ds = dailyDateStr(d);
    const isT = ds === todayS;
    html += `<div class="weekly-day-col" style="position:relative;border-right:${di<COLS-1?'1px solid var(--border)':'none'};overflow:visible" id="wcol-${ds}"
      ondragenter="event.preventDefault()"
      ondragover="event.preventDefault();event.stopPropagation()"
      ondrop="handleWeeklyColDrop(event,'${ds}')"
      onclick="handleWeeklyColClick(event,'${ds}')">`;

    // Hour/half grid lines
    for(let h=0;h<24;h++){
      html += `<div class="weekly-hour-line" style="top:${minsToTop(h*60)}px"></div>`;
      html += `<div class="weekly-half-line" style="top:${minsToTop(h*60+30)}px"></div>`;
    }

    // Transparent drop zones (30min each)
    for(let h=0;h<24;h++){
      for(let half=0;half<2;half++){
        html += `<div class="weekly-drop-zone" style="top:${minsToTop(h*60+(half?30:0))}px;height:${SLOT_H}px" data-ds="${ds}" data-h="${h}" data-half="${half}"></div>`;
      }
    }

    html += `</div>`;
  });

  // Now line — 렌더링 후 DOM에서 정확한 컬럼 위치 계산
  if(dates.some(d=>dailyDateStr(d)===todayS)){
    const now=new Date();
    const nowPx=minsToTop(now.getHours()*60+now.getMinutes());
    const todayIdx=dates.findIndex(d=>dailyDateStr(d)===todayS);
    // % 대신 todayIdx/COLS 비율로 정확히 계산 (TIME_COL 제외)
    // after render, inject into correct col
    html += `<div id="weekly-now-placeholder" data-today-idx="${todayIdx}" data-now-px="${nowPx}" data-cols="${COLS}" style="display:none"></div>`;
  }

  html += `</div>`;
  wrap.innerHTML = `<div class="weekly-grid">${html}</div>`;

  // Position now-line after DOM is set
  const ph=document.getElementById('weekly-now-placeholder');
  if(ph){
    const todayIdx=parseInt(ph.dataset.todayIdx);
    const nowPx=parseInt(ph.dataset.nowPx);
    const COLS_N=parseInt(ph.dataset.cols);
    const todayDs=dailyDateStr(dates[todayIdx]);
    const col=document.getElementById('wcol-'+todayDs);
    if(col){
      const line=document.createElement('div');
      line.style.cssText=`position:absolute;top:${nowPx}px;left:0;right:0;height:2px;background:var(--red);z-index:15;pointer-events:none`;
      const dot=document.createElement('div');
      dot.style.cssText=`position:absolute;top:${nowPx-3}px;left:-4px;width:8px;height:8px;border-radius:50%;background:var(--red);z-index:15;pointer-events:none`;
      col.appendChild(line);
      col.appendChild(dot);
    }
  }

  // Render task blocks with overlap column layout
  dates.forEach(d=>{
    const ds=dailyDateStr(d);
    const col=document.getElementById('wcol-'+ds);
    if(!col) return;
    col._date=d; // store date object for drag handler

    // PM tasks for this day
    const dayTasks=tasks.filter(t=>t.due===ds&&t.startHour!=null&&t.startHour!==''&&t.startHour!==undefined);

    // timeLogs for this day
    const logsForDay=timeLogs.filter(l=>l.date===ds);
    const loggedTaskIds=new Set(logsForDay.map(l=>l.taskId));
    const unloggedTasks=dayTasks.filter(t=>!loggedTaskIds.has(t.id));
    const logBlocks=logsForDay.map(l=>({
      ...tasks.find(t=>t.id===l.taskId)||{},
      startHour:l.startHour,startMin:l.startMin,plannedTime:l.duration,_logId:l.id
    })).filter(b=>b.id);
    const allPMBlocks=[...logBlocks,...unloggedTasks];

    // GCal events (중복 제거)
    const gcalBlocks=gcalEvents.filter(e=>{
      if(!e.start.dateTime) return false;
      if(e.start.dateTime.split('T')[0]!==ds) return false;
      return !tasks.some(t=>(t.gcalEventId&&t.gcalEventId===e.id)||(t.due===ds&&t.name===e.summary&&t.startHour!==undefined));
    });

    // Convert gcal to block-like objects for column computation
    const gcalAsBlocks=gcalBlocks.map(e=>{
      const s=new Date(e.start.dateTime);
      const en=e.end?.dateTime?new Date(e.end.dateTime):new Date(s.getTime()+3600000);
      const startMins=s.getHours()*60+s.getMinutes();
      const maxMins=24*60-startMins;
      const dur=Math.min(Math.round((en-s)/60000), maxMins);
      return{_gcal:e,startHour:s.getHours(),startMin:s.getMinutes(),plannedTime:dur,id:'gcal-'+e.id};
    });

    // Compute columns for all blocks together
    const allBlocks=[...allPMBlocks,...gcalAsBlocks];
    const colMap=computeColumns(allBlocks);

    // Render PM blocks
    allPMBlocks.forEach(t=>renderWeeklyTaskBlock(t,col,colMap[t.id]||{col:0,total:1}));
    // Render GCal blocks
    gcalAsBlocks.forEach(b=>renderWeeklyGcalBlock(b._gcal,col,colMap[b.id]||{col:0,total:1}));
  });

  // Scroll to 8am or now
  setTimeout(()=>{ if(wrap) wrap.scrollTop=minsToTop(8*60); },50);
}

function renderWeeklyTaskBlock(t, col, colInfo={col:0,total:1}){
  const startMins=(t.startHour||0)*60+(t.startMin||0);
  const dur=t.plannedTime||60;
  const top=minsToTop(startMins);
  const height=Math.max(22,(dur/30)*SLOT_H);
  const p=getProj(t.projId);
  const c=colInfo.col||0;
  const total=colInfo.total||1;
  const pct=100/total;
  const leftPct=c*pct;

  const el=document.createElement('div');
  el.className='weekly-block';
  el.id='wb-'+t.id;
  el.style.cssText=`top:${top}px;height:${height}px;left:calc(${leftPct}% + 1px);width:calc(${pct}% - 2px);background:${p.color}22;border:1.5px solid ${p.color}55;color:${p.color};overflow:visible;position:absolute`;

  el.innerHTML=`
    <div class="weekly-block-top-handle" style="position:absolute;top:-3px;left:0;right:0;height:12px;cursor:ns-resize;z-index:11;border-radius:4px 4px 0 0"></div>
    <div class="weekly-block-name" style="padding:2px 5px;pointer-events:none">${esc(t.name)}</div>
    <div class="weekly-block-time" style="padding:0 5px;pointer-events:none;font-size:10px;opacity:.75">${fmtHM(t.startHour,t.startMin||0)} · ${fmtMins(dur)}</div>
    <div class="weekly-block-resize" style="position:absolute;bottom:-3px;left:0;right:0;height:14px;cursor:ns-resize;z-index:11;border-radius:0 0 4px 4px"></div>
  `;

  const ds=dailyDateStr(col._date||new Date());

  // ── Mouse drag: normal=move, Cmd=add log, Option=copy ──
  el.addEventListener('mousedown', e=>{
    if(e.target.classList.contains('weekly-block-resize')||e.target.classList.contains('weekly-block-top-handle')) return;
    e.preventDefault();
    e.stopPropagation();
    const isCmdDrag=e.metaKey||e.ctrlKey;
    const isOptDrag=e.altKey;
    const startX=e.clientX, startY=e.clientY;
    const origTop=parseInt(el.style.top);
    let moved=false, ghost=null;

    if(isCmdDrag||isOptDrag){
      ghost=el.cloneNode(true);
      ghost.style.opacity='0.5';ghost.style.pointerEvents='none';ghost.style.zIndex='999';
      el.parentNode.appendChild(ghost);
    }

    function onMove(mv){
      moved=true;
      const dy=mv.clientY-startY;
      const newTop=Math.max(0,origTop+dy);
      if(isCmdDrag||isOptDrag){ if(ghost) ghost.style.top=newTop+'px'; el.style.opacity='0.85'; }
      else{ el.style.top=newTop+'px'; el.style.opacity='0.7'; }
    }
    function onUp(){
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      el.style.opacity='1';
      if(ghost) ghost.remove();
      if(!moved) return;
      pushUndo();

      const targetTop=parseInt((isCmdDrag||isOptDrag)?ghost?.style.top||origTop:el.style.top)||origTop;
      const newMins=Math.round(targetTop/SLOT_H)*30;
      const newH=Math.floor(newMins/60);
      const newM=newMins%60;

      if(isCmdDrag){
        // Cmd+drag: 같은 task에 새 날짜 timeLog 추가 (t.due 건드리지 않음)
        timeLogs.push({id:nextLogId++,taskId:t.id,date:ds,startHour:newH,startMin:newM,duration:t.plannedTime||60,projId:t.projId});
        showToast('같은 작업에 시간 추가됐어요 +'+fmtMins(t.plannedTime||60));
      } else if(isOptDrag){
        // Option+drag: 이름 같은 완전히 독립된 새 task 생성
        const newTask={
          id:nextTaskId++, name:t.name, parentId:null, projId:t.projId,
          memo:'', status:'todo', tag:t.tag||'STUDIO', priority:t.priority||'mid',
          due:ds, plannedTime:t.plannedTime||60, startHour:newH, startMin:newM,
        };
        tasks.unshift(newTask);
        timeLogs.push({id:nextLogId++,taskId:newTask.id,date:ds,startHour:newH,startMin:newM,duration:newTask.plannedTime,projId:newTask.projId});
        showToast('독립 작업으로 복사됐어요');
      } else {
        // Normal move: 기존 log 날짜 변경
        const oldLog=timeLogs.find(l=>l.taskId===t.id&&l.date===(t.due||ds));
        if(oldLog){ oldLog.startHour=newH; oldLog.startMin=newM; oldLog.date=ds; }
        else timeLogs.push({id:nextLogId++,taskId:t.id,date:ds,startHour:newH,startMin:newM,duration:t.plannedTime||60,projId:t.projId});
        t.startHour=newH; t.startMin=newM; t.due=ds;
      }
      saveLocal();scheduleSave();renderWeekly();renderDaily();
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });

  el.addEventListener('click',e=>{e.stopPropagation();toggleSelect(t.id,'cal');});
  el.addEventListener('dblclick',e=>{e.stopPropagation();openPanel(t.id);});
  el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();showCtxMenu(e,t.id,'block');});

  // ── Bottom resize ──
  const resizeHandle=el.querySelector('.weekly-block-resize');
  resizeHandle.addEventListener('mousedown',e=>{
    e.stopPropagation();e.preventDefault();
    startWeeklyResize(e,t.id,el,'bottom',ds);
  });
  // ── Top resize ──
  const topHandle=el.querySelector('.weekly-block-top-handle');
  topHandle.addEventListener('mousedown',e=>{
    e.stopPropagation();e.preventDefault();
    startWeeklyResize(e,t.id,el,'top',ds);
  });

  col.appendChild(el);
}


function renderWeeklyGcalBlock(e, col, colInfo={col:0,total:1}){
  // 종일 일정(dateTime 없음)은 시간표에 표시 안 함 — 헤더 종일 행에서 처리
  if(!e.start.dateTime) return;
  const start=new Date(e.start.dateTime);
  const end=e.end?.dateTime?new Date(e.end.dateTime):new Date(start.getTime()+3600000);
  const startMins=start.getHours()*60+start.getMinutes();
  // duration 최대 자정까지만 (당일을 넘어가는 일정 클리핑)
  const maxMins=24*60-startMins;
  const dur=Math.min(Math.round((end-start)/60000), maxMins);
  const top=minsToTop(startMins);
  const height=Math.max(22,(dur/30)*SLOT_H);
  const color=e._calColor||'#4285f4';
  const c=colInfo.col||0;
  const total=colInfo.total||1;
  const pct=100/total;
  const leftPct=c*pct;

  const el=document.createElement('div');
  el.className='weekly-block';
  el.style.cssText=`top:${top}px;height:${height}px;left:calc(${leftPct}% + 1px);width:calc(${pct}% - 2px);background:${color}22;border-left:3px solid ${color};color:${color};cursor:default;pointer-events:none`;
  el.innerHTML=`<div class="weekly-block-name">📅 ${esc(e.summary||'')}</div><div class="weekly-block-time">${fmtHM(start.getHours(),start.getMinutes())} · ${fmtMins(dur)}</div>`;
  col.appendChild(el);
}

function startWeeklyResize(e, taskId, el, direction='bottom', ds=null){
  const startY=e.clientY;
  const t=tasks.find(t=>t.id===taskId); if(!t) return;
  const origDur=t.plannedTime||60;
  const origH=t.startHour||0;
  const origM=t.startMin||0;
  const origMins=origH*60+origM;
  const date=ds||dailyDateStr(dailyDate);
  let curDur=origDur;
  let curMins=origMins;

  function onMove(ev){
    const dy=ev.clientY-startY;
    if(direction==='bottom'){
      curDur=Math.max(30,Math.round((origDur+dy/SLOT_H*30)/30)*30);
      el.style.height=Math.max(22,(curDur/30)*SLOT_H)+'px';
    } else {
      const deltaMins=Math.round(dy/SLOT_H)*30;
      curMins=Math.max(0,Math.min(origMins+deltaMins,origMins+origDur-30));
      curDur=Math.max(30,origDur-(curMins-origMins));
      el.style.top=minsToTop(curMins)+'px';
      el.style.height=Math.max(22,(curDur/30)*SLOT_H)+'px';
    }
    const displayH=direction==='bottom'?origH:Math.floor(curMins/60);
    const displayM=direction==='bottom'?origM:curMins%60;
    const timeEl=el.querySelector('.weekly-block-time');
    if(timeEl) timeEl.textContent=fmtHM(displayH,displayM)+' · '+fmtMins(curDur);
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    pushUndo();
    // onUp에서만 task 데이터 확정
    t.plannedTime=curDur;
    if(direction==='top'){
      t.startHour=Math.floor(curMins/60);
      t.startMin=curMins%60;
    }
    const lg=timeLogs.find(l=>l.taskId===taskId&&l.date===date);
    if(lg){lg.startHour=t.startHour;lg.startMin=t.startMin||0;lg.duration=t.plannedTime;}
    else{timeLogs.push({id:nextLogId++,taskId,date,startHour:t.startHour,startMin:t.startMin||0,duration:t.plannedTime,projId:t.projId});}
    saveLocal();scheduleSave();renderWeekly();renderDaily();
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}


function handleWeeklyColDrop(e, ds){
  e.preventDefault();
  const id=window._dragId||parseInt(e.dataTransfer.getData('text/plain'))||parseInt(e.dataTransfer.getData('taskId'));
  window._dragId=null;
  if(!id||isNaN(id)) return;
  const t=tasks.find(t=>t.id===id); if(!t) return;
  // Calculate time from Y position
  const col=e.currentTarget;
  const rect=col.getBoundingClientRect();
  const relY=e.clientY-rect.top+col.scrollTop;
  const mins=Math.round(topToMins(relY)/30)*30;
  const h=Math.floor(mins/60), m=mins%60;
  t.due=ds; t.startHour=Math.min(23,Math.max(0,h)); t.startMin=m;
  if(!t.plannedTime) t.plannedTime=60;
  saveLocal();scheduleSave();renderWeekly();renderDaily();
  showToast(fmtHM(t.startHour,t.startMin)+' 로 이동했어요');
}

function handleWeeklyColClick(e, ds){
  if(window._dragId){window._dragId=null;return;}
  if(e.target.closest('.weekly-block')) return;
  const col=e.currentTarget;
  const rect=col.getBoundingClientRect();
  const relY=e.clientY-rect.top;
  const mins=Math.round(topToMins(relY)/30)*30;
  const h=Math.min(23,Math.floor(mins/60)), half=mins%60>=30?1:0;
  onWeekCellClick(ds,h,half);
}

// ── Report ────────────────────────────────────────────────
let monthlyYear=new Date().getFullYear(), monthlyMonth=new Date().getMonth();
function changeMonthlyMonth(d){monthlyMonth+=d;if(monthlyMonth>11){monthlyMonth=0;monthlyYear++;}if(monthlyMonth<0){monthlyMonth=11;monthlyYear--;}renderMonthly();}
function goMonthlyToday(){monthlyYear=new Date().getFullYear();monthlyMonth=new Date().getMonth();renderMonthly();}

function renderMonthly(){
  const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const DAYS=['일','월','화','수','목','금','토'];
  const mlEl=document.getElementById('monthly-label'); if(mlEl) mlEl.textContent=monthlyYear+'년 '+MONTHS[monthlyMonth];
  const mwEl=document.getElementById('monthly-wrap'); if(!mwEl) return;
  const today=new Date(); const todayS=todayStr();
  const first=new Date(monthlyYear,monthlyMonth,1).getDay();
  const daysInMonth=new Date(monthlyYear,monthlyMonth+1,0).getDate();
  const prevDays=new Date(monthlyYear,monthlyMonth,0).getDate();

  let html='<div class="monthly-grid">';
  // Day labels
  DAYS.forEach(d=>{ html+=`<div class="monthly-day-lbl">${d}</div>`; });
  // Prev month padding
  for(let i=0;i<first;i++){
    const d=prevDays-first+1+i;
    html+=`<div class="monthly-cell other-month"><div class="monthly-day-num">${d}</div></div>`;
  }
  // Days
  for(let d=1;d<=daysInMonth;d++){
    const ds=monthlyYear+'-'+String(monthlyMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=ds===todayS;
    const dayTasks=tasks.filter(t=>t.due===ds);
    const gcalDay=gcalEvents.filter(e=>{
      const ed=e.start.dateTime?e.start.dateTime.split('T')[0]:e.start.date;
      if(ed!==ds) return false;
      const isDuplicate=tasks.some(t=>
        (t.gcalEventId&&t.gcalEventId===e.id)||
        (t.due===ds&&t.name===e.summary&&t.startHour!==undefined)
      );
      return !isDuplicate;
    });
    const allEvs=[
      ...dayTasks.map(t=>{const p=getProj(t.projId);const done=t.status==='done';return`<div class="monthly-ev" style="background:${p.color}${done?'11':'22'};color:${p.color};${done?'opacity:.45;text-decoration:line-through':''};border-left:2px solid ${p.color}" ondblclick="goToDailyDate('${ds}')" onclick="event.stopPropagation();openPanel(${t.id})">${esc(t.name)}</div>`;}),
      ...gcalDay.map(e=>`<div class="monthly-ev" style="background:${e._calColor||'#4285f4'}22;color:${e._calColor||'#4285f4'};border-left:2px solid ${e._calColor||'#4285f4'}">${esc(e.summary||'')}</div>`)
    ];
    const MAX=3;
    const evHtml=allEvs.slice(0,MAX).join('')+(allEvs.length>MAX?`<div class="monthly-more">+${allEvs.length-MAX}개</div>`:'');
    html+=`<div class="monthly-cell${isToday?' today':''}" ondblclick="goToDailyDate('${ds}')">
      <div class="monthly-day-num">${d}</div>
      ${evHtml}
    </div>`;
  }
  // Next month padding
  const total=first+daysInMonth;
  const remain=total%7===0?0:7-total%7;
  for(let d=1;d<=remain;d++) html+=`<div class="monthly-cell other-month"><div class="monthly-day-num">${d}</div></div>`;
  html+='</div>';
  document.getElementById('monthly-wrap').innerHTML=html;
}

let reportTagFilter=null; // null = 전체
let reportProjFilter=null; // null = 전체, projId = 특정 프로젝트/그룹

function renderReport(){
  // ── 프로젝트 필터 칩 렌더링 (재귀 트리) ──
  const projFilterEl=document.getElementById('report-proj-filter');
  if(projFilterEl){
    function buildProjFilterChips(parentId, depth){
      return projects.filter(p=>p.parentId===parentId).map(p=>{
        const disp=getProjDisplay(p.id);
        const isActive=reportProjFilter===p.id;
        const indent='　'.repeat(depth);
        return`<button class="pchip" onclick="setReportProjFilter(${p.id})" style="${isActive?'border-width:2px;border-color:'+disp.color+';font-weight:600;color:'+disp.color:''}">${indent}<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${disp.color};margin-right:4px;vertical-align:middle"></span>${esc(disp.icon)} ${esc(p.name)}</button>`;
      }).join('')+projects.filter(p=>p.parentId===parentId).map(p=>buildProjFilterChips(p.id,depth+1)).join('');
    }
    projFilterEl.innerHTML=
      `<button class="pchip" onclick="setReportProjFilter(null)" style="${reportProjFilter===null?'border-width:2px;border-color:#555;font-weight:600':''}">전체</button>`
      +buildProjFilterChips(null,0);
  }

  // ── 태그 필터 칩 렌더링 ──
  const tagFilterEl=document.getElementById('report-tag-filter');
  if(tagFilterEl){
    const allTags=Object.keys(TAGS);
    tagFilterEl.innerHTML='<button class="pchip" onclick="setReportTagFilter(null)" style="'+(reportTagFilter===null?'border-width:2px;border-color:#555;font-weight:600':'')+'">전체</button>'+
      allTags.map(tg=>`<button class="pchip" onclick="setReportTagFilter('${tg}')" style="${reportTagFilter===tg?'border-width:2px;border-color:var(--blue);font-weight:600':''}">${TAGS[tg].label}</button>`).join('');
  }

  // 프로젝트+태그 필터 모두 적용된 작업 목록
  let filteredTasks=tasks;
  if(reportProjFilter!==null){
    const allProjIds=[reportProjFilter,...projAllDescendantProjects(reportProjFilter).map(p=>p.id)];
    filteredTasks=filteredTasks.filter(t=>allProjIds.includes(t.projId));
  }
  if(reportTagFilter) filteredTasks=filteredTasks.filter(t=>t.tag===reportTagFilter);

  // timeLogs 기반 집계 — 완료된 작업의 모든 날짜 기록 합산
  function doneTime(taskList){
    const ids=new Set(taskList.filter(t=>t.status==='done').map(t=>t.id));
    const loggedTime=timeLogs.filter(l=>ids.has(l.taskId)).reduce((a,l)=>a+(l.duration||0),0);
    const loggedTaskIds=new Set(timeLogs.map(l=>l.taskId));
    const unloggedTime=taskList.filter(t=>t.status==='done'&&!loggedTaskIds.has(t.id)).reduce((a,t)=>a+(t.plannedTime||0),0);
    return loggedTime+unloggedTime;
  }

  // ── 상단 요약 카드 ──
  // 프로젝트 필터가 있으면 해당 프로젝트 + 직속 하위 프로젝트별로 분리해서 표시
  let summaryProjects;
  if(reportProjFilter!==null){
    // 선택된 프로젝트 + 직속 자식들
    const selP=projects.find(p=>p.id===reportProjFilter);
    const children=projChildProjects(reportProjFilter);
    summaryProjects=[selP,...children].filter(Boolean);
  } else {
    summaryProjects=projects.filter(p=>!p.parentId);
  }
  const pd=summaryProjects.map(p=>{
    const allProjIds=[p.id,...projAllDescendantProjects(p.id).map(c=>c.id)];
    const pt=filteredTasks.filter(t=>allProjIds.includes(t.projId));
    const total=doneTime(pt);
    const disp=getProjDisplay(p.id);
    return{...p,icon:disp.icon,color:disp.color,total,taskCount:pt.length,doneCount:pt.filter(t=>t.status==='done').length};
  }).filter(p=>p.taskCount>0||p.total>0||reportProjFilter!==null);
  const maxT=Math.max(...pd.map(p=>p.total),1);
  const filterLabel=(reportTagFilter?` · #${TAGS[reportTagFilter].label}`:'')+(reportProjFilter?` · ${esc(getProjDisplay(reportProjFilter).name)}`:'');
  document.getElementById('report-grid').innerHTML=pd.map(p=>`
    <div class="rcard" onclick="setReportProjFilter(${p.id})" style="cursor:pointer" title="${esc(p.name)} 자세히 보기">
      <div class="rcard-top"><div class="rcard-icon" style="background:${p.color}22">${esc(p.icon)}</div><div class="rcard-name">${esc(p.name)}</div></div>
      <div class="rcard-h" style="color:${p.color}">${fmtMins(p.total)||'0m'}</div>
      <div class="rcard-sub">${p.taskCount}개 작업 · 완료 ${p.doneCount}개${filterLabel||' (완료 시간만 집계)'}</div>
      <div class="rcard-bar"><div class="rcard-fill" style="width:${(p.total/maxT*100).toFixed(0)}%;background:${p.color}"></div></div>
    </div>`).join('')+(pd.length===0?'<div style="font-size:13px;color:var(--text3);padding:10px 0">해당하는 작업이 없어요</div>':'');

  // ── 월별 시간 차트 ──
  const now=new Date();
  const monthlyData=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    const y=d.getFullYear(), m=d.getMonth();
    const label=(m+1)+'월';
    const monthTasks=filteredTasks.filter(t=>{
      if(t.status!=='done'||!t.plannedTime||!t.due) return false;
      const td=new Date(t.due);
      return td.getFullYear()===y && td.getMonth()===m;
    });
    const total=monthTasks.reduce((a,t)=>a+(t.plannedTime||0),0);
    monthlyData.push({label,total,y,m});
  }
  const maxMonthly=Math.max(...monthlyData.map(d=>d.total),1);
  // Insert monthly chart before report-grid
  let monthlyChartEl=document.getElementById('report-monthly');
  if(!monthlyChartEl){
    monthlyChartEl=document.createElement('div');
    monthlyChartEl.id='report-monthly';
    monthlyChartEl.style.cssText='background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:18px';
    document.getElementById('report-grid').parentNode.insertBefore(monthlyChartEl, document.getElementById('report-grid'));
  }
  monthlyChartEl.innerHTML=`
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px">월별 완료 시간 (최근 6개월)${reportTagFilter?' · #'+TAGS[reportTagFilter].label:''}</div>
    <div style="display:flex;align-items:flex-end;gap:8px;height:80px">
      ${monthlyData.map(d=>{
        const pct=d.total?Math.max(8,(d.total/maxMonthly*100)):0;
        const isCur=d.y===now.getFullYear()&&d.m===now.getMonth();
        return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
          <div style="font-size:11px;font-weight:600;color:var(--text2)">${d.total?fmtMins(d.total):''}</div>
          <div style="width:100%;background:${isCur?'var(--blue)':'var(--blue)66'};border-radius:4px 4px 0 0;height:${pct}%;min-height:${d.total?4:0}px;transition:height .4s"></div>
          <div style="font-size:11px;color:${isCur?'var(--blue)':'var(--text3)'};font-weight:${isCur?700:400}">${d.label}</div>
        </div>`;
      }).join('')}
    </div>
  `;

  // ── 트리 형식 로그 (최상위 프로젝트만, 태그 필터 적용) ──
  const logEl=document.getElementById('report-log');

  // 프로젝트 필터: 선택된 프로젝트부터 트리 시작
  const treeRootProjects=reportProjFilter!==null
    ? projects.filter(p=>p.id===reportProjFilter)
    : projects.filter(p=>!p.parentId);

  let treeHtml='';
  treeRootProjects.forEach(p=>{
    const allProjIds=[p.id, ...projAllDescendantProjects(p.id).map(c=>c.id)];
    const projTasksFiltered=filteredTasks.filter(t=>allProjIds.includes(t.projId));
    const rootLevelTasks=filteredTasks.filter(t=>t.projId===p.id&&!t.parentId);
    if(!projTasksFiltered.length) return;
    const projTotal=doneTime(projTasksFiltered);
    const disp=getProjDisplay(p.id);
    treeHtml+=`<div class="rt-proj" id="rt-proj-${p.id}">
      <div class="rt-proj-head" onclick="toggleReportProj(${p.id})">
        <span class="rt-arrow" id="rt-arr-${p.id}">▶</span>
        <span class="rt-proj-icon" style="background:${disp.color}22">${disp.icon}</span>
        <span class="rt-proj-name">${esc(p.name)}</span>
        <span class="rt-proj-time" style="color:${disp.color}">${fmtMins(projTotal)||'0m'}</span>
      </div>
      <div class="rt-proj-body" id="rt-body-${p.id}" style="display:none">
        ${buildTaskTree(rootLevelTasks, 1, disp.color)}
      </div>
    </div>`;
  });

  logEl.innerHTML=treeHtml||'<div style="font-size:13px;color:var(--text3);padding:10px 0">'+(reportTagFilter?'이 태그에 해당하는 작업이 없어요':'완료된 작업이 없어요')+'</div>';

  // ── 시간 기록 로그 (timeLogs 기반, 태그 필터 적용) ──
  const filteredTaskIds=new Set(filteredTasks.map(t=>t.id));
  const sortedLogs=[...timeLogs].filter(l=>!reportTagFilter||filteredTaskIds.has(l.taskId)).sort((a,b)=>b.date.localeCompare(a.date));
  const logListEl=document.getElementById('report-log');
  const logSection=`<div style="margin-top:18px">
    <div class="sec-title" style="margin-bottom:10px">시간 기록 로그</div>
    ${sortedLogs.length===0
      ?'<div style="font-size:13px;color:var(--text3)">스케줄에 작업을 배치하면 기록이 쌓여요!</div>'
      :sortedLogs.map(l=>{
        const t=tasks.find(t=>t.id===l.taskId)||{name:'(삭제된 작업)',projId:l.projId||0};
        const p=getProjDisplay(t.projId||l.projId);
        const isDone=t.status==='done';
        return`<div class="log-row">
          <div class="log-date">${fmtDate(l.date)}</div>
          <div class="log-proj"><span style="width:7px;height:7px;border-radius:50%;background:${p.color};display:inline-block;margin-right:3px"></span>${esc(p.name)}</div>
          <div class="log-task" style="${isDone?'text-decoration:line-through;color:var(--text3)':''}min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(t.name)}</div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            ${isDone?'<span style="font-size:10px;background:var(--green)22;color:var(--green);padding:1px 5px;border-radius:4px;font-weight:600">완료</span>':''}
            <div class="log-h">${fmtHM(l.startHour,l.startMin||0)} · ${fmtMins(l.duration)}</div>
          </div>
        </div>`;
      }).join('')}
  </div>`;
  logListEl.insertAdjacentHTML('beforeend', logSection);
}

function buildTaskTree(taskList, depth, color){
  if(!taskList.length) return '';
  return taskList.map(t=>{
    const children=tasks.filter(c=>c.parentId===t.id);
    const isDone=t.status==='done';
    const time=isDone&&t.plannedTime?fmtMins(t.plannedTime):'';
    const childrenHtml=children.length?buildTaskTree(children, depth+1, color):'';
    const hasChildren=children.length>0;
    const indent=depth*16;
    return`<div class="rt-task-wrap">
      <div class="rt-task" style="padding-left:${indent}px" onclick="${hasChildren?`toggleReportTask('rt-sub-${t.id}')`:''}" >
        ${hasChildren?`<span class="rt-sub-arrow" id="rt-sub-arr-${t.id}">▶</span>`:'<span style="width:14px;display:inline-block"></span>'}
        <span class="rt-task-chk ${isDone?'done':''}">${isDone?'✓':''}</span>
        <span class="rt-task-name ${isDone?'':'rt-pending'}">${esc(t.name)}</span>
        ${time?`<span class="rt-task-time">${time}</span>`:''}
      </div>
      ${hasChildren?`<div id="rt-sub-${t.id}" style="display:none">${childrenHtml}</div>`:''}
    </div>`;
  }).join('');
}

  reportProjFilter=projId;

function setReportTagFilter(tag){
  reportTagFilter=tag;

}
function toggleReportProj(id){
  const body=document.getElementById('rt-body-'+id);
  const arr=document.getElementById('rt-arr-'+id);
  const open=body.style.display==='none';
  body.style.display=open?'block':'none';
  arr.textContent=open?'▼':'▶';
}
function toggleReportTask(id){
  const body=document.getElementById(id);
  const arrId=id.replace('rt-sub-','rt-sub-arr-');
  const arr=document.getElementById(arrId);
  if(!body) return;
  const open=body.style.display==='none';
  body.style.display=open?'block':'none';
  if(arr) arr.textContent=open?'▼':'▶';
}






// ── Side Panel ────────────────────────────────────────────
function openPanel(id){
  panelTaskId=id;
  const t=tasks.find(t=>t.id===id);if(!t)return;

  // breadcrumb
  const ancestors=getAncestors(id);
  const bc=document.getElementById('sp-breadcrumb');
  bc.innerHTML=ancestors.map(a=>`<span class="sp-bc-item" onclick="openPanel(${a.id})">${esc(a.name)}</span><span class="sp-bc-sep">›</span>`).join('')+`<span style="font-size:12px;color:var(--text2)">${esc(t.name)}</span>`;

  // populate project select
  const sel=document.getElementById('sp-proj');
  sel.innerHTML=projects.map(p=>`<option value="${p.id}">${esc(p.icon)} ${esc(p.name)}</option>`).join('');

  document.getElementById('sp-title').value=t.name;
  sel.value=t.projId;
  document.getElementById('sp-status').value=t.status;
  document.getElementById('sp-tag').value=t.tag;
  document.getElementById('sp-priority').value=t.priority;
  document.getElementById('sp-due').value=t.due||'';
  document.getElementById('sp-time').value=t.plannedTime||0;
  document.getElementById('sp-starthour').value=t.startHour??'';
  document.getElementById('sp-memo').value=t.memo||'';
  document.getElementById('sp-btn-del').style.visibility='visible';

  // subtasks
  renderPanelSubtasks(id);

  document.getElementById('sp-overlay').classList.add('open');
  document.getElementById('side-panel').classList.add('open');
}

function renderPanelSubtasks(id){
  const children=childTasks(id);
  const done=children.filter(c=>c.status==='done').length;
  const pct=children.length?Math.round(done/children.length*100):0;
  document.getElementById('sp-prog-text').textContent=children.length?`${done}/${children.length} 완료`:'';
  document.getElementById('sp-prog-fill').style.width=pct+'%';
  document.getElementById('sp-subtask-list').innerHTML=children.map(c=>`
    <div class="sp-sub-row" onclick="openPanel(${c.id})">
      <div class="chk ${c.status==='done'?'done':''}" onclick="quickToggle(${c.id},event)" style="width:14px;height:14px;font-size:9px">✓</div>
      <span class="sp-sub-name ${c.status==='done'?'done':''}">${esc(c.name)}</span>
      ${c.due?`<span class="sp-sub-date">${fmtDate(c.due)}</span>`:''}
      <span class="sp-sub-chevron">›</span>
    </div>`).join('');
}

function closeSidePanel(){
  document.getElementById('sp-overlay').classList.remove('open');
  document.getElementById('side-panel').classList.remove('open');
  panelTaskId=null;
}

function autoSavePanel(){if(panelTaskId!==null)savePanel(true);}
function savePanel(silent=false){
  if(panelTaskId===null)return;
  const t=tasks.find(t=>t.id===panelTaskId);if(!t)return;
  pushUndo();
  t.name=document.getElementById('sp-title').value.trim()||t.name;
  t.projId=parseInt(document.getElementById('sp-proj').value);
  t.status=document.getElementById('sp-status').value;
  t.tag=document.getElementById('sp-tag').value;
  t.priority=document.getElementById('sp-priority').value;
  t.due=document.getElementById('sp-due').value;
  t.plannedTime=parseInt(document.getElementById('sp-time').value)||0;
  const sh=document.getElementById('sp-starthour').value;
  t.startHour=sh===''?undefined:parseInt(sh);
  t.memo=document.getElementById('sp-memo').value;
  saveLocal();scheduleSave();syncTaskToGcal(t);
  if(!silent){showToast('저장됐어요');renderAll();}else{renderAll();}
}

function addSubTask(){
  if(panelTaskId===null)return;
  const parent=tasks.find(t=>t.id===panelTaskId);
  const newTask={id:nextTaskId++,name:'새 하위 작업',parentId:panelTaskId,projId:parent.projId,memo:'',status:'todo',tag:parent.tag||'STUDIO',priority:'mid',due:'',plannedTime:0};
  pushUndo();
  tasks.push(newTask);
  saveLocal();scheduleSave();
  renderPanelSubtasks(panelTaskId);
  renderAll();
  // open the new subtask
  setTimeout(()=>openPanel(newTask.id),100);
}

let _confirmResolve=null;
function showConfirm(msg){
  return new Promise(resolve=>{
    _confirmResolve=resolve;
    document.getElementById('confirm-msg').textContent=msg;
    document.getElementById('confirm-box').classList.remove('hide');
  });
}
function confirmResolve(val){
  document.getElementById('confirm-box').classList.add('hide');
  if(_confirmResolve){_confirmResolve(val);_confirmResolve=null;}
}
function deleteTaskFromPanel(){
  if(panelTaskId===null)return;
  showConfirm('이 작업과 하위 작업을 모두 삭제할까요?').then(ok=>{
    if(!ok)return;
    pushUndo();
  const toDelete=[panelTaskId,...allDescendants(panelTaskId).map(t=>t.id)];
    tasks=tasks.filter(t=>!toDelete.includes(t.id));
    saveLocal();scheduleSave();closeSidePanel();renderAll();
  });
}

function openNewTask(){
  const newTask={id:nextTaskId++,name:'새 작업',parentId:null,projId:selProjId||projects[0]?.id||1,memo:'',status:'todo',tag:'STUDIO',priority:'mid',due:todayStr(),plannedTime:0};
  tasks.unshift(newTask);
  syncTaskToGcal(newTask);
  saveLocal();scheduleSave();renderAll();
  openPanel(newTask.id);
}

  // Build cat buttons
  const cats=document.getElementById('emoji-cats');
  if(cats) cats.innerHTML=EMOJI_CATS.map((c,i)=>`<button class="emoji-cat-btn${i===emojiCatIdx?' active':''}" onclick="switchEmojiCat(${i})" title="${c.name}">${c.label}</button>`).join('');
}
function renderEmojiGrid(emojis){
  const grid=document.getElementById('emoji-grid');
  if(!grid) return;
  grid.innerHTML=emojis.map(e=>`<button class="emoji-opt${e===selIcon?' sel':''}" onclick="selectIcon('${e}')">${e}</button>`).join('');
}
function filterEmoji(q){
  if(!q.trim()){renderEmojiGrid(EMOJI_CATS[emojiCatIdx].emojis);return;}
  const all=EMOJI_CATS.flatMap(c=>c.emojis);
  renderEmojiGrid(all.filter((_,i)=>i<80)); // show more when searching
}
function switchEmojiCat(i){
  emojiCatIdx=i;
  document.getElementById('emoji-search').value='';
  buildIconGrid();
}
function buildColorGrid(){document.getElementById('color-grid').innerHTML=COLORS.map(c=>`<div class="color-opt ${c===selColor?'sel':''}" style="background:${c}" onclick="selectColor('${c}')"></div>`).join('');}
function selectIcon(ic){selIcon=ic;buildIconGrid();}
function selectColor(c){selColor=c;buildColorGrid();}

// ── 프로젝트 트리 헬퍼 ──────────────────────────────────────
function getRootProj(id){
  // 최상위 조상 프로젝트(아이콘/색상을 가진)를 찾음
  let p=projects.find(x=>x.id===id);
  while(p && p.parentId){
    const parent=projects.find(x=>x.id===p.parentId);
    if(!parent) break;
    p=parent;
  }
  return p;
}
function getProjDisplay(id){
  // 표시용 아이콘/색상: 자신이 가지고 있으면 그것, 없으면(페이즈) 루트에서 상속
  const p=projects.find(x=>x.id===id);
  if(!p) return {name:'없음',color:'#ccc',icon:'📁',id:0};
  if(p.icon && p.color) return p;
  const root=getRootProj(id);
  return { ...p, icon:root?.icon||'📁', color:root?.color||'#ccc' };
}
function projChildProjects(parentId){ return projects.filter(p=>p.parentId===parentId); }
function projAllDescendantProjects(id){
  let res=[];
  projChildProjects(id).forEach(c=>{ res.push(c); res=res.concat(projAllDescendantProjects(c.id)); });
  return res;
}
function getProjAncestors(id){
  const res=[]; let p=projects.find(x=>x.id===id);
  while(p && p.parentId){ const parent=projects.find(x=>x.id===p.parentId); if(!parent)break; res.unshift(parent); p=parent; }
  return res;
}

function onParentProjChange(){
  const parentVal=document.getElementById('pf-parent').value;
  const iconSection=document.getElementById('pf-icon-section');
  const phaseHint=document.getElementById('pf-phase-hint');
  if(parentVal){
    // 하위 프로젝트(페이즈) — 아이콘/색상 섹션 숨김
    iconSection.style.display='none';
    phaseHint.style.display='block';
  } else {
    iconSection.style.display='block';
    phaseHint.style.display='none';
  }
}

function buildParentProjOptions(excludeId=null){
  const sel=document.getElementById('pf-parent');
  // 최상위 프로젝트만 직접 상위로 선택 가능하게 하되, 무한 중첩 위해 전체 트리 표시
  const excludeIds=excludeId?[excludeId,...projAllDescendantProjects(excludeId).map(p=>p.id)]:[];
  function buildOptions(parentId, depth){
    let html='';
    projects.filter(p=>p.parentId===parentId).forEach(p=>{
      if(excludeIds.includes(p.id)) return;
      const indent='　'.repeat(depth);
      const icon=getProjDisplay(p.id).icon;
      html+=`<option value="${p.id}">${indent}${depth>0?'└ ':''}${esc(icon)} ${esc(p.name)}</option>`;
      html+=buildOptions(p.id, depth+1);
    });
    return html;
  }
  sel.innerHTML='<option value="">없음 (최상위 프로젝트)</option>'+buildOptions(null,0);
}

function openProjModal(id, presetParentId=null){
  editingProjId=id;
  buildParentProjOptions(id);
  if(id===null){
    document.getElementById('proj-modal-title').textContent=presetParentId?'새 페이즈/하위 프로젝트':'새 프로젝트';
    document.getElementById('pf-name').value='';
    document.getElementById('pf-desc').value='';
    document.getElementById('pf-parent').value=presetParentId||'';
    selIcon=ICONS[0];selColor=COLORS[0];
    document.getElementById('proj-btn-del').style.visibility='hidden';
  } else {
    const p=projects.find(p=>p.id===id);
    document.getElementById('proj-modal-title').textContent='프로젝트 수정';
    document.getElementById('pf-name').value=p.name;
    document.getElementById('pf-desc').value=p.desc||'';
    document.getElementById('pf-parent').value=p.parentId||'';
    const disp=getProjDisplay(id);
    selIcon=p.icon||disp.icon; selColor=p.color||disp.color;
    document.getElementById('proj-btn-del').style.visibility='visible';
  }
  buildIconGrid();buildColorGrid();
  onParentProjChange();
  document.getElementById('proj-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('pf-name').focus(),50);
}
function closeProjModal(){document.getElementById('proj-overlay').classList.remove('open');editingProjId=null;}
function closeProjOverlay(e){if(e.target===document.getElementById('proj-overlay'))closeProjModal();}
function saveProject(){
  const name=document.getElementById('pf-name').value.trim();if(!name)return;
  const parentVal=document.getElementById('pf-parent').value;
  const parentId=parentVal?parseInt(parentVal):null;
  const isPhase=!!parentId; // 하위 프로젝트는 아이콘/색상 없이 저장 (표시 시 상속)
  const data={
    name,
    icon:isPhase?null:selIcon,
    color:isPhase?null:selColor,
    desc:document.getElementById('pf-desc').value.trim(),
    parentId
  };
  pushUndo();
  if(editingProjId===null)projects.push({id:nextProjId++,...data});
  else{
    const idx=projects.findIndex(p=>p.id===editingProjId);
    if(idx>-1){
      // 자기 자신을 자신의 하위로 설정하는 것 방지
      if(parentId===editingProjId){ showToast('자기 자신을 상위로 설정할 수 없어요'); return; }
      projects[idx]={...projects[idx],...data};
    }
  }
  saveLocal();scheduleSave();closeProjModal();renderAll();
}
function deleteProject(){
  showConfirm('프로젝트와 모든 하위 프로젝트, 작업을 삭제할까요?').then(ok=>{
    if(!ok)return;
    pushUndo();
    const descProjIds=[editingProjId,...projAllDescendantProjects(editingProjId).map(p=>p.id)];
    tasks=tasks.filter(t=>!descProjIds.includes(t.projId));
    projects=projects.filter(p=>!descProjIds.includes(p.id));
    if(descProjIds.includes(selProjId))selProjId=null;
    saveLocal();scheduleSave();closeProjModal();renderAll();
  });
}

(async()=>{
  if(accessToken && !isTokenValid()){
    // 토큰 만료 — sessionStorage 초기화 후 재발급 시도
    accessToken=null;
    sessionStorage.removeItem('jido_token');
    sessionStorage.removeItem('jido_token_expiry');
    setSyncStatus('err','재로그인 필요');
    showToast('로그인이 만료됐어요. 다시 로그인해주세요.');
    return;
  }
  if(accessToken && isTokenValid()){
    document.getElementById('btn-signin').style.display='none';
    document.getElementById('btn-signout').style.display='';
    setSyncStatus('syncing','동기화 중...');
    await loadFromDrive();
    await fetchGcalEvents();
    renderAll();
  }
})();
