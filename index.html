*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;background:#f2f1ed;color:#1a1a18;min-height:100vh}
:root{
  --bg:#f2f1ed;--card:#fff;--border:#e4e2db;--border2:#ccc;
  --text:#1a1a18;--text2:#666;--text3:#aaa;
  --blue:#378ADD;--green:#1D9E75;--amber:#EF9F27;--red:#E24B4A;
  --r:10px;--r2:14px
}

.app{max-width:1040px;margin:0 auto;padding:18px 14px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:17px;font-weight:700;letter-spacing:-.03em}
.logo em{color:var(--blue);font-style:normal}
.logo-jido{font-family:'JidoFont',sans-serif;font-weight:normal;letter-spacing:.3em}
.sync-bar{display:flex;align-items:center;gap:7px}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text3);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px}
.dot{width:6px;height:6px;border-radius:50%;background:#ccc;flex-shrink:0}
.dot.ok{background:var(--green)}.dot.syncing{background:var(--amber);animation:blink 1s infinite}.dot.err{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.bsm{font-size:12px;padding:5px 11px;border-radius:7px;border:1px solid var(--border2);background:var(--card);cursor:pointer;font-family:inherit;color:var(--text2);transition:all .15s}
.bsm:hover{background:var(--bg)}
.bsm.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.bsm.pri:hover{background:#2a6fb0}

/* Nav */
.nav{display:flex;align-items:center;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.nav-tabs{display:flex;gap:2px;background:#e4e2db;padding:3px;border-radius:9px}
.ntab{padding:6px 13px;font-size:13px;font-family:inherit;border:none;background:none;cursor:pointer;border-radius:7px;color:var(--text2);font-weight:500;transition:all .15s;white-space:nowrap}
.ntab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.proj-filter{display:flex;gap:4px;flex-wrap:wrap}
.pchip{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit;color:var(--text2);transition:all .15s;display:flex;align-items:center;gap:5px}
.pchip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.btn-new{margin-left:auto;font-size:13px;padding:7px 13px;border:1.5px solid var(--border2);border-radius:var(--r);background:var(--card);cursor:pointer;color:var(--text2);font-family:inherit;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-new:hover{background:var(--bg)}

/* Views */
.view{display:none}.view.active{display:block}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--r);padding:11px 13px;border:1px solid var(--border);text-align:center}
.stat-n{font-size:20px;font-weight:700}.stat-l{font-size:11px;color:var(--text3);margin-top:1px;font-weight:500}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.board{grid-template-columns:repeat(2,1fr)}}
.col{background:#eae8e2;border-radius:12px;padding:11px}
.col-head{font-size:11px;font-weight:700;color:#999;margin-bottom:9px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.06em}
.col-cnt{background:var(--card);border-radius:10px;padding:1px 7px;font-size:11px;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:all .15s}
.card-done{opacity:.6}
.card:last-child{margin-bottom:0}
.card:hover{border-color:#a8c8e8;box-shadow:0 2px 8px rgba(55,138,221,.1)}
.card-proj{font-size:10px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.card-title{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:6px}
.card-meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:9px;font-weight:600}
.tag-design{background:#EEEDFE;color:#3C3489}.tag-dev{background:#E1F5EE;color:#085041}
.tag-review{background:#FAEEDA;color:#633806}.tag-etc{background:#f0ede8;color:#555}
.due{font-size:11px;color:var(--text3)}
.pdot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:4px}
.p-high{background:var(--red)}.p-mid{background:var(--amber)}.p-low{background:var(--green)}
.prog-bar-wrap{height:3px;background:#eee;border-radius:2px;margin-top:7px;overflow:hidden}
.prog-bar{height:100%;border-radius:2px;background:var(--green);transition:width .3s}

/* ── Tree List ── */
.tree-wrap{display:flex;flex-direction:column;gap:1px}
.tree-node{}
.tree-row{display:flex;align-items:center;gap:0;padding:7px 10px;background:var(--card);border-radius:var(--r);border:1px solid var(--border);cursor:pointer;transition:all .15s;position:relative}
.tree-row:hover{border-color:#a8c8e8}
.tree-indent{flex-shrink:0}
.tree-toggle{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:10px;color:var(--text3);flex-shrink:0;cursor:pointer;transition:transform .15s}
.tree-toggle.open{transform:rotate(90deg)}
.tree-toggle.leaf{cursor:default;color:transparent}
.chk{width:16px;height:16px;border:1.5px solid #ccc;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s;cursor:pointer;margin-right:8px}
.chk.done{background:var(--green);border-color:var(--green);color:#fff}
.tname{flex:1;font-size:13px;font-weight:500;line-height:1.3}
.tname.done{text-decoration:line-through;color:var(--text3)}
.tree-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tree-prog{font-size:11px;color:var(--text3)}
.tree-date{font-size:11px;color:var(--text3)}
.tree-proj-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tree-children{margin-left:0;margin-top:1px;display:flex;flex-direction:column;gap:1px}

/* Calendar */
.cal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.cal-m{font-size:15px;font-weight:600}
.cal-nav{display:flex;gap:5px}
.nbtn{width:28px;height:28px;border:1px solid var(--border2);background:var(--card);border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.nbtn:hover{background:var(--bg)}
.gl{display:none}
.dl{font-size:11px;font-weight:600;text-align:center;color:var(--text3);padding:6px 0;height:28px;display:flex;align-items:center;justify-content:center}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cg-full{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{height:96px;background:var(--card);border-radius:7px;padding:5px;border:1px solid var(--border);cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.day:hover{border-color:#a8c8e8}
.day.om{background:var(--bg);opacity:.5}
.day.today{border-color:var(--blue)}
.day.today .dn{background:var(--blue);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.dn{font-size:11px;font-weight:500;width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.day.om .dn{color:#bbb}
.ev{font-size:10px;padding:2px 4px;border-radius:3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}

/* Daily */
.daily-date{font-size:13px;color:var(--text2);margin-bottom:12px;font-weight:500}
.daily-layout{display:grid;grid-template-columns:1fr 290px;gap:14px}
@media(max-width:720px){.daily-layout{grid-template-columns:1fr}}
.sec-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.daily-sub-tabs{display:flex;gap:2px;background:#e4e2db;padding:3px;border-radius:8px;margin-bottom:12px;width:fit-content}
.dstab{padding:5px 13px;font-size:12px;font-family:inherit;border:none;background:none;cursor:pointer;border-radius:6px;color:var(--text2);font-weight:500;transition:all .15s}
.dstab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.09)}
/* task list */
.daily-tasks{display:flex;flex-direction:column;gap:5px}
.dtask{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--card);border-radius:var(--r);border:1px solid var(--border)}
.dtask-info{flex:1;min-width:0}
.dtask-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtask-proj{font-size:11px;color:var(--text3);margin-top:2px;display:flex;align-items:center;gap:4px}
.time-input{width:52px;font-size:13px;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;text-align:center}
.time-input:focus{outline:none;border-color:var(--blue)}
.time-lbl{font-size:11px;color:var(--text3)}
/* timeline */
.timeline-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;position:relative}
.tl-inner{position:relative}
.tl-row{display:flex;min-height:54px;border-bottom:1px solid var(--border);position:relative}
.tl-row:last-child{border-bottom:none}
.tl-row.is-now{background:#fef9f0}
.tl-hour{width:50px;flex-shrink:0;font-size:11px;color:var(--text3);font-weight:500;padding:8px 8px 0;text-align:right;border-right:1px solid var(--border)}
.tl-slot{flex:1;padding:4px 8px;position:relative}
.tl-event{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:7px;cursor:pointer;margin-bottom:3px;transition:filter .15s}
.tl-event:hover{filter:brightness(.95)}
.tl-evt-chk{width:13px;height:13px;border-radius:3px;border:1.5px solid rgba(0,0,0,.2);background:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;transition:all .15s}
.tl-evt-chk.done{background:rgba(0,0,0,.18);color:#fff}
.tl-evt-name{font-size:12px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-evt-dur{font-size:11px;opacity:.65;flex-shrink:0}
.tl-add{width:100%;text-align:left;font-size:12px;color:var(--text3);background:none;border:1.5px dashed transparent;cursor:pointer;padding:3px 4px;border-radius:5px;font-family:inherit;opacity:0;transition:all .15s}
.tl-slot:hover .tl-add{opacity:1;border-color:var(--border2)}
.tl-now-wrap{position:absolute;left:0;right:0;pointer-events:none;z-index:5}
.tl-now-line{position:absolute;left:50px;right:0;height:2px;background:var(--red)}
.tl-now-circle{position:absolute;left:44px;width:8px;height:8px;border-radius:50%;background:var(--red);top:-3px}
/* summary */
.time-summary{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.time-total{text-align:center;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:14px}
.time-total-n{font-size:28px;font-weight:700}
.time-total-l{font-size:12px;color:var(--text3);margin-top:3px}
.proj-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.proj-bar-name{font-size:12px;color:var(--text2);min-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-bar-wrap{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.proj-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.proj-bar-n{font-size:11px;font-weight:600;color:var(--text2);min-width:34px;text-align:right}

/* Daily/Weekly nav */
.daily-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.daily-date-label{font-size:15px;font-weight:600;color:var(--text);min-width:160px;text-align:center}
.dnav-btn{width:28px;height:28px;border:1px solid var(--border2);background:var(--card);border-radius:7px;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.dnav-btn:hover{background:var(--bg)}
.dnav-today{font-size:12px;padding:5px 10px;border:1px solid var(--border2);border-radius:7px;background:var(--card);cursor:pointer;color:var(--text2);font-family:inherit}
.dnav-today:hover{background:var(--bg)}

/* Daily split layout */
.daily-split{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
@media(max-width:700px){.daily-split{grid-template-columns:1fr}}
.daily-todo-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px;position:sticky;top:10px}
.daily-tl-panel{}

/* Todo input */
.todo-input-wrap{margin-bottom:10px}
.todo-input{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.todo-input:focus{border-color:var(--blue)}
.todo-list{display:flex;flex-direction:column;gap:3px;max-height:calc(100vh - 280px);overflow-y:auto}
.todo-item{display:block;border-radius:7px;border:1px solid transparent;cursor:grab;transition:border-color .15s;user-select:none}
.todo-item:hover{border-color:var(--border)}
.todo-item.dragging{opacity:.5;border-color:var(--blue)}
.todo-item.scheduled{border-left:2px solid var(--blue)}
.todo-item.scheduled .todo-time{background:var(--blue);color:#fff;border-radius:5px;padding:1px 6px}
.todo-chk{width:15px;height:15px;border:1.5px solid #ccc;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer}
.todo-chk.done{background:var(--green);border-color:var(--green);color:#fff}
.todo-name{flex:1;font-size:13px;line-height:1.3}
.todo-name.done{text-decoration:line-through;color:var(--text3)}
.todo-time{font-size:11px;color:var(--text3);flex-shrink:0}

/* Timeline */
.timeline-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;position:relative}
.tl-inner{position:relative;overflow:hidden}
.tl-row{display:flex;min-height:30px;border-bottom:1px solid var(--border);position:relative}
.tl-row.half{min-height:30px;border-bottom:1px dashed #f0ede8}
.tl-row:last-child{border-bottom:none}
.tl-row.is-now{background:#fffbf0}
.tl-hour{width:52px;flex-shrink:0;font-size:11px;color:var(--text3);font-weight:500;padding:6px 8px 0;text-align:right;border-right:1px solid var(--border)}
.tl-hour.half-lbl{font-size:10px;color:#ccc;padding-top:6px}
.tl-slot{flex:1;padding:2px 6px;position:relative;min-height:30px}
.tl-slot.drop-target{background:#E6F1FB44}
.tl-block{position:absolute;left:6px;right:6px;border-radius:6px;cursor:grab;overflow:visible;z-index:2;min-height:26px;display:flex;flex-direction:column;justify-content:center;padding:3px 7px;font-size:12px;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:box-shadow .15s,outline .1s;user-select:none}
.tl-block.selected{outline:2px solid var(--blue);outline-offset:1px;z-index:10}
.ctx-menu{position:fixed;background:var(--card);border:1px solid var(--border2);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.18);z-index:1000;min-width:140px;overflow:hidden;animation:ctx-in .1s ease}
@keyframes ctx-in{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ctx-item{padding:9px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text)}
.ctx-item:hover{background:var(--bg)}
.ctx-item.danger{color:var(--red)}
.ctx-item.danger:hover{background:#fff0f0}
.todo-item{position:relative;overflow:hidden;border-radius:7px}
.todo-swipe-left{position:absolute;right:0;top:0;bottom:0;width:0;background:var(--red);display:flex;align-items:center;justify-content:flex-end;padding-right:14px;color:#fff;font-size:12px;font-weight:600;border-radius:7px;white-space:nowrap;overflow:hidden;pointer-events:none}
.todo-swipe-right{position:absolute;left:0;top:0;bottom:0;width:0;display:flex;align-items:center;gap:0;border-radius:7px;overflow:hidden;pointer-events:none}
.todo-swipe-proj{height:100%;display:flex;align-items:center;justify-content:center;padding:0 10px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;cursor:pointer;pointer-events:auto;transition:filter .15s;flex-shrink:0}
.todo-swipe-proj:hover{filter:brightness(1.1)}
.todo-inner{display:flex;align-items:center;gap:8px;flex:1;background:var(--card);border-radius:7px;position:relative;z-index:2;padding:7px 8px;transition:transform .2s cubic-bezier(.4,0,.2,1)}
.todo-more{width:24px;height:24px;border:none;background:none;cursor:pointer;color:var(--text3);font-size:16px;display:flex;align-items:center;justify-content:center;border-radius:5px;flex-shrink:0;padding:0}
.todo-more:hover{background:var(--bg);color:var(--text)}
.tl-block:hover{box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tl-block.dragging-block{opacity:.7;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.tl-block-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:600}
.tl-block-time{font-size:10px;opacity:.75}
.tl-block-resize{position:absolute;bottom:0;left:0;right:0;height:14px;cursor:ns-resize;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.12));border-radius:0 0 6px 6px}
.tl-now-wrap{position:absolute;left:0;right:0;pointer-events:none;z-index:5}
.tl-now-line{position:absolute;left:52px;right:0;height:2px;background:var(--red)}
.tl-now-circle{position:absolute;left:46px;width:8px;height:8px;border-radius:50%;background:var(--red);top:-3px}
.tl-add{position:absolute;inset:0;cursor:pointer;z-index:1}

/* Weekly */
.weekly-split{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
@media(max-width:700px){.weekly-split{grid-template-columns:1fr}}
.weekly-todo-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px;position:sticky;top:10px;max-height:calc(100vh - 160px);overflow-y:auto}
.weekly-tl-panel{}
.weekly-tl-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:auto}
.weekly-grid{display:grid;min-width:600px}
.weekly-header{display:grid;border-bottom:1px solid var(--border)}
.weekly-day-hd{font-size:12px;font-weight:600;text-align:center;padding:8px 4px;border-right:1px solid var(--border);color:var(--text2)}
.weekly-day-hd:last-child{border-right:none}
.weekly-day-hd.today-col{color:var(--blue)}
.weekly-body{display:grid}
.weekly-row{display:grid;border-bottom:1px solid var(--border)}
.weekly-row.half-row{border-bottom:1px dashed #f0ede8}
.weekly-time-col{font-size:10px;color:var(--text3);padding:5px 6px 0;text-align:right;border-right:1px solid var(--border);min-width:44px}
.weekly-cell{border-right:1px solid var(--border);min-height:30px;position:relative;cursor:pointer}
.weekly-cell:last-child{border-right:none}
.weekly-cell:hover{background:#f7f6f2}
.weekly-block{position:absolute;left:2px;right:2px;border-radius:4px;padding:2px 4px;font-size:10px;font-weight:600;overflow:hidden;z-index:2;cursor:pointer;white-space:nowrap;text-overflow:ellipsis}

/* Report */
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
@media(max-width:680px){.report-grid{grid-template-columns:1fr 1fr}}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:15px}
.rcard-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rcard-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.rcard-name{font-size:13px;font-weight:600}
.rcard-h{font-size:24px;font-weight:700;margin-bottom:2px}
.rcard-sub{font-size:11px;color:var(--text3)}
.rcard-bar{height:4px;background:var(--bg);border-radius:2px;margin-top:10px;overflow:hidden}
.rcard-fill{height:100%;border-radius:2px}
.report-log{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:16px}
.log-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.log-row:last-child{border-bottom:none}
.log-date{font-size:12px;color:var(--text3);min-width:68px}
.log-proj{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;flex:1}
.log-task{font-size:12px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-h{font-size:13px;font-weight:600}

/* Projects tab */
.proj-list{display:flex;flex-direction:column;gap:8px}
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.proj-card:hover{border-color:#a8c8e8}
.proj-icon-big{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:14px;font-weight:600}
.proj-meta{font-size:12px;color:var(--text3);margin-top:2px}
.proj-stats{display:flex;gap:14px;flex-shrink:0}
.proj-stat{text-align:center}
.proj-stat-n{font-size:15px;font-weight:700}
.proj-stat-l{font-size:11px;color:var(--text3)}

/* ── Side Panel ── */
.side-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:150}
.side-overlay.open{display:block}
.side-panel{position:fixed;top:0;right:0;width:420px;max-width:96vw;height:100vh;background:var(--card);border-left:1px solid var(--border);z-index:160;overflow-y:auto;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.side-panel.open{transform:translateX(0)}
.sp-header{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 0}
.sp-close{width:28px;height:28px;border:1px solid var(--border);border-radius:7px;background:none;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto}
.sp-close:hover{background:var(--bg)}
.sp-body{padding:14px 18px 24px}
.sp-title-input{width:100%;font-size:16px;font-weight:600;border:none;background:none;color:var(--text);font-family:inherit;outline:none;padding:0;margin-bottom:10px}
.sp-title-input:focus{border-bottom:1.5px solid var(--blue)}
.sp-field{margin-bottom:12px}
.sp-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.sp-select,.sp-date{font-size:13px;padding:6px 9px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);font-family:inherit;outline:none}
.sp-select:focus,.sp-date:focus{border-color:var(--blue)}
.sp-memo{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;resize:vertical;min-height:60px}
.sp-memo:focus{border-color:var(--blue)}
.sp-row{display:flex;gap:10px}
.sp-row .sp-field{flex:1}
.sp-divider{height:1px;background:var(--border);margin:16px 0}
.sp-subtasks-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sp-prog{font-size:12px;color:var(--text3)}
.sp-prog-bar{height:4px;background:#eee;border-radius:2px;margin-bottom:12px;overflow:hidden}
.sp-prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.sp-subtask-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.sp-sub-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:all .15s}
.sp-sub-row:hover{border-color:#a8c8e8;background:#fff}
.sp-sub-name{flex:1;font-size:13px}
.sp-sub-name.done{text-decoration:line-through;color:var(--text3)}
.sp-sub-date{font-size:11px;color:var(--text3);flex-shrink:0}
.sp-sub-chevron{font-size:11px;color:var(--text3)}
.btn-add-sub{width:100%;font-size:13px;padding:8px;border:1.5px dashed var(--border2);border-radius:7px;background:none;cursor:pointer;color:var(--text3);font-family:inherit;transition:all .15s}
.btn-add-sub:hover{border-color:var(--blue);color:var(--blue);background:#f0f7ff}
.sp-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.btn-del-task{font-size:12px;padding:7px 12px;border:1px solid #ffd0d0;border-radius:7px;background:none;cursor:pointer;color:var(--red);font-family:inherit}
.btn-del-task:hover{background:#fff0f0}
.btn-save-task{font-size:13px;padding:8px 16px;border:none;border-radius:7px;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.btn-save-task:hover{background:#2a6fb0}
.sp-breadcrumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text3);margin-bottom:12px;flex-wrap:wrap}
.sp-bc-item{cursor:pointer;color:var(--blue)}
.sp-bc-item:hover{text-decoration:underline}
.sp-bc-sep{color:var(--text3)}

/* Modals */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r2);padding:22px;width:340px;max-width:94vw;box-shadow:0 10px 50px rgba(0,0,0,.18)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:16px}
.field{margin-bottom:11px}
.field label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;font-size:13px;padding:8px 10px;border:1px solid var(--border2);border-radius:7px;background:#fafaf8;color:var(--text);font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field textarea{resize:vertical;min-height:55px}
.emoji-picker-wrap{position:relative;display:inline-block}
.emoji-preview-btn{font-size:28px;width:52px;height:52px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.emoji-preview-btn:hover{border-color:var(--blue);background:#E6F1FB}
.emoji-picker-popup{position:fixed;background:var(--card);border:1px solid var(--border2);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:2000;width:300px;padding:12px;display:none}
.emoji-picker-popup.open{display:block}
.emoji-search{width:100%;font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:7px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;margin-bottom:8px}
.emoji-search:focus{border-color:var(--blue)}
.emoji-cats{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.emoji-cat-btn{font-size:14px;padding:4px 7px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;transition:all .15s}
.emoji-cat-btn.active{background:var(--blue);border-color:var(--blue)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:200px;overflow-y:auto}
.emoji-opt{font-size:20px;width:32px;height:32px;border:none;background:none;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:background .1s}
.emoji-opt:hover{background:var(--bg)}
.emoji-opt.sel{background:var(--blue)22;outline:2px solid var(--blue);border-radius:6px}
.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:4px}
.color-opt{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-opt.sel{border-color:var(--text);transform:scale(1.15)}
.modal-btns{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.btn-del{font-size:12px;padding:7px 12px;border:1px solid #ffd0d0;border-radius:7px;background:none;cursor:pointer;color:var(--red);font-family:inherit}
.btn-del:hover{background:#fff0f0}
.btn-r{display:flex;gap:7px}
.btn-cancel{font-size:13px;padding:7px 13px;border:1px solid var(--border2);border-radius:7px;background:none;cursor:pointer;color:var(--text2);font-family:inherit}
.btn-cancel:hover{background:var(--bg)}
.btn-save{font-size:13px;padding:7px 15px;border:none;border-radius:7px;background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.btn-save:hover{background:#2a6fb0}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;font-size:13px;padding:9px 17px;border-radius:9px;z-index:400;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.confirm-box{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 18px;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,.18);display:flex;align-items:center;gap:12px;white-space:nowrap}
.confirm-box.hide{display:none}
.confirm-msg{font-size:13px;color:var(--text)}
.confirm-yes{font-size:12px;padding:6px 13px;border:none;border-radius:7px;background:var(--red);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.confirm-no{font-size:12px;padding:6px 13px;border:1px solid var(--border2);border-radius:7px;background:none;cursor:pointer;font-family:inherit;color:var(--text2)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo"><span class="logo-jido">jido.<em style="color:var(--blue);font-style:normal">pm</em></span></div>
    <div class="sync-bar">
      <div class="sync-pill"><span class="dot" id="sync-dot"></span><span id="sync-text">로그인 필요</span></div>
      <button class="bsm pri" id="btn-signin" onclick="signIn()">Google 로그인</button>
      <button class="bsm" id="btn-signout" onclick="signOut()" style="display:none">로그아웃</button>
    </div>
  </div>
  <div class="nav">
    <div class="nav-tabs">
      <button class="ntab active" onclick="switchTab('board')">보드</button>
      <button class="ntab" onclick="switchTab('list')">목록</button>
      <button class="ntab" onclick="switchTab('cal')">캘린더</button>
      <button class="ntab" onclick="switchTab('daily')">데일리</button>
      <button class="ntab" onclick="switchTab('weekly')">위클리</button>
      <button class="ntab" onclick="switchTab('report')">리포트</button>
      <button class="ntab" onclick="switchTab('projects')">프로젝트</button>
    </div>
    <div class="proj-filter" id="proj-filter"></div>
    <button class="btn-new" onclick="openNewTask()">+ 새 작업</button>
  </div>

  <div id="view-board" class="view active">
    <div class="stats" id="stats"></div>
    <div class="board" id="board"></div>
  </div>
  <div id="view-list" class="view">
    <div class="tree-wrap" id="tree"></div>
  </div>
  <div id="view-cal" class="view">
    <div class="cal-hd">
      <span class="cal-m" id="cal-month"></span>
      <div class="cal-nav">
        <button class="nbtn" onclick="changeMonth(-1)">&#8249;</button>
        <button class="nbtn" onclick="changeMonth(1)">&#8250;</button>
      </div>
    </div>
    <div class="cg-full" id="cal-grid"></div>
  </div>
  <div id="view-daily" class="view">
    <div class="daily-nav">
      <button class="dnav-btn" onclick="changeDailyDate(-1)">&#8249;</button>
      <span class="daily-date-label" id="daily-date-label"></span>
      <button class="dnav-btn" onclick="changeDailyDate(1)">&#8250;</button>
      <button class="dnav-today" onclick="goToday()">오늘</button>
    </div>
    <div class="daily-split">
      <!-- Left: Todo list -->
      <div class="daily-todo-panel">
        <div class="sec-title">작업 목록</div>
        <div class="todo-input-wrap">
          <input class="todo-input" id="todo-input" placeholder="새 작업 입력 후 엔터..." onkeydown="onTodoEnter(event)">
        </div>
        <div class="todo-list" id="daily-todo-list"></div>
      </div>
      <!-- Right: Timeline -->
      <div class="daily-tl-panel">
        <div class="sec-title">시간표</div>
        <div class="timeline-wrap" id="daily-tl-wrap">
          <div class="tl-inner" id="tl-inner"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="view-weekly" class="view">
    <div class="daily-nav">
      <button class="dnav-btn" onclick="changeWeek(-1)">&#8249;</button>
      <span class="daily-date-label" id="weekly-label"></span>
      <button class="dnav-btn" onclick="changeWeek(1)">&#8250;</button>
      <button class="dnav-today" onclick="goWeekToday()">이번 주</button>
    </div>
    <div class="weekly-split">
      <div class="weekly-todo-panel">
        <div class="sec-title" style="margin-bottom:10px">이번 주 작업</div>
        <div class="todo-input-wrap" style="margin-bottom:8px">
          <input class="todo-input" id="weekly-todo-input" placeholder="새 작업 후 엔터..." onkeydown="onWeeklyTodoEnter(event)">
        </div>
        <div class="todo-list" id="weekly-todo-list"></div>
      </div>
      <div class="weekly-tl-panel">
        <div class="weekly-tl-wrap" id="weekly-tl-wrap"></div>
      </div>
    </div>
  </div>

  <div id="view-report" class="view">
    <div class="report-grid" id="report-grid"></div>
    <div class="report-log"><div class="sec-title" style="margin-bottom:12px">전체 시간 기록</div><div id="report-log"></div></div>
  </div>
  <div id="view-projects" class="view">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="sec-title" style="margin:0">프로젝트</div>
      <button class="bsm pri" onclick="openProjModal(null)">+ 새 프로젝트</button>
    </div>
    <div class="proj-list" id="proj-list"></div>
  </div>
</div>

<!-- Side Panel -->
<div class="side-overlay" id="sp-overlay" onclick="closeSidePanel()"></div>
<div class="side-panel" id="side-panel">
  <div class="sp-header">
    <div id="sp-breadcrumb" class="sp-breadcrumb"></div>
    <button class="sp-close" onclick="closeSidePanel()">✕</button>
  </div>
  <div class="sp-body">
    <input class="sp-title-input" id="sp-title" placeholder="작업 이름..." onblur="autoSavePanel()">
    <div class="sp-row">
      <div class="sp-field"><div class="sp-label">프로젝트</div><select class="sp-select" id="sp-proj" onchange="autoSavePanel()"></select></div>
      <div class="sp-field"><div class="sp-label">상태</div>
        <select class="sp-select" id="sp-status" onchange="autoSavePanel()">
          <option value="todo">할 일</option><option value="doing">진행 중</option><option value="review">검토</option><option value="done">완료</option>
        </select>
      </div>
    </div>
    <div class="sp-row">
      <div class="sp-field"><div class="sp-label">태그</div>
        <select class="sp-select" id="sp-tag" onchange="autoSavePanel()">
          <option value="design">디자인</option><option value="dev">개발</option><option value="review">검토</option><option value="etc">기타</option>
        </select>
      </div>
      <div class="sp-field"><div class="sp-label">우선순위</div>
        <select class="sp-select" id="sp-priority" onchange="autoSavePanel()">
          <option value="high">높음</option><option value="mid">보통</option><option value="low">낮음</option>
        </select>
      </div>
    </div>
    <div class="sp-row">
      <div class="sp-field"><div class="sp-label">마감일</div><input class="sp-date" id="sp-due" type="date" onchange="autoSavePanel()"></div>
      <div class="sp-field"><div class="sp-label">계획 시간(분)</div><input class="sp-date" id="sp-time" type="number" min="0" style="width:80px" onchange="autoSavePanel()"></div>
    </div>
    <div class="sp-row">
      <div class="sp-field"><div class="sp-label">시작 시간</div><select class="sp-select" id="sp-starthour" onchange="autoSavePanel()"><option value="">미정</option><option value="0">오전 12시</option><option value="1">오전 1시</option><option value="2">오전 2시</option><option value="3">오전 3시</option><option value="4">오전 4시</option><option value="5">오전 5시</option><option value="6">오전 6시</option><option value="7">오전 7시</option><option value="8">오전 8시</option><option value="9">오전 9시</option><option value="10">오전 10시</option><option value="11">오전 11시</option><option value="12">오후 12시</option><option value="13">오후 1시</option><option value="14">오후 2시</option><option value="15">오후 3시</option><option value="16">오후 4시</option><option value="17">오후 5시</option><option value="18">오후 6시</option><option value="19">오후 7시</option><option value="20">오후 8시</option><option value="21">오후 9시</option><option value="22">오후 10시</option><option value="23">오후 11시</option></select></div>
    </div>
    <div class="sp-field"><div class="sp-label">메모</div><textarea class="sp-memo" id="sp-memo" placeholder="메모..." onblur="autoSavePanel()"></textarea></div>
    <div class="sp-divider"></div>
    <div class="sp-subtasks-header">
      <div class="sec-title" style="margin:0">하위 작업</div>
      <div class="sp-prog" id="sp-prog-text"></div>
    </div>
    <div class="sp-prog-bar"><div class="sp-prog-fill" id="sp-prog-fill" style="width:0%"></div></div>
    <div class="sp-subtask-list" id="sp-subtask-list"></div>
    <button class="btn-add-sub" onclick="addSubTask()">+ 하위 작업 추가</button>
    <div class="sp-actions">
      <button class="btn-del-task" id="sp-btn-del" onclick="deleteTaskFromPanel()" style="visibility:hidden">삭제</button>
      <button class="btn-save-task" onclick="savePanel()">저장</button>
    </div>
  </div>
</div>

<!-- Project Modal -->
<div class="overlay" id="proj-overlay" onclick="closeProjOverlay(event)">
  <div class="modal">
    <h3 id="proj-modal-title">새 프로젝트</h3>
    <div class="field"><label>프로젝트 이름</label><input id="pf-name" placeholder="이름..."></div>

          <div style="font-size:12px;color:var(--text2);margin-bottom:4px">아래에서 선택하세요</div>

      </div>
      <div class="emoji-cats" id="emoji-cats"></div>
      <div class="emoji-grid" id="emoji-grid"></div>

    <div class="field"><label>색상</label><div class="color-grid" id="color-grid"></div></div>
    <div class="field"><label>설명</label><textarea id="pf-desc" placeholder="설명 (선택)"></textarea></div>

  </div>
</div>

<div class="toast" id="toast"></div>
<div class="confirm-box hide" id="confirm-box">
  <span class="confirm-msg" id="confirm-msg"></span>
  <button class="confirm-no" onclick="confirmResolve(false)">취소</button>
  <button class="confirm-yes" onclick="confirmResolve(true)">삭제</button>
</div>

let driveFileId=null,syncTimeout=null;
let gcalEvents=[];

// ── Google Drive ──────────────────────────────────────────
(function(){
  var s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';
  s.onload=function(){
    // Auto sign-in: silently request token using stored hint
    const hint=localStorage.getItem('jido_login_hint');
    if(!hint) return;
    // Use One Tap credential to get access token silently
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      auto_select: true,
      callback: async(credRes)=>{
        if(!credRes.credential) return;
        // Exchange id_token for access token via token client
        _tokenClient=google.accounts.oauth2.initTokenClient({
          client_id:CLIENT_ID, scope:SCOPES,
          login_hint:hint,
          prompt:'',
          callback:async(res)=>{
            if(res.error||!res.access_token) return;
            await _onSignedIn(res.access_token);
          }
        });
        _tokenClient.requestAccessToken();
      }
    });
    // Also try silent token request directly
    _tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID, scope:SCOPES,
      login_hint:hint,
      prompt:'',
      callback:async(res)=>{
        if(res.error||!res.access_token) return;
        await _onSignedIn(res.access_token);
      }
    });
    _tokenClient.requestAccessToken();
  };
  document.head.appendChild(s);
})();
let _tokenClient=null;
async function _onSignedIn(token){
  accessToken=token;
  sessionStorage.setItem('jido_token',token);
  document.getElementById('btn-signin').style.display='none';
  document.getElementById('btn-signout').style.display='';
  setSyncStatus('syncing','동기화 중...');
  await loadFromDrive();
  await fetchGcalEvents();
  // Auto-refresh token every 45 min (token lasts 60 min)
  setTimeout(()=>_refreshToken(),45*60*1000);
}
function _refreshToken(){
  const hint=localStorage.getItem('jido_login_hint');
  if(!hint||!accessToken) return;
  const client=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:SCOPES,
    login_hint:hint, prompt:'',
    callback:(res)=>{
      if(res.access_token){ accessToken=res.access_token; setSyncStatus('ok','동기화 완료'); setTimeout(()=>_refreshToken(),45*60*1000); }
    }
  });
  client.requestAccessToken();
}
function signIn(){
  if(typeof google==='undefined'){showToast('잠시 후 다시 시도해주세요');return;}
  google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async(res)=>{
    if(res.error){showToast('로그인 실패');return;}
    // Save email hint for auto-restore
    try{
      const info=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+res.access_token}})).json();
      if(info.email) localStorage.setItem('jido_login_hint',info.email);
    }catch(e){}
    await _onSignedIn(res.access_token);
  }}).requestAccessToken();
}
function signOut(){accessToken=null;driveFileId=null;sessionStorage.removeItem('jido_token');localStorage.removeItem('jido_login_hint');document.getElementById('btn-signin').style.display='';document.getElementById('btn-signout').style.display='none';setSyncStatus('','로그인 필요');showToast('로그아웃');}
async function fetchGcalEvents(){
  if(!accessToken) return;
  try{
    // 이번달 시작~끝
    const now=new Date();
    const y=now.getFullYear(), m=now.getMonth();
    const tMin=encodeURIComponent(new Date(y,m,1).toISOString());
    const tMax=encodeURIComponent(new Date(y,m+1,0,23,59,59).toISOString());

    // 1. 모든 캘린더 목록 가져오기
    const calListRes=await fetch(
      'https://www.googleapis.com/calendar/v3/users/me/calendarList?showHidden=true',
      {headers:{Authorization:'Bearer '+accessToken}}
    );
    const calList=await calListRes.json();
    const calendars=(calList.items||[]);

    // 2. 각 캘린더에서 이번달 이벤트 병렬 fetch
    const results=await Promise.allSettled(
      calendars.map(cal=>
        fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?timeMin=${tMin}&timeMax=${tMax}&singleEvents=true&orderBy=startTime&maxResults=250`,
          {headers:{Authorization:'Bearer '+accessToken}}
        ).then(r=>r.json()).then(d=>(d.items||[]).map(e=>({
          ...e,
          _calId:cal.id,
          _calName:cal.summary,
          _calColor:cal.backgroundColor||'#4285f4'
        })))
      )
    );

    // 3. 합치기
    gcalEvents=results
      .filter(r=>r.status==='fulfilled')
      .flatMap(r=>r.value)
      .filter(e=>e.start&&(e.start.dateTime||e.start.date));

    showToast('Google 캘린더 불러옴 ('+gcalEvents.length+'개 / '+calendars.length+'개 캘린더)');
    renderAll();
  }catch(e){console.warn('GCal fetch failed',e);}
}
function setSyncStatus(t,txt){document.getElementById('sync-dot').className='dot'+(t?' '+t:'');document.getElementById('sync-text').textContent=txt;}
async function loadFromDrive(){
  try{
    const r=await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${FILE_NAME}'&fields=files(id)`,{headers:{Authorization:'Bearer '+accessToken}});
    const d=await r.json();
    if(d.files&&d.files.length>0){
      driveFileId=d.files[0].id;
      const data=await(await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,{headers:{Authorization:'Bearer '+accessToken}})).json();
      projects=data.projects||projects;tasks=data.tasks||tasks;nextTaskId=data.nextTaskId||nextTaskId;nextProjId=data.nextProjId||nextProjId;
      setSyncStatus('ok','동기화 완료');showToast('불러오기 완료');
    } else {await saveToDrive();setSyncStatus('ok','준비 완료');}
  }catch(e){setSyncStatus('err','오류');showToast('불러오기 실패');}
  renderAll();
}
async function saveToDrive(){
  if(!accessToken)return;
  setSyncStatus('syncing','저장 중...');
  try{
    const content=JSON.stringify({projects,tasks,nextTaskId,nextProjId});
    if(driveFileId){
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:content});
    } else {
      const form=new FormData();
      form.append('metadata',new Blob([JSON.stringify({name:FILE_NAME,parents:['appDataFolder']})],{type:'application/json'}));
      form.append('file',new Blob([content],{type:'application/json'}));
      driveFileId=(await(await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{Authorization:'Bearer '+accessToken},body:form})).json()).id;
    }
    setSyncStatus('ok','저장 완료');
  }catch(e){setSyncStatus('err','저장 실패');}
}
function scheduleSave(){clearTimeout(syncTimeout);syncTimeout=setTimeout(saveToDrive,1500);}
function saveLocal(){try{localStorage.setItem('jido_v3',JSON.stringify({projects,tasks,nextTaskId,nextProjId}));}catch(e){}}
function loadLocal(){try{const d=localStorage.getItem('jido_v3');if(d){const p=JSON.parse(d);projects=p.projects||projects;tasks=p.tasks||tasks;nextTaskId=p.nextTaskId||nextTaskId;nextProjId=p.nextProjId||nextProjId;}}catch(e){}}


// ── Google Calendar Sync (auto-create/update events) ─────────────────
async function syncTaskToGcal(task){
  if(!accessToken) return;
  if(!task || !task.due) return;
  try{
    let event;
    if(task.startHour!==undefined && task.startHour!==null && task.startHour!==''){
      const startDate=new Date(task.due + 'T' + String(task.startHour).padStart(2,'0') + ':00:00+09:00');
      const endDate=new Date(startDate.getTime() + ((task.plannedTime || 60)*60000));
      event={summary:task.name,description:task.memo||'',start:{dateTime:startDate.toISOString(),timeZone:'Asia/Seoul'},end:{dateTime:endDate.toISOString(),timeZone:'Asia/Seoul'}};
    } else {
      // all-day event
      event={summary:task.name,description:task.memo||'',start:{date:task.due},end:{date:task.due}};
    }
    if(task.gcalEventId){
      await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${task.gcalEventId}`,{method:'PATCH',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify(event)});
    } else {
      const resp=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify(event)});
      const data=await resp.json();
      if(data && data.id) task.gcalEventId=data.id;
    }
  } catch(e){ console.warn('GCal sync failed',e); }
}

// ── Helpers ───────────────────────────────────────────────
function getProj(id){return projects.find(p=>p.id===id)||{name:'없음',color:'#ccc',icon:'📁',id:0};}
function rootTasks(){return tasks.filter(t=>!t.parentId&&(!selProjId||t.projId===selProjId));}
function childTasks(pid){return tasks.filter(t=>t.parentId===pid);}
function allDescendants(id){let res=[];const ch=childTasks(id);ch.forEach(c=>{res.push(c);res=res.concat(allDescendants(c.id));});return res;}
function calcProgress(id){const ch=childTasks(id);if(!ch.length)return null;const done=ch.filter(c=>c.status==='done').length;return{done,total:ch.length,pct:Math.round(done/ch.length*100)};}
function fmtDate(s){if(!s)return'';const[,m,d]=s.split('-');return m+'/'+d;}
function fmtMins(m){if(!m&&m!==0)return'-';if(!m)return'0m';const h=Math.floor(m/60),mm=m%60;return h>0?(mm>0?h+'h '+mm+'m':h+'h'):mm+'m';}
function todayStr(){return new Date().toISOString().split('T')[0];}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function getAncestors(id){const res=[];let t=tasks.find(t=>t.id===id);while(t&&t.parentId){t=tasks.find(x=>x.id===t.parentId);if(t)res.unshift(t);}return res;}

// ── Tab ───────────────────────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.ntab').forEach((el,i)=>el.classList.toggle('active',['board','list','cal','daily','weekly','report','projects'][i]===tab));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  document.getElementById('proj-filter').style.display=['board','list','cal','daily','weekly'].includes(tab)?'flex':'none';
  renderAll();
}

function renderAll(){renderProjFilter();renderStats();renderBoard();renderTree();renderCal();renderDaily();renderWeekly();renderReport();renderProjList();}

// ── Stats ─────────────────────────────────────────────────
function renderStats(){
  const ft=tasks.filter(t=>!selProjId||t.projId===selProjId);
  const c={todo:0,doing:0,review:0,done:0};ft.forEach(t=>c[t.status]=(c[t.status]||0)+1);
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-n">${ft.length}</div><div class="stat-l">전체</div></div>

    <div class="stat"><div class="stat-n" style="color:var(--amber)">${c.review}</div><div class="stat-l">검토</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--green)">${c.done}</div><div class="stat-l">완료</div></div>`;
}

// ── Board ─────────────────────────────────────────────────
function renderBoard(){
  const ft=tasks.filter(t=>!t.parentId&&(!selProjId||t.projId===selProjId));
  document.getElementById('board').innerHTML=Object.entries(COLS).map(([k,v])=>{
    const cards=ft.filter(t=>t.status===k);
    return `<div class="col"><div class="col-head">${v}<span class="col-cnt">${cards.length}</span></div>`+
      cards.map(c=>{
        const p=getProj(c.projId);const prog=calcProgress(c.id);
        return `<div class="card${c.status==='done'?' card-done':''}" onclick="openPanel(${c.id})">
          <div class="card-proj" style="color:${p.color}"><span style="width:5px;height:5px;border-radius:50%;background:${p.color};display:inline-block"></span> ${p.name}</div>
          <div class="card-title" style="display:flex;align-items:flex-start;gap:7px">
            <div class="chk ${c.status==='done'?'done':''}" onclick="quickToggle(${c.id},event)" style="margin-top:1px;flex-shrink:0">✓</div>
            <span style="${c.status==='done'?'text-decoration:line-through;color:var(--text3)':''}">${c.name}</span>
          </div>
          <div class="card-meta" style="margin-top:6px"><span class="tag ${TAGS[c.tag]?.cls||'tag-etc'}">${TAGS[c.tag]?.label||c.tag}</span><span class="due">${fmtDate(c.due)}</span></div>
          ${prog?`<div style="font-size:11px;color:var(--text3);margin-top:5px">${prog.done}/${prog.total} 완료</div><div class="prog-bar-wrap"><div class="prog-bar" style="width:${prog.pct}%"></div></div>`:''}
        </div>`;}).join('')+'</div>';}).join('');
}

// ── Tree List ─────────────────────────────────────────────
function renderTree(){
  document.getElementById('tree').innerHTML='';
  rootTasks().forEach(t=>renderNode(t,0,document.getElementById('tree')));
}
function renderNode(task,depth,container){
  const children=childTasks(task.id);
  const hasChildren=children.length>0;
  const isCollapsed=collapsedIds.has(task.id);
  const prog=calcProgress(task.id);
  const p=getProj(task.projId);

  const nodeDiv=document.createElement('div');nodeDiv.className='tree-node';
  const row=document.createElement('div');row.className='tree-row';

  // indent
  const indent=document.createElement('div');
  indent.className='tree-indent';indent.style.width=(depth*20)+'px';row.appendChild(indent);

  // toggle
  const tog=document.createElement('div');
  tog.className='tree-toggle'+(hasChildren?' '+(isCollapsed?'':'open'):' leaf');
  tog.textContent=hasChildren?'▶':'';
  if(hasChildren)tog.onclick=(e)=>{e.stopPropagation();collapsedIds.has(task.id)?collapsedIds.delete(task.id):collapsedIds.add(task.id);renderTree();};
  row.appendChild(tog);

  // checkbox
  const chk=document.createElement('div');
  chk.className='chk'+(task.status==='done'?' done':'');
  chk.textContent='✓';
  chk.onclick=(e)=>{e.stopPropagation();task.status=task.status==='done'?'todo':'done';saveLocal();scheduleSave();renderAll();};
  row.appendChild(chk);

  // project dot
  const pd=document.createElement('span');
  pd.className='tree-proj-dot';pd.style.background=p.color;pd.style.marginRight='6px';row.appendChild(pd);

  // name
  const nm=document.createElement('span');
  nm.className='tname'+(task.status==='done'?' done':'');nm.textContent=task.name;row.appendChild(nm);

  // meta
  const meta=document.createElement('div');meta.className='tree-meta';
  if(prog){const ps=document.createElement('span');ps.className='tree-prog';ps.textContent=prog.done+'/'+prog.total;meta.appendChild(ps);}
  if(task.due){const dd=document.createElement('span');dd.className='tree-date';dd.textContent=fmtDate(task.due);meta.appendChild(dd);}
  row.appendChild(meta);

  // progress bar under row
  row.onclick=()=>openPanel(task.id);
  nodeDiv.appendChild(row);

  if(prog){
    const pb=document.createElement('div');
    pb.style.cssText=`margin-left:${(depth*20)+60}px;height:2px;background:#eee;border-radius:1px;margin-top:-2px;margin-bottom:2px;overflow:hidden`;
    const pf=document.createElement('div');
    pf.style.cssText=`width:${prog.pct}%;height:100%;background:var(--green);border-radius:1px`;
    pb.appendChild(pf);nodeDiv.appendChild(pb);
  }

  // children
  if(hasChildren&&!isCollapsed){
    const ch=document.createElement('div');ch.className='tree-children';
    children.forEach(c=>renderNode(c,depth+1,ch));
    nodeDiv.appendChild(ch);
  }
  container.appendChild(nodeDiv);
}

// ── Calendar ──────────────────────────────────────────────
function renderCal(){
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cal-month').textContent=calYear+'년 '+months[calMonth];
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  const ft=tasks.filter(t=>!selProjId||t.projId===selProjId);
  // Day labels as first row in same grid
  const dayLabels=['일','월','화','수','목','금','토'].map(d=>`<div class="dl">${d}</div>`).join('');
  let html=dayLabels;
  for(let i=0;i<first;i++)html+=`<div class="day om"><div class="dn">${prevDays-first+1+i}</div></div>`;
  for(let d=1;d<=days;d++){
    const isToday=calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate();
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt=ft.filter(t=>t.due===ds);
    // Google Calendar events for this day
    const ge=gcalEvents.filter(e=>{
      const eDate=e.start.dateTime?e.start.dateTime.split('T')[0]:e.start.date;
      return eDate===ds;
    });
    const total=dt.length+ge.length;
    // Mix and limit to 2 visible events, rest as +N
    const MAX_EV=2;
    const allEvs=[
      ...dt.map(t=>{const p=getProj(t.projId);const done=t.status==="done";return{html:`<div class="ev" style="background:${p.color}${done?"11":"22"};color:${p.color};flex-shrink:0;border-left:2px solid ${p.color};${done?"opacity:.4;text-decoration:line-through":""}" onclick="openPanel(${t.id})">${t.name}</div>`}}),
      ...ge.map(e=>({html:`<div class="ev" style="background:${e._calColor||'#4285f4'}33;color:${e._calColor||'#4285f4'};flex-shrink:0;border-left:2px solid ${e._calColor||'#4285f4'}">${e.summary||'(일정)'}</div>`}))
    ];
    const visEvs=allEvs.slice(0,MAX_EV).map(e=>e.html).join('');
    const more=allEvs.length>MAX_EV?`<div style="font-size:10px;color:var(--text3);margin-top:auto">+${allEvs.length-MAX_EV}개</div>`:'';
    html+=`<div class="day ${isToday?'today':''}"><div class="dn" style="flex-shrink:0">${d}</div>${visEvs}${more}</div>`;
  }
  const remain=(first+days)%7===0?0:7-(first+days)%7;
  for(let d=1;d<=remain;d++)html+=`<div class="day om"><div class="dn">${d}</div></div>`;
  document.getElementById('cal-grid').innerHTML=html;
}
function changeMonth(d){
  calMonth+=d;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  // re-fetch gcal for new month if logged in
  if(accessToken) fetchGcalEvents(); else renderCal();
}

// ── Daily & Weekly ──────────────────────────────────────────
let dailyDate = new Date(); // currently viewed date
let weekOffset = 0; // week offset from current week
const SLOT_H = 30; // px per 30-min slot
const SLOTS_PER_HOUR = 2;

function dailyDateStr(d){ return d.toISOString().split('T')[0]; }
function changeDailyDate(d){ dailyDate=new Date(dailyDate); dailyDate.setDate(dailyDate.getDate()+d); renderDaily(); }
function goToday(){ dailyDate=new Date(); renderDaily(); }
function changeWeek(d){ weekOffset+=d; renderWeekly(); }
function goWeekToday(){ weekOffset=0; renderWeekly(); }

function fmtHM(h,m){ return String(h).padStart(2,'0')+':'+String(m||0).padStart(2,'0'); }
function slotToMins(slot){ return slot*30; } // slot index → minutes from midnight
function minsToSlot(mins){ return Math.floor(mins/30); }
function minsToTop(mins){ return (mins/30)*SLOT_H; }
function topToMins(top){ return Math.round(top/SLOT_H)*30; }

// ── Render Daily ──────────────────────────────────────────
function renderDaily(){
  const ds=dailyDateStr(dailyDate);
  const d=dailyDate;
  const days=['일','월','화','수','목','금','토'];
  const isToday=ds===todayStr();
  document.getElementById('daily-date-label').textContent=
    d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+days[d.getDay()]+')'+(isToday?' — 오늘':'');

  // Todo list: tasks due today or in-progress
  const dayTasks=tasks.filter(t=>t.due===ds||(t.status==='doing'&&!t.due));
  renderDailyTodo(dayTasks);
  renderDailyTimeline(ds, dayTasks);
}

function renderDailyTodo(dayTasks){
  const list=document.getElementById('daily-todo-list');
  if(dayTasks.length===0){list.innerHTML='<div style="font-size:12px;color:var(--text3);padding:12px 0;text-align:center">일정 없음</div>';return;}
  list.innerHTML=dayTasks.map(t=>{
    const scheduled=t.startHour!==undefined&&t.startHour!==null&&t.startHour!=='';
    const timeStr=scheduled?fmtHM(t.startHour,t.startMin||0):'';
    const projBtns=projects.map(p=>`<div class="todo-swipe-proj" style="background:${p.color}" onclick="assignProj(event,${t.id},${p.id})">${p.icon}</div>`).join('');
    return`<div class="todo-item${scheduled?' scheduled':''}" data-id="${t.id}" draggable="true"
      ondragstart="onTodoDragStart(event,${t.id})">
      <div class="todo-swipe-right" id="swipe-right-${t.id}">${projBtns}</div>
      <div class="todo-swipe-left" id="swipe-left-${t.id}">🗑 삭제</div>
      <div class="todo-inner" id="todo-inner-${t.id}">
        <div class="todo-chk ${t.status==='done'?'done':''}" onclick="quickToggle(${t.id},event)">✓</div>
        <span class="todo-chk-dot" style="width:7px;height:7px;border-radius:50%;background:${getProj(t.projId).color};flex-shrink:0;display:inline-block"></span>
        <span class="todo-name ${t.status==='done'?'done':''}" onclick="openPanel(${t.id})" style="flex:1">${t.name}</span>
        ${timeStr?`<span class="todo-time">${timeStr}</span>`:''}
        <button class="todo-more" onclick="showCtxMenu(event,${t.id},'task')">···</button>
      </div>
    </div>`;
  }).join('');
  // Attach touch swipe handlers
  list.querySelectorAll('.todo-item').forEach(el=>attachSwipe(el));
}

function attachSwipe(el){
  let startX=0,startY=0,curX=0,swiping=false,dir=null;
  const id=parseInt(el.dataset.id);
  const inner=el.querySelector('.todo-inner');
  const bgLeft=el.querySelector('.todo-swipe-left');   // delete (right→left)
  const bgRight=el.querySelector('.todo-swipe-right'); // project (left→right)
  const MAX=Math.min(projects.length*44+16, 200);      // right panel width
  const DEL_W=72;                                       // left delete panel width

  function reset(){
    inner.style.transform='';
    if(bgLeft) bgLeft.style.width='0';
    if(bgRight) bgRight.style.width='0';
    dir=null;
  }

  el.addEventListener('touchstart',e=>{
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    curX=startX;
    swiping=true;dir=null;
  },{passive:true});

  el.addEventListener('touchmove',e=>{
    if(!swiping)return;
    curX=e.touches[0].clientX;
    const dx=curX-startX;
    const dy=e.touches[0].clientY-startY;
    // Ignore vertical scrolling
    if(dir===null){ if(Math.abs(dy)>Math.abs(dx)+5){swiping=false;return;} if(Math.abs(dx)>6) dir=dx>0?'right':'left'; }
    if(!dir)return;
    if(dir==='left'){
      // swipe left → show delete
      const w=Math.min(DEL_W, Math.max(0,-dx));
      inner.style.transform=`translateX(${-w}px)`;
      if(bgLeft) bgLeft.style.width=w+'px';
      if(bgRight) bgRight.style.width='0';
    } else {
      // swipe right → show projects
      const w=Math.min(MAX, Math.max(0,dx));
      inner.style.transform=`translateX(${w}px)`;
      if(bgRight) bgRight.style.width=w+'px';
      if(bgLeft) bgLeft.style.width='0';
    }
  },{passive:true});

  el.addEventListener('touchend',()=>{
    if(!swiping){reset();return;}
    const dx=curX-startX;
    if(dir==='left'&&dx<-50){
      // Confirm delete
      el.style.transition='opacity .15s,transform .15s';
      el.style.opacity='0';el.style.transform='translateX(-40px)';
      setTimeout(()=>quickDeleteTask(id),180);
    } else if(dir==='right'&&dx>30){
      // Keep project panel open for selection
      inner.style.transform=`translateX(${MAX}px)`;
      if(bgRight) bgRight.style.width=MAX+'px';
      // Auto-close after 3s if no selection
      setTimeout(reset, 3000);
    } else {
      reset();
    }
    swiping=false;
  });

  // Also close on scroll
  el.closest('.todo-list')?.addEventListener('scroll',reset,{passive:true});
}

function assignProj(e, taskId, projId){
  e.stopPropagation();
  const t=tasks.find(t=>t.id===taskId); if(!t) return;
  t.projId=projId;

  else renderDaily();

function renderDailyTimeline(ds, dayTasks){
  const wrap=document.getElementById('tl-inner');
  const now=new Date();
  const isToday=ds===todayStr();
  const nowH=now.getHours(), nowMin=now.getMinutes();

  // Build 24h × 2 slots
  let html='';
  for(let h=0;h<24;h++){
    for(let half=0;half<2;half++){
      const isNowSlot=isToday&&h===nowH&&(half===0?nowMin<30:nowMin>=30);
      const hLabel=half===0?(h===0?'오전 12':h<12?`오전 ${h}`:h===12?'오후 12':`오후 ${h-12}`):'';
      html+=`<div class="tl-row${half===1?' half':''}${isNowSlot?' is-now':''}" 
        data-h="${h}" data-half="${half}"
        ondragover="event.preventDefault();this.querySelector('.tl-slot').classList.add('drop-target')"
        ondragleave="this.querySelector('.tl-slot').classList.remove('drop-target')"
        ondrop="onSlotDrop(event,${h},${half})">
        <div class="tl-hour${half===1?' half-lbl':''}">${hLabel}${half===1?'30':''}</div>
        <div class="tl-slot" onclick="onSlotClick(${h},${half})"></div>
      </div>`;
    }
  }

  // Now line
  if(isToday){
    const nowPx=minsToTop(nowH*60+nowMin);
    html+=`<div class="tl-now-wrap" style="top:${nowPx}px"><div class="tl-now-circle"></div><div class="tl-now-line"></div></div>`;
  }
  wrap.innerHTML=html;

  // Render task blocks
  dayTasks.filter(t=>t.startHour!==undefined&&t.startHour!==null&&t.startHour!=='').forEach(t=>{
    renderTaskBlock(t, wrap);
  });

  // Render gcal blocks for this day
  gcalEvents.filter(e=>{
    const ed=e.start.dateTime?e.start.dateTime.split('T')[0]:e.start.date;
    return ed===ds&&e.start.dateTime;
  }).forEach(e=>{
    renderGcalBlock(e, wrap);
  });

  // Scroll to 8am or now
  const scrollTo=isToday?Math.max(0,minsToTop(nowH*60+nowMin)-100):minsToTop(8*60);
  setTimeout(()=>{ const w=document.getElementById('daily-tl-wrap'); if(w) w.scrollTop=scrollTo; },50);
}

function renderTaskBlock(t, container){
  const startMins=(t.startHour||0)*60+(t.startMin||0);
  const dur=t.plannedTime||60;
  const top=minsToTop(startMins);
  const height=Math.max(26, (dur/30)*SLOT_H);
  const p=getProj(t.projId);

  const el=document.createElement('div');
  el.className='tl-block';
  el.id='tl-block-'+t.id;
  el.style.cssText=`top:${top}px;height:${height}px;background:${p.color}22;border:1.5px solid ${p.color}55;color:${p.color};left:58px;right:6px;position:absolute`;
  el.draggable=true;
  el.innerHTML=`<div class="tl-block-name">${t.name}</div><div class="tl-block-time">${fmtHM(t.startHour,t.startMin||0)} · ${fmtMins(dur)}</div><div class="tl-block-resize" data-id="${t.id}"></div>`;
  
  // Drag to move
  el.setAttribute('draggable','true');
  el.addEventListener('dragstart', e=>{ e.dataTransfer.setData('blockId',String(t.id)); e.dataTransfer.setData('type','move'); selectedBlockId=t.id; e.stopPropagation(); });
  // Click to select
  el.addEventListener('click', e=>{
    e.stopPropagation();
    if(selectedBlockId===t.id){ openPanel(t.id); }
    else { selectBlock(t.id); }
  });
  // Right-click context menu
  el.addEventListener('contextmenu', e=>{ e.preventDefault(); e.stopPropagation(); showCtxMenu(e,t.id,'block'); });
  // Resize handle
  const resizeHandle=el.querySelector('.tl-block-resize');
  resizeHandle.addEventListener('mousedown', e=>{ e.stopPropagation(); e.preventDefault(); startResize(e, t.id, el); });

  container.appendChild(el);
}

function renderGcalBlock(e, container){
  const start=new Date(e.start.dateTime);
  const end=e.end?.dateTime?new Date(e.end.dateTime):new Date(start.getTime()+3600000);
  const startMins=start.getHours()*60+start.getMinutes();
  const dur=Math.round((end-start)/60000);
  const top=minsToTop(startMins);
  const height=Math.max(26,(dur/30)*SLOT_H);
  const color=e._calColor||'#4285f4';

  const el=document.createElement('div');
  el.className='tl-block';
  el.style.cssText=`top:${top}px;height:${height}px;background:${color}22;border:1.5px solid ${color}55;color:${color};left:58px;right:6px;position:absolute;cursor:default`;
  el.innerHTML=`<div class="tl-block-name">📅 ${e.summary||'(일정)'}</div><div class="tl-block-time">${fmtHM(start.getHours(),start.getMinutes())} · ${fmtMins(dur)}</div>`;
  container.appendChild(el);
}

// ── Context Menu ──────────────────────────────────────────
let ctxMenu=null;
function showCtxMenu(e,id,type){
  e.stopPropagation();
  hideCtxMenu();
  const t=tasks.find(t=>t.id===id);
  const menu=document.createElement('div');
  menu.className='ctx-menu';
  menu.id='ctx-menu';
  const items=[
    {label:'✏️ 편집',action:()=>{openPanel(id);hideCtxMenu();}},
    {label:'⏰ 시간 설정',action:()=>{openPanel(id);hideCtxMenu();},show:type==='task'},
    {label:t?.status==='done'?'↩️ 미완료로':'✅ 완료',action:()=>{quickToggle(id,{stopPropagation:()=>{}});hideCtxMenu();}},
    {label:'🗑️ 삭제',danger:true,action:()=>{quickDeleteTask(id);hideCtxMenu();}},
  ].filter(i=>i.show!==false);
  menu.innerHTML=items.map((item,i)=>`<div class="ctx-item${item.danger?' danger':''}" data-idx="${i}">${item.label}</div>`).join('');
  document.body.appendChild(menu);

function quickDeleteTask(id){
  const toDelete=[id,...allDescendants(id).map(t=>t.id)];

  saveLocal();scheduleSave();renderDaily();renderWeekly();renderBoard();renderTree();renderStats();

}

// ── Drag & Drop ───────────────────────────────────────────
let dragTaskId=null;
function onTodoDragStart(e, id){ e.dataTransfer.setData('taskId',id); e.dataTransfer.setData('type','todo'); dragTaskId=id; }
function onSlotDrop(e, h, half){

  const ds=dailyDateStr(dailyDate);

// ── Resize ────────────────────────────────────────────────
function startResize(e, taskId, el){
  const startY=e.clientY;
  const t=tasks.find(t=>t.id===taskId); if(!t) return;
  const startDur=t.plannedTime||60;
  function onMove(ev){
    const dy=ev.clientY-startY;
    const newDur=Math.max(30, Math.round((startDur+dy/SLOT_H*30)/30)*30);
    t.plannedTime=newDur;
    el.style.height=Math.max(26,(newDur/30)*SLOT_H)+'px';
    el.querySelector('.tl-block-time').textContent=fmtHM(t.startHour,t.startMin||0)+' · '+fmtMins(newDur);
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    saveLocal(); scheduleSave(); renderDaily();
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

// ── Weekly ────────────────────────────────────────────────
function getWeekDates(){
  const now=new Date();
  const dow=now.getDay();
  const monday=new Date(now); monday.setDate(now.getDate()-dow+1+(weekOffset*7));
  return Array.from({length:7},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d; });
}

function renderWeekly(){
  const dates=getWeekDates();
  const startStr=`${dates[0].getMonth()+1}/${dates[0].getDate()}`;
  const endStr=`${dates[6].getMonth()+1}/${dates[6].getDate()}`;
  document.getElementById('weekly-label').textContent=`${dates[0].getFullYear()}년 ${startStr} - ${endStr}`;

  const dayNames=['일','월','화','수','목','금','토'];
  const todayS=todayStr();

  // Weekly todo: all tasks this week
  const weekStrs=dates.map(d=>dailyDateStr(d));
  const weekTasks=tasks.filter(t=>weekStrs.includes(t.due)||t.status==='doing');
  const wList=document.getElementById('weekly-todo-list');
  wList.innerHTML=weekTasks.length===0
    ?'<div style="font-size:12px;color:var(--text3)">이번 주 작업 없음</div>'
    :weekTasks.map(t=>{
    const projBtns=projects.map(p=>`<div class="todo-swipe-proj" style="background:${p.color}" onclick="assignProj(event,${t.id},${p.id})">${p.icon}</div>`).join('');
    return`<div class="todo-item" data-id="${t.id}" draggable="true" ondragstart="onTodoDragStart(event,${t.id})">
      <div class="todo-swipe-right" id="swipe-right-${t.id}">${projBtns}</div>
      <div class="todo-swipe-left" id="swipe-left-${t.id}">🗑 삭제</div>
      <div class="todo-inner" id="todo-inner-${t.id}">
        <div class="todo-chk ${t.status==='done'?'done':''}" onclick="quickToggle(${t.id},event)">✓</div>
        <span class="todo-chk-dot" style="width:7px;height:7px;border-radius:50%;background:${getProj(t.projId).color};flex-shrink:0;display:inline-block"></span>
        <span class="todo-name ${t.status==='done'?'done':''}" style="font-size:12px" onclick="openPanel(${t.id})">${t.name}</span>
        <button class="todo-more" onclick="showCtxMenu(event,${t.id},'task')">···</button>
      </div>
    </div>`;}).join('');
  wList.querySelectorAll('.todo-item').forEach(el=>attachSwipe(el));

  // Weekly timeline grid
  const COLS=dates.length;
  const colW=`repeat(${COLS},1fr)`;
  let html=`<div class="weekly-grid">`;

  // Header
  html+=`<div class="weekly-header" style="display:grid;grid-template-columns:44px ${colW}">
    <div class="weekly-time-col"></div>
    ${dates.map(d=>{
      const isT=dailyDateStr(d)===todayS;
      return`<div class="weekly-day-hd${isT?' today-col':''}">${dayNames[d.getDay()]} ${d.getDate()}</div>`;
    }).join('')}
  </div>`;

  // Body rows: 24h × 2
  for(let h=0;h<24;h++){
    for(let half=0;half<2;half++){
      const lbl=half===0?(h===0?'12':h<12?`${h}`:h===12?'12':`${h-12}`):'';
      const ampm=half===0?(h<12?'am':'pm'):'';
      html+=`<div class="weekly-row${half?'  half-row':''}" style="display:grid;grid-template-columns:44px ${colW}">
        <div class="weekly-time-col">${half===0?lbl+ampm:''}</div>
        ${dates.map((d,di)=>{
          const ds=dailyDateStr(d);
          // tasks at this slot
          const slotTasks=tasks.filter(t=>t.due===ds&&(t.startHour===h)&&((t.startMin||0)===( half?30:0)));
          const gcalSlot=gcalEvents.filter(e=>{
            if(!e.start.dateTime) return false;
            const sd=new Date(e.start.dateTime);
            return dailyDateStr(sd)===ds&&sd.getHours()===h&&(half?sd.getMinutes()>=30:sd.getMinutes()<30);
          });
          const evHtml=slotTasks.map(t=>{const p=getProj(t.projId);return`<div class="weekly-block" style="background:${p.color}22;color:${p.color};border-left:2px solid ${p.color}" draggable="true" ondragstart="onWeeklyBlockDrag(event,${t.id})" onclick="event.stopPropagation();openPanel(${t.id})" oncontextmenu="event.preventDefault();event.stopPropagation();showCtxMenu(event,${t.id},'block')">${t.name}</div>`;}).join('')
            +gcalSlot.map(e=>{const c=e._calColor||'#4285f4';return`<div class="weekly-block" style="background:${c}22;color:${c};border-left:2px solid ${c}">${e.summary||''}</div>`;}).join('');
          return`<div class="weekly-cell" ondragover="event.preventDefault()" ondrop="onWeeklyCellDrop(event,'${ds}',${h},${half})" onclick="onWeekCellClick('${ds}',${h},${half})">${evHtml}</div>`;
        }).join('')}
      </div>`;
    }
  }
  html+='</div>';
  document.getElementById('weekly-tl-wrap').innerHTML=html;

  // Scroll to 8am
  setTimeout(()=>{ const w=document.getElementById('weekly-tl-wrap'); if(w) w.scrollTop=minsToTop(8*60); },50);
}

  const dates=getWeekDates();

  const newTask={id:nextTaskId++,name,parentId:null,projId:selProjId||projects[0]?.id||1,memo:'',status:'todo',tag:'etc',priority:'mid',due:ds,plannedTime:0};

    return`<div class="proj-card" onclick="openProjModal(${p.id})">
      <div class="proj-icon-big" style="background:${p.color}22">${p.icon}</div>
      <div class="proj-info"><div class="proj-name">${p.name}</div><div class="proj-meta">${p.desc||'설명 없음'}</div></div>
      <div class="proj-stats">
        <div class="proj-stat"><div class="proj-stat-n">${pt.length}</div><div class="proj-stat-l">작업</div></div>
        <div class="proj-stat"><div class="proj-stat-n" style="color:var(--green)">${done}</div><div class="proj-stat-l">완료</div></div>
        <div class="proj-stat"><div class="proj-stat-n" style="color:var(--blue)">${fmtMins(total)||'0m'}</div><div class="proj-stat-l">시간</div></div>
      </div>
    </div>`;}).join('');
}

// ── Side Panel ────────────────────────────────────────────
function openPanel(id){
  panelTaskId=id;
  const t=tasks.find(t=>t.id===id);if(!t)return;

  // breadcrumb
  const ancestors=getAncestors(id);
  const bc=document.getElementById('sp-breadcrumb');
  bc.innerHTML=ancestors.map(a=>`<span class="sp-bc-item" onclick="openPanel(${a.id})">${a.name}</span><span class="sp-bc-sep">›</span>`).join('')+`<span style="font-size:12px;color:var(--text2)">${t.name}</span>`;

  // populate project select
  const sel=document.getElementById('sp-proj');
  sel.innerHTML=projects.map(p=>`<option value="${p.id}">${p.icon} ${p.name}</option>`).join('');

  document.getElementById('sp-title').value=t.name;
  sel.value=t.projId;
  document.getElementById('sp-status').value=t.status;
  document.getElementById('sp-tag').value=t.tag;
  document.getElementById('sp-priority').value=t.priority;
  document.getElementById('sp-due').value=t.due||'';
  document.getElementById('sp-time').value=t.plannedTime||0;
  document.getElementById('sp-starthour').value=t.startHour??'';
  document.getElementById('sp-memo').value=t.memo||'';
  document.getElementById('sp-btn-del').style.visibility='visible';

  // subtasks
  renderPanelSubtasks(id);

  document.getElementById('sp-overlay').classList.add('open');
  document.getElementById('side-panel').classList.add('open');
}

function renderPanelSubtasks(id){
  const children=childTasks(id);
  const done=children.filter(c=>c.status==='done').length;
  const pct=children.length?Math.round(done/children.length*100):0;
  document.getElementById('sp-prog-text').textContent=children.length?`${done}/${children.length} 완료`:'';
  document.getElementById('sp-prog-fill').style.width=pct+'%';
  document.getElementById('sp-subtask-list').innerHTML=children.map(c=>`
    <div class="sp-sub-row" onclick="openPanel(${c.id})">
      <div class="chk ${c.status==='done'?'done':''}" onclick="quickToggle(${c.id},event)" style="width:14px;height:14px;font-size:9px">✓</div>
      <span class="sp-sub-name ${c.status==='done'?'done':''}">${c.name}</span>
      ${c.due?`<span class="sp-sub-date">${fmtDate(c.due)}</span>`:''}
      <span class="sp-sub-chevron">›</span>
    </div>`).join('');
}

function closeSidePanel(){
  document.getElementById('sp-overlay').classList.remove('open');
  document.getElementById('side-panel').classList.remove('open');
  panelTaskId=null;
}

function autoSavePanel(){if(panelTaskId!==null)savePanel(true);}
function savePanel(silent=false){
  if(panelTaskId===null)return;
  const t=tasks.find(t=>t.id===panelTaskId);if(!t)return;
  t.name=document.getElementById('sp-title').value.trim()||t.name;
  t.projId=parseInt(document.getElementById('sp-proj').value);
  t.status=document.getElementById('sp-status').value;
  t.tag=document.getElementById('sp-tag').value;
  t.priority=document.getElementById('sp-priority').value;
  t.due=document.getElementById('sp-due').value;
  t.plannedTime=parseInt(document.getElementById('sp-time').value)||0;
  const sh=document.getElementById('sp-starthour').value;
  t.startHour=sh===''?undefined:parseInt(sh);
  t.memo=document.getElementById('sp-memo').value;
  saveLocal();scheduleSave();syncTaskToGcal(t);
  if(!silent){showToast('저장됐어요');renderAll();}else{renderAll();}
}

function addSubTask(){
  if(panelTaskId===null)return;
  const parent=tasks.find(t=>t.id===panelTaskId);
  const newTask={id:nextTaskId++,name:'새 하위 작업',parentId:panelTaskId,projId:parent.projId,memo:'',status:'todo',tag:parent.tag||'etc',priority:'mid',due:'',plannedTime:0};
  tasks.push(newTask);
  saveLocal();scheduleSave();
  renderPanelSubtasks(panelTaskId);
  renderAll();
  // open the new subtask
  setTimeout(()=>openPanel(newTask.id),100);
}

let _confirmResolve=null;
function showConfirm(msg){
  return new Promise(resolve=>{
    _confirmResolve=resolve;
    document.getElementById('confirm-msg').textContent=msg;
    document.getElementById('confirm-box').classList.remove('hide');
  });
}
function confirmResolve(val){
  document.getElementById('confirm-box').classList.add('hide');
  if(_confirmResolve){_confirmResolve(val);_confirmResolve=null;}
}
function deleteTaskFromPanel(){
  if(panelTaskId===null)return;
  showConfirm('이 작업과 하위 작업을 모두 삭제할까요?').then(ok=>{
    if(!ok)return;
    const toDelete=[panelTaskId,...allDescendants(panelTaskId).map(t=>t.id)];
    tasks=tasks.filter(t=>!toDelete.includes(t.id));
    saveLocal();scheduleSave();closeSidePanel();renderAll();
  });
}

function openNewTask(){
  const newTask={id:nextTaskId++,name:'새 작업',parentId:null,projId:selProjId||projects[0]?.id||1,memo:'',status:'todo',tag:'etc',priority:'mid',due:todayStr(),plannedTime:0};
  tasks.unshift(newTask);
  syncTaskToGcal(newTask);
  saveLocal();scheduleSave();renderAll();
  openPanel(newTask.id);
}

let emojiCatIdx=0;

function buildIconGrid(){
  const disp=document.getElementById('emoji-display');
  if(disp) disp.textContent=selIcon;
  renderEmojiGrid(EMOJI_CATS[emojiCatIdx].emojis);
  // Build cat buttons
  const cats=document.getElementById('emoji-cats');
  if(cats) cats.innerHTML=EMOJI_CATS.map((c,i)=>`<button class="emoji-cat-btn${i===emojiCatIdx?' active':''}" onclick="switchEmojiCat(${i})" title="${c.name}">${c.label}</button>`).join('');
}
function renderEmojiGrid(emojis){
  const grid=document.getElementById('emoji-grid');
  if(!grid) return;
  grid.innerHTML=emojis.map(e=>`<button class="emoji-opt${e===selIcon?' sel':''}" onclick="selectIcon('${e}')">${e}</button>`).join('');
}
function filterEmoji(q){
  if(!q.trim()){renderEmojiGrid(EMOJI_CATS[emojiCatIdx].emojis);return;}
  const all=EMOJI_CATS.flatMap(c=>c.emojis);
  renderEmojiGrid(all.filter((_,i)=>i<80)); // show more when searching
}
function switchEmojiCat(i){
  emojiCatIdx=i;
  document.getElementById('emoji-search').value='';
  buildIconGrid();
}
function buildColorGrid(){document.getElementById('color-grid').innerHTML=COLORS.map(c=>`<div class="color-opt ${c===selColor?'sel':''}" style="background:${c}" onclick="selectColor('${c}')"></div>`).join('');}
function selectIcon(ic){selIcon=ic;buildIconGrid();}
function selectColor(c){selColor=c;buildColorGrid();}
function openProjModal(id){
  editingProjId=id;
  if(id===null){document.getElementById('proj-modal-title').textContent='새 프로젝트';document.getElementById('pf-name').value='';document.getElementById('pf-desc').value='';selIcon=ICONS[0];selColor=COLORS[0];document.getElementById('proj-btn-del').style.visibility='hidden';}
  else{const p=projects.find(p=>p.id===id);document.getElementById('proj-modal-title').textContent='프로젝트 수정';document.getElementById('pf-name').value=p.name;document.getElementById('pf-desc').value=p.desc||'';selIcon=p.icon;selColor=p.color;document.getElementById('proj-btn-del').style.visibility='visible';}
  buildIconGrid();buildColorGrid();
  document.getElementById('proj-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('pf-name').focus(),50);
}
function closeProjModal(){document.getElementById('proj-overlay').classList.remove('open');editingProjId=null;}
function closeProjOverlay(e){if(e.target===document.getElementById('proj-overlay'))closeProjModal();}
function saveProject(){
  const name=document.getElementById('pf-name').value.trim();if(!name)return;
  const data={name,icon:selIcon,color:selColor,desc:document.getElementById('pf-desc').value.trim()};
  if(editingProjId===null)projects.push({id:nextProjId++,...data});
  else{const idx=projects.findIndex(p=>p.id===editingProjId);if(idx>-1)projects[idx]={...projects[idx],...data};}
  saveLocal();scheduleSave();closeProjModal();renderAll();
}
function deleteProject(){
  showConfirm('프로젝트와 모든 작업을 삭제할까요?').then(ok=>{
    if(!ok)return;
    tasks=tasks.filter(t=>t.projId!==editingProjId);
    projects=projects.filter(p=>p.id!==editingProjId);
    if(selProjId===editingProjId)selProjId=null;
    saveLocal();scheduleSave();closeProjModal();renderAll();
  });
}
